// tiene il document.title originale tra l'avvio della stampa e l'evento
// 'afterprint', per poterlo ripristinare dopo aver esportato il PDF
let printTitleBackup = null;
// Lettere latine che NFD NON scompone (non sono "lettera + accento", sono
// lettere a sé) e che il filtro ASCII cancellerebbe: trascritte a mano,
// maiuscole comprese ("Søren Ærø" → "Soren_AEro"). Solo lettere latine di
// nomi europei: gli alfabeti non latini NON vengono trascritti e restano
// eliminati.
const SLUG_LETTER_MAP = {
  'Ø':'O', 'ø':'o', 'Æ':'AE', 'æ':'ae', 'Œ':'OE', 'œ':'oe',   // danese, norvegese, francese
  'Ł':'L', 'ł':'l', 'Đ':'D', 'đ':'d',                          // polacco, croato/serbo
  'ẞ':'SS', 'ß':'ss',                                          // tedesco
  'Ð':'D', 'ð':'d', 'Þ':'Th', 'þ':'th',                        // islandese
  'ı':'i', 'Ħ':'H', 'ħ':'h'                                    // turco, maltese
};
const SLUG_LETTER_RE = new RegExp('[' + Object.keys(SLUG_LETTER_MAP).join('') + ']', 'g');
function slugifyForFilename(str){
  // NFD separa ogni lettera dal suo accento (ò → o + accento): tolti gli
  // accenti (\p{M} = tutti i segni combinanti) resta la lettera ("Niccolò" →
  // "Niccolo", non "Niccol"). Poi le lettere latine che NFD non scompone,
  // dalla mappa qui sopra. Usata sia per il PDF della scheda sia per il CSV
  // delle statistiche.
  // L'ultimo passaggio ripulisce gli "_" rimasti orfani: lo spazio diventa "_"
  // prima che le lettere non latine vengano eliminate, quindi "Владимир Петров"
  // lascerebbe un "_" solitario invece di una stringa vuota (e il ripiego non
  // scatterebbe mai).
  return String(str||'').trim().normalize('NFD').replace(/\p{M}/gu,'').replace(SLUG_LETTER_RE, c=>SLUG_LETTER_MAP[c]).replace(/\s+/g,'_').replace(/[^A-Za-z0-9_-]/g,'').replace(/_+/g,'_').replace(/^_+|_+$/g,'');
}

function buildPrintCardHtml({eyebrow, name, sub, fields, stats, note}){
  // ogni gruppo riparte da capo nella griglia a 2 colonne (l'etichetta di
  // gruppo occupa un'intera riga), quindi la colonna destra/sinistra si
  // calcola sull'indice DENTRO al gruppo, non sulla posizione nel DOM
  const pcardStat = (k, idxInGroup)=>{
    const def = CARD_FIELD_DEFS[k];
    const rightCls = idxInGroup%2===1 ? ' pcard-stat-right' : '';
    return `<div class="pcard-stat${rightCls}"><div class="pcard-stat-value">${escapeHtml(String(def.fmt(stats)))}</div><div class="pcard-stat-label">${escapeHtml(def.label)}</div></div>`;
  };
  const pcardGroupLabel = title => `<div class="pcard-group-label">${escapeHtml(title)}</div>`;
  let statsHtml = '';
  if(stats){
    const groups = groupCardFields(fields);
    if(groups.allenamenti.length) statsHtml += pcardGroupLabel('ALLENAMENTI') + groups.allenamenti.map(pcardStat).join('');
    if(groups.partite.length) statsHtml += pcardGroupLabel('PARTITE E RAGGRUPPAMENTI') + groups.partite.map(pcardStat).join('');
  }
  return `
    <div class="pcard">
      <div class="pcard-header">
        <div class="pcard-eyebrow">${escapeHtml(eyebrow||'')}</div>
        <h1 class="pcard-name">${escapeHtml(name||'')}</h1>
        ${sub? `<div class="pcard-sub">${escapeHtml(sub)}</div>`:''}
      </div>
      <div class="pcard-stats-grid">${statsHtml}</div>
      ${note? `<div class="pcard-note">${escapeHtml(note)}</div>`:''}
      <div class="pcard-footer">Touchline</div>
    </div>
  `;
}

// Nessun PDF senza nome: la scheda va ai genitori. Un giocatore con nome e
// cognome entrambi vuoti (impossibile da creare dal form, ma possibile in un
// backup importato) non viene stampato; l'avviso passa da showAlert, che
// disegna solo #popup-zone e lascia intatto tutto il resto.
function cannotPrintWithoutName(player){
  if(fullName(player)) return false;
  showAlert('Questo giocatore non ha né nome né cognome: completa il nome prima di stampare la scheda.');
  return true;
}

function printHomeCard(){
  const seasonId = UI.homeSeasonId || (STATE.seasons[0] && STATE.seasons[0].id);
  if(!seasonId){ return; }
  const playersInSeason = STATE.players.filter(p=>{
    const teamIds = teamsOfSeason(seasonId).map(t=>t.id);
    return STATE.assignments.some(a=>teamIds.includes(a.teamId) && a.playerId===p.id);
  });
  const playerId = UI.homePlayerId && playersInSeason.some(p=>p.id===UI.homePlayerId) ? UI.homePlayerId : (playersInSeason[0] && playersInSeason[0].id);
  const player = getPlayer(playerId);
  if(!player){ return; }
  if(cannotPrintWithoutName(player)){ return; }
  const season = getSeason(seasonId);
  const stats = computePlayerAggregateStats(player.id, seasonId);
  const fields = UI.homeCardFields || DEFAULT_CARD_FIELDS;
  const subParts = [];
  if(player.dataNascita) subParts.push(`Nato il ${formatIt(player.dataNascita)}`);
  subParts.push(`Squadre: ${stats.teamNames.join(', ')||'—'}`);
  const eyebrow = `${season?season.nome:''} · tutte le squadre`;
  const area = document.getElementById('print-area');
  area.innerHTML = buildPrintCardHtml({
    eyebrow: STATE.clubName ? `${STATE.clubName} · ${eyebrow}` : eyebrow,
    name: fullName(player),
    sub: subParts.join(' · '),
    fields, stats,
    note: player.homeCardNote || ''
  });
  document.body.classList.add('printing');
  printTitleBackup = document.title;
  // "Giocatore" come ripiego se il nome, ripulito, non lascia nulla (alfabeti non latini)
  document.title = `${slugifyForFilename(fullName(player)) || 'Giocatore'}_SchedaIndividuale`;
  window.print();
}

function printPlayerCard(){
  const team = currentTeam();
  // stessa lista di giocatori "assegnati almeno una volta a questa squadra"
  // usata da renderSchedaView (non solo la rosa attiva): senza, un
  // UI.cardPlayerId invalido potrebbe far scegliere qui un fallback diverso
  // da quello già mostrato a schermo, stampando la scheda di un altro
  // giocatore rispetto a quella visualizzata.
  const allIds = [...new Set(STATE.assignments.filter(a=>a.teamId===team.id).map(a=>a.playerId))];
  const players = allIds.map(getPlayer).filter(Boolean).sort((a,b)=>(a.nome+a.cognome).localeCompare(b.nome+b.cognome));
  const selectedId = UI.cardPlayerId && players.some(p=>p.id===UI.cardPlayerId) ? UI.cardPlayerId : (players[0] && players[0].id);
  const player = getPlayer(selectedId);
  if(!player){ return; }
  if(cannotPrintWithoutName(player)){ return; }
  const stats = computePlayerStats(team.id, player.id, '');
  const fields = UI.cardFields || (team.cardFields && team.cardFields.length? team.cardFields : DEFAULT_CARD_FIELDS);
  const eyebrow = `${getSeason(team.seasonId)?.nome||''} · ${team.nome}`;
  const area = document.getElementById('print-area');
  area.innerHTML = buildPrintCardHtml({
    eyebrow: STATE.clubName ? `${STATE.clubName} · ${eyebrow}` : eyebrow,
    name: fullName(player),
    sub: player.dataNascita? `Nato il ${formatIt(player.dataNascita)}` : '',
    fields, stats,
    note: player.cardNote || ''
  });
  document.body.classList.add('printing');
  printTitleBackup = document.title;
  // "Giocatore" come ripiego se il nome, ripulito, non lascia nulla (alfabeti non latini)
  document.title = `${slugifyForFilename(fullName(player)) || 'Giocatore'}_SchedaIndividuale`;
  window.print();
}
// listener registrato qui (non in events.js): la registrazione
// avviene comunque dopo il caricamento completo dello script, quindi
// la posizione fisica nel file non incide sul comportamento
window.addEventListener('afterprint', ()=>{

/* =========================================================
   BACKUP E RIPRISTINO (spostare i dati tra dispositivi)
   ========================================================= */
// Nome del file di backup: data e ora LOCALI dell'esportazione, al minuto
// (es. Backup-Touchline-2026-09-20-1530.json). Due export nello stesso minuto
// danno lo stesso nome: il browser aggiunge da solo un numero, non sovrascrive.
function nomeFileBackup(d){
  d = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return `Backup-Touchline-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
}
// Dopo la conferma di un export: il promemoria sparisce subito. Solo DOM
// diretto (display su un id), MAI render(): il modale Backup è aperto sotto e
// un render() lo ricostruirebbe. Se il topbar viene ridisegnato più tardi, il
// puntino non torna perché backupReminder() ora è null.
function hideBackupReminderUI(){
  ['backup-dot','backup-reminder-line'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.style.display = 'none';
  });
}
// Registra che l'utente ha CONFERMATO l'export (download avviato, non "salvato").
function recordBackupStarted(){
  saveBackupInfo({ lastExportAt: new Date().toISOString() });
  hideBackupReminderUI();
}
function backupReminderText(rem){
  if(rem.mai) return `Nessun backup avviato da questo dispositivo, e ci sono dati da almeno ${rem.giorni} giorni. Ti consiglio di esportarne uno.`;
  return `Ultimo backup avviato il ${formatDateTimeIt(new Date(rem.da).toISOString())} (${rem.giorni} giorni fa): da allora i dati potrebbero essere cambiati. Ti consiglio di esportarne uno nuovo.`;
}
function exportBackup(){
  const lastAction = STATE.meta && STATE.meta.lastAction;
  const updatedAt = STATE.meta && STATE.meta.updatedAt ? formatDateTimeIt(STATE.meta.updatedAt) : '';
  const msg = lastAction
    ? `Stai per esportare il backup (il file avrà un nome con data e ora: quelli esportati prima restano dove sono).\n\nUltima azione registrata in questi dati: ${lastAction}${updatedAt?` (${updatedAt})`:''}.\n\nProcedere con l'esportazione?`
    : `Stai per esportare il backup (il file avrà un nome con data e ora: quelli esportati prima restano dove sono). Procedere?`;
  showConfirm(msg, () => {
    // scrive subito un salvataggio ancora in attesa (debounce 150ms): così
    // meta.updatedAt non supera la data dell'export e il promemoria non
    // scambia quel salvataggio ritardato per una modifica successiva
    flushPendingSave();
    const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeFileBackup();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    recordBackupStarted();
  });
}
/* =========================================================
   IMPORT DEL BACKUP
   -----------------------------------------------------------
   Ordine: 1) lettura e validazione (nessun effetto su STATE né sul disco)
           2) conferma unica, solo se il telefono ha già dei dati
           3) commit protetto: prima in memoria (con render), poi UNA sola
              scrittura su disco.
   Qualsiasi errore prima della scrittura lascia il disco intatto (un setItem che
   fallisce non modifica il valore precedente) e si ripristina solo la memoria: il
   ripristino non deve mai riscrivere il vecchio stato, quindi non può a sua volta
   fallire per mancanza di spazio.
   ========================================================= */
const TESTO_IMPORT_NON_BACKUP = "Questo file non sembra un backup di Touchline, oppure è danneggiato. Non è stato cambiato niente: i tuoi dati sono ancora quelli di prima.";
const TESTO_IMPORT_ILLEGGIBILE = "Non è stato possibile leggere il file. Non è stato cambiato niente: i tuoi dati sono ancora quelli di prima.";
const TESTO_IMPORT_FALLITO = "L'importazione non è riuscita. I tuoi dati sono stati lasciati come prima. Riprova con un altro file di backup.";
const TESTO_IMPORT_SPAZIO = "Non c'è abbastanza spazio per importare il backup. Non è stato cambiato niente.";
const TESTO_IMPORT_RIPRISTINO_FALLITO = "Qualcosa non ha funzionato nel mostrare i dati. I tuoi dati non sono stati cambiati. Chiudi e riapri l'app.";

// Campi di UI che dipendono dai dati (id di stagioni, giocatori, tornei…): dopo un import
// puntano a cose che non esistono più. Vanno riportati a questi valori. seasonId resta vuoto
// di proposito: la stagione la sceglie il mister da Home → Stagioni.
const UI_DOPO_IMPORT = { screen:'home', seasonId:null, teamId:null, homeSeasonId:null, homePlayerId:null, cardPlayerId:null, statsTournamentFilter:'', cardFields:null, homeCardFields:null, modal:null };

function pluraleIt(n, uno, molti){ return n + ' ' + (n===1 ? uno : molti); }
function dataValidaIso(x){ return typeof x==='string' && !isNaN(Date.parse(x)); }

// Conteggi di un insieme di dati (STATE oppure lo stato costruito dal backup) e la sua data.
function riepilogoDati(s, dataIso){
  return { stagioni:s.seasons.length, squadre:s.teams.length, giocatori:s.players.length, impegni:s.events.length, tornei:s.tournaments.length, data:dataIso };
}
function bloccoRiepilogo(titolo, r, conTornei){
  const righe = [titolo,
    pluraleIt(r.stagioni,'stagione','stagioni') + ', ' + pluraleIt(r.squadre,'squadra','squadre'),
    pluraleIt(r.giocatori,'giocatore','giocatori') + ', ' + pluraleIt(r.impegni,'impegno','impegni')];
  if(conTornei) righe.push(pluraleIt(r.tornei,'torneo','tornei'));
  if(dataValidaIso(r.data)) righe.push('Aggiornati il ' + formatDateTimeIt(r.data));
  return righe.join('\n');
}
// Testo della conferma unica. Non usa mai "Ultima azione" (non è affidabile: non registra
// eliminazioni e rinomine, mostra la data dell'impegno e sparisce dopo un import).
// updatedAt può essere aggiornata anche da salvataggi senza modifiche reali: per questo
// "risulta più vecchio".
function messaggioConfermaImport(backup, telefono){
  // "vuoto" = le stesse 5 liste di hasAnyData a zero (assignments esclusa di proposito)
  const vuoto = ['stagioni','squadre','giocatori','impegni','tornei'].every(k => backup[k]===0);
  const conTornei = backup.tornei>0 || telefono.tornei>0;
  let apertura;
  if(vuoto){
    apertura = 'Attenzione: questo backup è vuoto. Se lo importi, cancelli tutti i dati che hai sul telefono.';
  } else if(dataValidaIso(backup.data) && dataValidaIso(telefono.data) && Date.parse(backup.data) < Date.parse(telefono.data)){
    apertura = 'Attenzione: questo backup risulta più vecchio dei dati che hai sul telefono.';
  } else if(!dataValidaIso(backup.data)){
    apertura = 'Questo backup non ha una data valida: non posso dirti se è più vecchio o più recente dei dati del telefono.';
  } else {
    apertura = 'Stai per sostituire i dati del telefono con quelli del backup.';
  }
  return apertura + '\n\n' + bloccoRiepilogo('Nel backup:', backup, conTornei) + '\n\n' + bloccoRiepilogo('Sul telefono ora:', telefono, conTornei) +
    '\n\nQuello che hai ora sul telefono sparirà. Se non ne hai un backup, non potrai recuperarlo.';
}
function messaggioImportato(s){
  return 'Backup importato: ' + pluraleIt(s.players.length,'giocatore','giocatori') + ', ' + pluraleIt(s.teams.length,'squadra','squadre') + ', ' + pluraleIt(s.events.length,'impegno','impegni') + '.';
}

// Costruisce il nuovo stato dai dati del backup (già validati e migrati). Nessun effetto.
function costruisciStatoImport(data){
  const testoOnull = v => (typeof v==='string' && v) ? v : null;
  const nuovo = {
    // la schemaVersion del backup (già portata avanti da migrateState) si conserva:
    // senza, un backup di una versione più recente verrebbe riscritto con quella di
    // questa app al primo salvataggio
    meta: { updatedAt: null, schemaVersion: (data.meta && typeof data.meta.schemaVersion==='number') ? data.meta.schemaVersion : CURRENT_SCHEMA_VERSION },
    userName: testoOnull(data.userName),
    clubName: testoOnull(data.clubName),
    hasSeenInfoTip: !!data.hasSeenInfoTip,
    primaryTeamId: testoOnull(data.primaryTeamId)
  };
  LISTE_BACKUP_OBBLIGATORIE.concat(LISTE_BACKUP_FACOLTATIVE).forEach(k => { nuovo[k] = Array.isArray(data[k]) ? data[k] : []; });
  return nuovo;
}

// Ripristina la memoria (STATE e campi UI) com'erano prima dell'import. Il disco non è mai
// stato toccato. Restituisce false se anche il render() del ripristino lancia un errore.
function ripristinaDopoImport(vecchioSTATE, vecchiaUI){
  STATE = vecchioSTATE; window.STATE = vecchioSTATE;
  Object.assign(UI, vecchiaUI);
  clearTimeout(saveTimer); saveDirty = false;   // nessun salvataggio ritardato deve scattare dopo il ripristino
  try{ render(); return true; }
  catch(err){ console.error('Errore anche nel ripristino dopo l\'import', err); return false; }
}
// Commit protetto dell'import. È l'unico punto che chiama render() (una volta per l'import,
// una per l'eventuale ripristino); il modale Backup non ha dati non salvati.
// Cronologia: la sync resta SOSPESA per tutto il commit (historyHold) e si rilascia in finally,
// anche con un'eccezione. Così la cronologia non si muove finché non si sa se l'import è
// riuscito: se fallisce, lo stato e il modale tornano com'erano e non è partita nessuna
// operazione; se riesce, al rilascio parte UNA sola riconciliazione (Home, con l'avviso). Quel go(-k)
// ha le protezioni di L2: k non supera le voci contigue con lo stesso URL (Navigation API) né la profondità
// massima e, se la Navigation API manca, NON si tenta nessun go(): la cronologia si riallinea e restano
// gli Indietro "a vuoto" (apiObbligatoria).
function eseguiImport(nuovo){
  historyHold();
  try{
    flushPendingSave();                            // modifiche ancora in coda: prima su disco, così entrano nello stato da ripristinare
    const vecchioSTATE = STATE;
    const vecchiaUI = {};
    Object.keys(UI_DOPO_IMPORT).forEach(k => { vecchiaUI[k] = UI[k]; });
    clearTimeout(saveTimer); saveDirty = false;
    const fallito = testo => showAlert(ripristinaDopoImport(vecchioSTATE, vecchiaUI) ? testo : TESTO_IMPORT_RIPRISTINO_FALLITO);
    try{
      STATE = nuovo; window.STATE = nuovo;
      Object.assign(UI, UI_DOPO_IMPORT);           // Home, nessuna stagione scelta, id vecchi azzerati, modale chiuso
      render();
    }catch(err){
      console.error('Errore durante l\'import', err);
      fallito(TESTO_IMPORT_FALLITO); return;
    }
    if(!scriviStato()){ fallito(TESTO_IMPORT_SPAZIO); return; }
    // riuscito: la selezione ricordata non deve puntare ai vecchi id
    saveLastSelection({seasonId:null, teamId:null});
    showAlert(messaggioImportato(nuovo));
  }finally{
    historyRelease({apiObbligatoria:true});
  }
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onerror = () => { showAlert(TESTO_IMPORT_ILLEGGIBILE); };
  reader.onload = (evt) => {
    let nuovo, dataBackup;
    try{
      const grezzo = JSON.parse(evt.target.result);
      if(!validaBackup(grezzo).ok){ showAlert(TESTO_IMPORT_NON_BACKUP); return; }
      const data = migrateState(grezzo);
      dataBackup = data.meta && data.meta.updatedAt;
      nuovo = costruisciStatoImport(data);
    }catch(err){
      showAlert(TESTO_IMPORT_NON_BACKUP); return;
    }
    // telefono senza dati: niente da perdere, nessuna conferma (flusso "importa il tuo backup")
    if(!hasAnyData()){ eseguiImport(nuovo); return; }
    showConfirm(
      messaggioConfermaImport(riepilogoDati(nuovo, dataBackup), riepilogoDati(STATE, STATE.meta && STATE.meta.updatedAt)),
      () => eseguiImport(nuovo),
      {danger:true, confirmLabel:'Sostituisci i dati'}
    );
  };
  try{ reader.readAsText(file); }
  catch(err){ showAlert(TESTO_IMPORT_ILLEGGIBILE); }
}

function modalBackup(){

  const lastActionLabel = STATE.meta && STATE.meta.lastAction ? STATE.meta.lastAction : null;
  // promemoria backup: calcolato all'apertura del modale

    <div class="banner" style="margin:0 0 14px;">🕓 Dati di questo dispositivo aggiornati il: <strong>&nbsp;${escapeHtml(updatedLabel)}</strong>${lastActionLabel? `<br><span style="font-size:13px;font-weight:400;">Ultima azione: ${escapeHtml(lastActionLabel)}</span>`:''}</div>
    ${reminderLine}
    <button class="btn block" data-action="export-backup">Esporta backup (.json)</button>
    <p class="muted" style="margin-top:8px;">Il file ha un nome con la data e l'ora dell'esportazione (per esempio Backup-Touchline-2026-09-20-1530.json): se esporti di nuovo, i backup precedenti restano dove sono e ne viene creato uno nuovo. Se vuoi scegliere sempre tu dove salvarlo, imposta il tuo browser su "Chiedi sempre dove salvare i file" nelle sue impostazioni. Una volta salvato il file, mandalo a te stesso (email o WhatsApp) o copialo su Google Drive: così puoi recuperare la stagione se cambi telefono o perdi i dati.</p>
    <div class="divider"></div>

    </label>
    <p class="muted">⚠️ Importare un backup sostituisce tutti i dati presenti ora su questo dispositivo. Prima di procedere l'app ti mostra cosa c'è nel backup e cosa c'è sul telefono, e ti segnala se il backup è più vecchio.</p>
    </div>
  `;

/* =========================================================
   CALCOLO STATISTICHE
   ========================================================= */
// Eventi allenamento/partita-raggruppamento di una squadra, già filtrati per
// torneo: preparazione condivisa da computeTeamStats (tutta la rosa) e
// computePlayerStats (un solo giocatore), fatta una sola volta per ciascuna
// — mai ripetuta per ogni giocatore, altrimenti computeTeamStats tornerebbe
// a rifiltrare STATE.events una volta per giocatore invece che una sola
// volta in totale.
function teamEventsForStats(teamId, tournamentFilter){
  const trainingEvents = STATE.events.filter(e=>e.teamId===teamId && e.type==='allenamento');
  const matchLikeEvents = STATE.events.filter(e=>e.teamId===teamId && (e.type==='partita' || e.type==='raggruppamento'))
    .filter(e=> !tournamentFilter || e.torneoId===tournamentFilter);
  return {trainingEvents, matchLikeEvents};
}

// Statistiche di UN solo giocatore in una squadra — da preferire a
// computeTeamStats(...).find(...) ovunque serva solo la riga di un
// giocatore specifico, per non ricalcolare inutilmente tutta la rosa.
function computePlayerStats(teamId, playerId, tournamentFilter){
  const {trainingEvents, matchLikeEvents} = teamEventsForStats(teamId, tournamentFilter);
  return accumulatePlayerStats(playerId, trainingEvents, matchLikeEvents);
}

function computeTeamStats(teamId, tournamentFilter){
  const allAssignments = STATE.assignments.filter(a=>a.teamId===teamId);
  const playerIds = [...new Set(allAssignments.map(a=>a.playerId))];
  const {trainingEvents, matchLikeEvents} = teamEventsForStats(teamId, tournamentFilter);

  return playerIds.map(pid=>{
    const player = getPlayer(pid);
    if(!player) return null;
    const s = accumulatePlayerStats(pid, trainingEvents, matchLikeEvents);
    return { player, ...s };
  }).filter(Boolean).sort((a,b)=> (a.player.nome+a.player.cognome).localeCompare(b.player.nome+b.player.cognome));
}

// Accumula presenze/gol/cartellini di UN giocatore su un set di eventi allenamento + un set di eventi partita/raggruppamento
function accumulatePlayerStats(pid, trainingEvents, matchLikeEvents){
  let presAll=0, assAll=0, ritAll=0;
  trainingEvents.forEach(e=>{
    const v = (e.presenze||{})[pid];
    if(v==='P') presAll++; else if(v==='A') assAll++; else if(v==='R') { presAll++; ritAll++; }
    // 'NP' o assente dalla mappa -> non conteggiato
  });
  const totAll = presAll + assAll;

  let gol=0, assist=0, giallo=0, rosso=0;
  let presPartita=0, assPartita=0, presRaggr=0, assRaggr=0;
  let nonConvPartita=0, nonConvRaggr=0;
  matchLikeEvents.forEach(e=>{
    const g = e.type==='partita' ? (e.giocatori||{})[pid] : (e.type==='raggruppamento' ? (e.squadra||{})[pid] : null);
    if(!g) return;
    if(g.stato==='P'){
      gol += Number(g.gol||0);
      assist += Number(g.assist||0);
      giallo += Number(g.giallo||0);
      if(g.rosso) rosso++;
    }
    // 'NP' -> non conteggiato
    if(e.type==='partita'){
      if(g.stato==='A') assPartita++;
      else if(g.stato==='P') presPartita++;
      else if(g.stato==='NC') nonConvPartita++;
    } else { // raggruppamento
      if(g.stato==='A') assRaggr++;
      else if(g.stato==='P') presRaggr++;
      else if(g.stato==='NC') nonConvRaggr++;
    }
  });
  const totPartita = presPartita + assPartita;
  const totRaggr = presRaggr + assRaggr;
  // presPart/assPart/totPart derivati da *Partita + *Raggr (non un conteggio
  // parallelo indipendente), stesso principio già usato per nonConvPart
  const presPart = presPartita + presRaggr;
  const assPart = assPartita + assRaggr;
  const totPart = totPartita + totRaggr;
  return {
    presAll, assAll, ritAll, totAll, percAll: totAll? presAll/totAll : null,
    presPartita, assPartita, totPartita, percPartita: totPartita? presPartita/totPartita : null,
    presRaggr, assRaggr, totRaggr, percRaggr: totRaggr? presRaggr/totRaggr : null,
    presPart, assPart, totPart, percPart: totPart? presPart/totPart : null,
    nonConvPartita, nonConvRaggr,
    nonConvPart: nonConvPartita + nonConvRaggr,
    gol, assist, giallo, rosso
  };
}

// Statistiche di un giocatore aggregate su tutte le squadre a cui è assegnato in una stagione
function computePlayerAggregateStats(playerId, seasonId){
  const teamIds = teamsOfSeason(seasonId)
    .filter(t => STATE.assignments.some(a=>a.teamId===t.id && a.playerId===playerId))
    .map(t=>t.id);
  const trainingEvents = STATE.events.filter(e=>teamIds.includes(e.teamId) && e.type==='allenamento');
  const matchLikeEvents = STATE.events.filter(e=>teamIds.includes(e.teamId) && (e.type==='partita' || e.type==='raggruppamento'));
  const s = accumulatePlayerStats(playerId, trainingEvents, matchLikeEvents);
  return { ...s, teamNames: teamIds.map(id=>{ const t=getTeam(id); return t?t.nome:null; }).filter(Boolean) };
}
function pct(v){ return v==null? '—' : Math.round(v*100)+'%'; }

// Colonne statistiche (senza "Giocatore") per una modalità di visualizzazione:
// 'allenamenti' | 'totale' | 'partita' | 'raggruppamento'. Unica fonte usata sia
// dalla tabella statistiche squadra sia dal riepilogo nella vista andamento,
// così restano sempre le stesse etichette/colonne (incluso il rispetto di
// team.mode per Assist/cartellini).
// pctRounded: stessa formula di pct() ma come numero puro (arrotondato,
// senza simbolo "%"), usata per l'esportazione CSV — vuoto se il dato è null
function pctRounded(v){ return v==null? '' : Math.round(v*100); }

function statsColumnsForMode(matchMode, team){
  if(matchMode==='allenamenti'){
    return [
      {key:'presAll', label:'Pres.Tot.All.', get:s=>s.presAll, render:s=>s.presAll, csv:s=>s.presAll},
      {key:'assAll', label:'Ass.All.', get:s=>s.assAll, render:s=>s.assAll, csv:s=>s.assAll},
      {key:'ritAll', label:'Rit.', get:s=>s.ritAll, render:s=>s.ritAll, csv:s=>s.ritAll},
      {key:'percAll', label:'% All.', get:s=>s.percAll==null?-1:s.percAll, render:s=>pct(s.percAll), csv:s=>pctRounded(s.percAll)},
      {key:'percAllPonderata', label:'% Pond.', get:s=>s.percAllPonderata==null?-1:s.percAllPonderata, render:s=>pct(s.percAllPonderata), csv:s=>pctRounded(s.percAllPonderata)},
    ];
  }
  const matchFieldMap = {
    totale: {pres:'presPart', ass:'assPart', perc:'percPart', nonConv:'nonConvPart', suffix:'Part.'},
    partita: {pres:'presPartita', ass:'assPartita', perc:'percPartita', nonConv:'nonConvPartita', suffix:'Partita'},
    raggruppamento: {pres:'presRaggr', ass:'assRaggr', perc:'percRaggr', nonConv:'nonConvRaggr', suffix:'Raggr.'},
  };
  const mf = matchFieldMap[matchMode] || matchFieldMap.totale;
  const columns = [
    {key:'presPart', label:`Pres.Tot.${mf.suffix}`, get:s=>s[mf.pres], render:s=>s[mf.pres], csv:s=>s[mf.pres]},
    {key:'assPart', label:`Ass.${mf.suffix}`, get:s=>s[mf.ass], render:s=>s[mf.ass], csv:s=>s[mf.ass]},
    {key:'percPart', label:`% ${mf.suffix}`, get:s=>s[mf.perc]==null?-1:s[mf.perc], render:s=>pct(s[mf.perc]), csv:s=>pctRounded(s[mf.perc])},
    {key:'nonConvPart', label:`Non Conv.${mf.suffix}`, get:s=>s[mf.nonConv], render:s=>s[mf.nonConv], csv:s=>s[mf.nonConv]},
    {key:'gol', label:'Gol', get:s=>s.gol, render:s=>s.gol, csv:s=>s.gol},
  ];
  if(team.mode!=='semplice'){
    columns.push({key:'assist', label:'Assist', get:s=>s.assist, render:s=>s.assist, csv:s=>s.assist});
    columns.push({key:'giallo', label:'Ammonizioni', get:s=>s.giallo, render:s=>s.giallo, csv:s=>s.giallo});
    columns.push({key:'rosso', label:'Espulsioni', get:s=>s.rosso, render:s=>s.rosso, csv:s=>s.rosso});
  }
  return columns;
}

// Colonne + righe ordinate della tabella statistiche di una squadra, secondo
// i filtri correnti (UI.statsMatchMode/statsTournamentFilter/statsSortKey/
// statsSortDir). Unica fonte usata sia per il render a schermo sia per
// l'esportazione CSV, così restano sempre coerenti tra loro.
function computeStatsTable(team){
  const ritardoWeight = team.ritardoWeight===undefined ? 100 : team.ritardoWeight;
  const stats = computeTeamStats(team.id, UI.statsTournamentFilter);
  stats.forEach(s=>{
    s.percAllPonderata = calcPercAllPonderata(s, ritardoWeight);
  });

  const matchMode = UI.statsMatchMode || 'totale';
  const nomeColumn = {key:'nome', label:'Giocatore', get:s=>(s.player.nome+' '+s.player.cognome).toLowerCase(), render:s=>`${escapeHtml(s.player.nome)} ${escapeHtml(s.player.cognome)}`, csv:s=>`${s.player.nome} ${s.player.cognome}`};
  const columns = [nomeColumn, ...statsColumnsForMode(matchMode, team)];

  const sortKey = UI.statsSortKey || 'nome';
  const sortDir = UI.statsSortDir;
  const col = columns.find(c=>c.key===sortKey) || columns[0];
  const sorted = stats.slice().sort((a,b)=>{
    const va = col.get(a), vb = col.get(b);
    const cmp = typeof va==='string' ? va.localeCompare(vb) : va - vb;
    return sortDir==='asc' ? cmp : -cmp;
  });

  return {matchMode, columns, sortKey: col.key, sortDir, sorted};
}

function renderStatsView(team){
  const {matchMode, columns, sortKey, sortDir, sorted} = computeStatsTable(team);

  return `
    <div class="card">
      <div class="section-title">Statistiche — ${escapeHtml(team.nome)} ${infoIcon('stats')}</div>
      <div class="field"><label>Mostra</label>
        ${customFieldSelect('stats-match-mode', matchMode, [
          ['allenamenti','Allenamenti'],
          ['totale','Totale (partite + raggruppamenti)'],
          ['partita','Solo partite'],
          ['raggruppamento','Solo raggruppamenti']
        ])}
      </div>
      ${matchMode!=='allenamenti'? `
      <div class="field"><label>Filtra partite/raggruppamenti per torneo</label>
        ${customFieldSelect('filter-tournament-stats', UI.statsTournamentFilter, [['','Tutte le partite e raggruppamenti'], ...STATE.tournaments.map(t=>[t.id, t.nome])])}
      </div>` : ''}
      <p class="muted" style="margin-bottom:8px;">Tocca l'intestazione di una colonna per ordinare la tabella.</p>
      <div class="stats-scroll">
        <table class="stats">
          <thead><tr>
            ${columns.map(c=>`<th><button type="button" class="stats-sort-btn ${sortKey===c.key?'active':''}" data-action="sort-stats" data-key="${c.key}">${c.label}${sortKey===c.key? (sortDir==='asc'?' ▲':' ▼') : ''}</button></th>`).join('')}
          </tr></thead>
          <tbody>
          ${sorted.map(s=>`<tr>${columns.map((c,i)=> i===0
            ? `<td data-action="open-player-andamento" data-pid="${s.player.id}">${c.render(s)}</td>`
            : `<td>${c.render(s)}</td>`
          ).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${sorted.length? `<button type="button" class="btn secondary block" style="margin-top:12px;" data-action="export-stats-csv">Esporta CSV</button>` : '<p class="muted" style="margin-top:10px;">Nessun dato ancora.</p>'}
    </div>
  `;
}

// Costruisce il testo del file CSV: intestazioni + righe, separatore ";" (lo
// standard che Excel in italiano si aspetta), BOM UTF-8 iniziale (necessario
// perché Excel riconosca correttamente le lettere accentate), celle tra
// virgolette solo se contengono ";"/virgolette/a capo.
function statsTableToCsv(columns, sorted){
  const csvCell = v=>{
    v = String(v);
    return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  };
  const headerRow = columns.map(c=>csvCell(c.label)).join(';');
  const dataRows = sorted.map(s=> columns.map(c=>csvCell(c.csv(s))).join(';'));
  return '﻿' + [headerRow, ...dataRows].join('\r\n');
}

function exportStatsCsv(){
  const team = currentTeam();
  if(!team) return;
  const {columns, sorted} = computeStatsTable(team);
  if(sorted.length===0) return;
  const csv = statsTableToCsv(columns, sorted);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  // "Squadra" come ripiego se il nome, ripulito, non lascia nulla (alfabeti non latini)
  a.download = `Statistiche_${slugifyForFilename(team.nome) || 'Squadra'}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

   ========================================================= */
function renderCalendarView(team){
  const y = UI.calYear, m = UI.calMonth;
  const first = new Date(y,m,1);
  let startOffset = first.getDay()-1; if(startOffset<0) startOffset=6; // lunedì=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = new Date(y,m, -startOffset+i+1);
    cells.push({date:d, inMonth:false});
  }
  for(let d=1; d<=daysInMonth; d++){ cells.push({date:new Date(y,m,d), inMonth:true}); }
  while(cells.length%7!==0 || cells.length<42){
    const last = cells[cells.length-1].date;
    const d = new Date(last); d.setDate(d.getDate()+1);
    cells.push({date:d, inMonth:false});
    if(cells.length>=42) break;
  }
  const todayIso = todayStr();
  const roster = rosterAt(team.id, null);
  const isCurrentMonth = (y===new Date().getFullYear() && m===new Date().getMonth());

  const cellsHtml = cells.map((c,idx)=>{
    const iso = isoDate(c.date);
    const evs = eventsOnDate(team.id, iso);
    const bdayThisDay = roster.some(r=>{
      if(!r.player.dataNascita) return false;
      const [,mm,dd] = r.player.dataNascita.split('-');
      return Number(mm)-1===c.date.getMonth() && Number(dd)===c.date.getDate();
    });
    const ordineTipi = ['allenamento','partita','raggruppamento','generale'];
    const conteggioPerTipo = {};
    // "da confermare" per tipo: almeno un impegno di quel tipo, in quel giorno, non ancora
    // confermato (presenze/convocati da rivedere). 'generale' non ha mai il segnale: non ha
    // una sezione presenze da confermare (vedi il submit in events.js).
    const daConfermarePerTipo = {};
    evs.forEach(e => {
      conteggioPerTipo[e.type] = (conteggioPerTipo[e.type]||0) + 1;
      if(e.type!=='generale' && e.confermato===false) daConfermarePerTipo[e.type] = true;
    });
    // Al massimo 2 icone piene per giorno (restano leggibili): i tipi oltre
    // il secondo si riassumono in un badge "+N", invece di rimpicciolire
    // tutto fino all'illeggibile nei giorni con 3-4 tipi di impegno diversi.
    const presentTypes = ordineTipi.filter(t => conteggioPerTipo[t]);
    const shownTypes = presentTypes.slice(0,2);
    const hiddenTypesCount = presentTypes.length - shownTypes.length;
    // "da confermare": un SOLO anello attorno all'intero gruppo di icone del giorno
    // (.dots-group), non uno per icona. Con 2 icone (font-size 16px) e 1px di gap tra
    // loro, due anelli singoli (box-shadow di 2px ciascuno) si sovrapponevano di 3px,
    // formando una macchia unica invece di due cerchi distinti — vedi
    // .dots-group.da-confermare in styles.css. Calcolato su TUTTI gli eventi del
    // giorno, non solo i 2 mostrati: un tipo da confermare oltre il secondo (nascosto
    // dietro il badge "+N", che non può portare un anello) prima non aveva mai un
    // segnale proprio; ora il gruppo lo segnala comunque.
    const giornoDaConfermare = Object.keys(daConfermarePerTipo).length > 0;
    const dots = shownTypes
      .map((t,i) => {
        const n = conteggioPerTipo[t];
        const isLast = i===shownTypes.length-1;
        const countHtml = n>1 ? `<span class="ev-count">×${n}</span>` : '';
        const moreHtml = (isLast && hiddenTypesCount>0) ? `<span class="more-badge">+${hiddenTypesCount}</span>` : '';
        return `<span class="ev-emoji">${EVENT_ICON[t]}${countHtml}${moreHtml}</span>`;
      }).join('');
    const isWeekend = idx%7===5 || idx%7===6;
    const classes = ['cal-cell'];
    if(!c.inMonth) classes.push('out');
    if(iso===todayIso) classes.push('today');
    if(evs.length && c.inMonth) classes.push('has-events');
    if(isWeekend && c.inMonth) classes.push('weekend');
    return `<button class="${classes.join(' ')}" data-action="open-day" data-date="${iso}">
      ${bdayThisDay?'<span class="cake">🎂</span>':''}
      <span class="num">${c.date.getDate()}</span>
      <span class="dots"><span class="dots-group${giornoDaConfermare?' da-confermare':''}">${dots}</span></span>
    </button>`;
  }).join('');

  // prossimi impegni (oggi in poi, su tutte le date, non solo il mese visualizzato)
  const upcoming = STATE.events
    .filter(e=>e.teamId===team.id && e.date>=todayIso)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .slice(0,5);

  return `
    <div class="card">
      <div class="cal-head">
        <button class="btn ghost sm" style="font-size:24px;" data-action="cal-prev" aria-label="Mese precedente">${icon('chevronLeft')}</button>
        <button class="cal-title-btn" data-action="open-jump-month">${MESI[m]} ${y} ▾</button>
        <button class="btn ghost sm" style="font-size:24px;" data-action="cal-next" aria-label="Mese successivo">${icon('chevronRight')}</button>
      </div>
      ${!isCurrentMonth? `<button class="btn secondary sm" style="margin-bottom:10px;" data-action="cal-today">${icon('calendarToday')} Torna a oggi</button>` : ''}
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cellsHtml}
      </div>
      <div class="legend">
        <span class="item">${EVENT_ICON.allenamento} Allenamento</span>
        <span class="item">${EVENT_ICON.partita} Partita</span>
        <span class="item">${EVENT_ICON.raggruppamento} Raggruppamento</span>
        <span class="item">${EVENT_ICON.generale} Impegno generale</span>
        <span class="item">🎂 Compleanno</span>
        <span style="margin-left:auto;">${infoIcon('calendario')}</span>
      </div>
    </div>

    ${upcoming.length? `
    <div class="card">
      <div class="section-title">Prossimi impegni</div>
      ${upcoming.map(e=>`
        <div class="list-item" data-action="view-event" data-eventid="${e.id}" style="cursor:pointer;">
          <span style="font-size:20px;">${EVENT_ICON[e.type]}</span>
          <div class="name-stack">
            <div class="name">${formatIt(e.date)}${e.date===todayIso?' · oggi':''}</div>
            <div class="sub">${eventSummary(e)}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}

    <button class="btn block" data-action="open-day" data-date="${todayIso}">+ Aggiungi impegno di oggi</button>
  `;
}

/* =========================================================
   CRONOLOGIA E TASTO INDIETRO
   -----------------------------------------------------------
   La profondità della cronologia (history.state.claudeDepth) è DERIVATA dallo stato
   dell'app, non tenuta a mano:
     livelli = guardia (0 o 1, vedi sotto) + schermata (Home 0; Stagioni, Anagrafica, Statistiche generali 1;
               lista Squadre 2; squadra 3) + scheda (+1 in squadra se non è il Calendario)
               + modale + popup (avviso/conferma/info — S1, blocco 2b: un popup è un livello come gli
               altri, non solo 'info' come prima)
   syncHistory() (in fondo a render() e renderPopup()) riporta la cronologia a quel
   numero: pushState per le voci che mancano, history.go() per quelle in eccesso.
   Non chiama MAI render(): solo history.*.
   Il tasto Indietro (popstate) e il pulsante "<" usano la stessa closeTopLayer(),
   che chiude un livello alla volta: prima l'info, poi il modale, poi la schermata.
   Ogni voce porta il "documento" (ep) che l'ha creata: dopo un ricaricamento quelle
   vecchie risultano estranee e non si toccano con go() (Indietro "a vuoto").
   ========================================================= */
const HIST_SCREEN_DEPTH = {home:0, seasons:1, anagrafica:1, 'stats-generali':1, 'season-teams':2, team:3};
const HIST_DOC = Math.random().toString(36).slice(2, 8);
let histEpoch = HIST_DOC + '.0';   // cambia a ogni riallineamento: le voci con un altro valore non sono più "nostre"
let histEpochN = 0;
let histFloor = historyDepth();    // profondità della voce da cui iniziano quelle spinte da questo documento (all'avvio: le voci di un documento precedente non sono nostre)
let histPending = null;            // {done, verso, timer, stale, retry} finché un nostro go() aspetta il popstate
let histHold = 0;                  // > 0: sync sospesa (chiusura a cascata da Indietro, import in corso)
let histTries = 0;                 // tentativi consecutivi di un go() che non è arrivato dove doveva
let histGuardWanted = false;       // guardia del doppio Indietro: una voce sotto la Home. Voluta SEMPRE da
                                    // normalizeHistory({boot:true}); la sua PRIMA voce si crea comunque, anche
                                    // a pagina non toccata (A1, vedi syncHistory). LIMITE NOTO, non risolto: se
                                    // l'Indietro premuto è il PRIMO gesto in assoluto sulla pagina (mai un
                                    // tocco prima), Chrome può scartare questa voce comunque, ed è la volta
                                    // buona che conta: sulla sonda (push isolato, Indietro quasi subito) non si
                                    // era osservato, ma sul telefono reale, con un uso normale, l'apertura pulita
                                    // e il ricaricamento sono risultati inaffidabili (gradino 4, verifica del
                                    // 22-09-2026). Non è un timing sbagliato del nostro push: la voce senza
                                    // gesto resta "scartabile" a tempo indeterminato finché non arriva un tocco
                                    // sulla pagina (rivalutato a ogni Indietro, non fissato al momento del
                                    // push — meccanismo documentato di Chromium, "history manipulation
                                    // intervention"), quindi nessun trucco sul MOMENTO del push lo risolve.
                                    // Rinuncia consapevole per ora: in questo caso specifico l'Indietro esce
                                    // subito, senza messaggio, come prima del gradino 4. Possibile lavoro
                                    // futuro: CloseWatcher (A2), che intercetta il tasto/gesto Indietro senza
                                    // passare dalla cronologia — non supportato su Safari/iPhone al 22-09-2026,
                                    // richiede un gradino a sé con verifica sul telefono vero.
let histExitTimer = null;          // finestra del doppio Indietro (EXIT_WINDOW_MS)
let histApiAccodata = false;       // apiObbligatoria richiesta mentre syncHistory() era bloccata (histHold
                                    // o un go() già in corso): non va persa, si onora alla prima sync utile
                                    // (blocco 2b-3, correzione: prima veniva scartata in un no-op silenzioso)

function historyLayers(){
  let n = HIST_SCREEN_DEPTH[UI.screen] || 0;
  if(histGuardWanted) n++;                                  // guardia del doppio Indietro (una voce sotto la Home)
  if(UI.screen==='team' && UI.view!=='calendario') n++;   // la scheda iniziale è il Calendario: le altre sono UN livello sopra (cambiare tra loro non aggiunge voci)
  if(UI.modal) n++;
  if(UI.popup) n++;   // S1 (blocco 2b): qualunque popup (avviso/conferma/info) è un livello, non solo 'info'
  return n;
}
// La pagina è stata toccata? Senza l'API userActivation si considera di sì (i push non vengono trattenuti).
function historyActive(){
  const u = navigator.userActivation;
  return !u || u.hasBeenActive;
}
function historyDepth(){
  const s = history.state;
  return (s && typeof s.claudeDepth==='number') ? s.claudeDepth : 0;
}
// Quante voci INDIETRO, contigue e con lo stesso URL della corrente, la pagina vede con la
// Navigation API. null = API assente (in quel caso nessun go() che richieda la certezza).
function navBackContiguous(){
  try{
    const nav = window.navigation;
    if(!nav || !nav.currentEntry || typeof nav.entries!=='function') return null;
    const es = nav.entries(), cur = nav.currentEntry;
    let n = 0;
    for(let j = cur.index - 1; j >= 0 && es[j] && es[j].url === cur.url; j--) n++;
    return n;
  }catch(e){ return null; }
}
// Riallinea lo stato della voce corrente a profondità n, come "nostra" (nuovo ep): le voci
// sotto diventano estranee. Non cambia la pagina.
function historyRebase(n){
  histEpoch = HIST_DOC + '.' + (++histEpochN);
  histFloor = n;
  try{ history.replaceState({claudeDepth:n, ep:histEpoch}, ''); }catch(e){}
}
// Unico punto in cui si chiama history.go(). Non supera mai le voci che la pagina può
// attraversare senza uscire: quelle spinte da questo documento (histFloor), le voci contigue
// con lo stesso URL (Navigation API) e la profondità massima. Se il tetto è 0, non tenta il
// go() e si riallinea lo stato. Se il popstate non arriva entro NORMALIZE_TIMEOUT_MS, idem.
// opz: stale (le voci sono di un documento precedente), apiObbligatoria (senza Navigation API
// niente go()), retry (secondo tentativo), done (callback a fine operazione).
function safeGo(k, opz){
  opz = opz || {};
  const have = historyDepth();
  const cap = navBackContiguous();
  let n = k;
  if(!opz.stale) n = Math.min(n, have - histFloor);
  if(cap !== null) n = Math.min(n, cap);
  else if(opz.apiObbligatoria) n = 0;
  if(have > HISTORY_MAX_DEPTH) n = 0;
  if(n <= 0){
    historyRebase(opz.stale ? 0 : historyLayers());
    if(opz.done) opz.done();
    syncHistory();
    return false;
  }
  const p = {done: opz.done, verso: have - n, stale: !!opz.stale, retry: !!opz.retry, apiObbligatoria: !!opz.apiObbligatoria, timer: null};
  p.timer = setTimeout(function(){
    if(histPending !== p) return;
    histPending = null;
    historyRebase(p.stale ? 0 : historyLayers());
    if(p.done) p.done();
    syncHistory();
  }, NORMALIZE_TIMEOUT_MS);
  histPending = p;
  history.go(-n);
  return true;
}
// Chiamata dal popstate quando è quello del nostro go().
function histSettled(){
  const p = histPending;
  histPending = null;
  clearTimeout(p.timer);
  const depth = historyDepth();
  if(p.stale){
    // normalizzazione: la voce di arrivo è di un documento precedente. Un solo secondo tentativo, poi la si adotta come base.
    if(depth > 0 && !p.retry){ safeGo(depth, {stale:true, apiObbligatoria:p.apiObbligatoria, retry:true, done:p.done}); return; }
    historyRebase(0);
    if(p.done) p.done();
    syncHistory();
    return;
  }
  const s = history.state;
  if(depth > 0 && !(s && s.ep === histEpoch)){ historyRebase(historyLayers()); histTries = 0; }
  else if(depth !== p.verso){ if(++histTries >= 2){ histTries = 0; historyRebase(historyLayers()); } }
  else histTries = 0;
  if(p.done) p.done();
  syncHistory();
}
// Porta la cronologia a historyLayers(): mai un render().
function syncHistory(opz){
  const apiVoluta = !!(opz && opz.apiObbligatoria);
  if(histHold > 0 || histPending){
    // non perdere l'intenzione (blocco 2b-3): se questa chiamata voleva apiObbligatoria ma un altro
    // go() è già in corso (o la sync è sospesa), la si accoda invece di scartarla in un no-op silenzioso
    // — altrimenti la riconciliazione vera, quando arriverà da histSettled() SENZA opz, la perderebbe e
    // rischierebbe un go() non protetto anche senza Navigation API (proprio ciò che apiObbligatoria vuole evitare)
    if(apiVoluta) histApiAccodata = true;
    return;
  }
  // consumata qui, alla prima chiamata non bloccata: sia che serva davvero (ramo go, sotto) sia che no
  // (nessun cambiamento, o un push) — non deve restare in giro ad attaccarsi a un go() scollegato più avanti
  const apiObbligatoria = apiVoluta || histApiAccodata;
  histApiAccodata = false;
  const want = historyLayers(), have = historyDepth();
  if(have === want) return;
  if(have < want){
    // pagina mai toccata: Chrome può saltare le voci create senza gesto. Si concede comunque la prima voce
    // anche senza tocco (A1: sulla sonda, con l'Indietro premuto quasi subito dopo il push, un push isolato
    // era risultato affidabile — caso 12), non le successive: quelle aspettano il primo tocco. LIMITE NOTO:
    // se il PRIMO gesto in assoluto sulla pagina è proprio quell'Indietro, questa unica voce resta comunque
    // scartabile a tempo indeterminato (non è una questione di quante sono, né di quando vengono create: vedi
    // il commento su histGuardWanted) — sul telefono reale, con un uso normale, si è visto scartare. I go()
    // (Indietro, normalizzazione) non hanno bisogno di attivazione e non sono soggetti a questo tetto.
    const tetto = historyActive() ? want : Math.min(want, 1);
    for(let d = have + 1; d <= tetto; d++){
      try{ history.pushState({claudeDepth:d, ep:histEpoch}, ''); }catch(e){ return; }
    }
    return;
  }
  safeGo(have - want, Object.assign({}, opz, {apiObbligatoria}));
}
function historyHold(){ histHold++; }
function historyRelease(opz){ if(histHold > 0) histHold--; if(histHold === 0) syncHistory(opz); }

/* ---- Normalizzazione (L2) e pulizia prima di un ricarico ----
   Dopo un ricaricamento le voci create dal documento precedente restano nella cronologia con la
   loro profondità, mentre l'app riparte da Home: senza pulizia servirebbero tanti Indietro "a vuoto".
   normalizeHistory({boot:true}) (UNA volta per documento, chiamata da init() PRIMA del primo render)
   le toglie con UN go(-k): solo se la Navigation API c'è, e k non supera le voci contigue con lo
   stesso URL (né la profondità massima). La Home si disegna subito, senza aspettare il popstate:
   la sync resta ferma finché il go() non arriva. Senza Navigation API, oppure se il popstate non
   arriva entro NORMALIZE_TIMEOUT_MS, si riallinea lo stato e gli Indietro a vuoto restano.
   normalizeHistory({}) è la stessa cosa PRIMA di un ricarico voluto (cleanReload): attraversa solo le
   voci create da questo documento, quindi funziona anche senza Navigation API. */
let histNormalized = false;
let histReloading = false;
const TESTO_AGGIORNA_NON_SALVATO = "Non è stato possibile salvare i dati: l'aggiornamento non è stato eseguito, per non perderli. Esporta un backup e riprova.";
function normalizeHistory(opz, done){
  opz = opz || {};
  if(opz.boot){
    if(histNormalized){ if(done) done(); return; }
    histNormalized = true;
    histGuardWanted = true;   // A1: la guardia è voluta fin dall'avvio di ogni documento (boot o dopo un
                               // ricaricamento), non solo dopo un tocco — syncHistory le concede la prima voce
  }
  const d = historyDepth();
  if(d <= 0){ if(done) done(); return; }
  safeGo(d, {stale: !!opz.boot, apiObbligatoria: !!opz.boot, done: done});
}
// Ricarica la pagina dopo aver pulito la cronologia. reloadFn (di norma location.reload) parte SOLO
// dopo il popstate del go() (o dopo il timeout), mai prima. Se un salvataggio in coda non riesce
// (scriviStato() = false) NON ricarica, per non perdere i dati. Non usa performSave/flushPendingSave:
// la scrittura e l'avviso li gestisce qui.
function cleanReload(reloadFn){
  if(histReloading) return false;
  reloadFn = reloadFn || function(){ location.reload(); };
  if(saveDirty){
    clearTimeout(saveTimer); saveDirty = false;
    if(!scriviStato()){ saveDirty = true; showAlert(TESTO_AGGIORNA_NON_SALVATO); return false; }
  }
  histReloading = true;
  // sync sospesa fino al ricarico: la schermata è ancora aperta e, appena il go() arriva, la sync
  // rimetterebbe le voci che si sono appena tolte
  historyHold();
  const ricarica = function(){
    try{ reloadFn(); }
    finally{
      // Il ricarico è ASINCRONO: dopo reloadFn() la pagina resta viva finché il browser non la sostituisce
      // (in Chrome desktop 9-20 ms). Rilasciare subito la sospensione farebbe rimettere alla sync le voci
      // appena tolte (provato su Chrome reale). Si rilascia solo dopo RELOAD_RELEASE_MS: se la pagina si
      // ricarica il timer non scatta mai; se il ricarico non parte, la sync riprende e riallinea in un colpo.
      setTimeout(function(){ histReloading = false; historyRelease(); }, RELOAD_RELEASE_MS);
    }
  };
  if(historyDepth() <= 0){ ricarica(); return true; }
  normalizeHistory({}, function(){ setTimeout(ricarica, 50); });
  return true;
}

// Chiude UN livello (il più alto) e restituisce quale; null se non c'è nulla da chiudere.
// Usata sia dal tasto Indietro sia dal pulsante "<".
function closeTopLayer(opz){
  // S1 (blocco 2b): qualunque popup si chiude così, avviso/conferma inclusi — MAI onConfirm
  // (Indietro su un showConfirm equivale a "Annulla", come il tasto close-popup già fa).
  if(UI.popup){ UI.popup = null; renderPopup(); return 'popup'; }
  if(UI.modal){ UI.modal = null; render(); return 'modale'; }
  if(UI.screen !== 'home'){
    const eraScheda = UI.screen==='team' && UI.view!=='calendario';   // da una scheda diversa dal Calendario si torna prima al Calendario
    backOneLevel();
    return eraScheda ? 'scheda' : 'schermata';
  }
  // Home, niente altro da chiudere: resta la guardia (il pulsante "<" non arriva mai qui: senzaGuardia)
  if(histGuardWanted && !(opz && opz.senzaGuardia)){ histGuardWanted = false; return 'guardia'; }
  return null;
}
// Indietro del telefono/browser (o Alt+Freccia sinistra su PC).
window.addEventListener('popstate', function(){
  if(histPending){ histSettled(); return; }
  const s = history.state, depth = historyDepth();
  // voce di un documento precedente (o dopo un riallineamento): nessun effetto visibile, la si adotta
  if(depth > 0 && !(s && s.ep === histEpoch)){ historyRebase(historyLayers()); return; }
  // voce in eccesso (Alt+Freccia destra, o una voce nostra riattraversata): si torna indietro
  if(depth > historyLayers()){ syncHistory(); return; }
  // Indietro dell'utente: si chiudono i livelli oltre la profondità raggiunta (più di uno
  // se il browser ha saltato una voce); la sync resta ferma finché non ha finito
  histHold++;
  let guardiaConsumata = false;
  try{
    while(historyLayers() > depth){
      const chiuso = closeTopLayer();
      if(chiuso === 'guardia') guardiaConsumata = true;
      if(!chiuso) break;
    }
  }finally{ histHold--; }
  // primo Indietro da Home: non esce, mostra un messaggio breve.
  // STORIA (regola "i", gradino 4 -> rimossa nel 2b-5): prima di S1 un popup non aveva una voce
  // propria, quindi un Indietro poteva "attraversarlo" e consumare la guardia sotto in silenzio,
  // senza mostrare il messaggio (il popup restava aperto sopra). Questo if distingueva i due casi.
  // Con S1 (blocco 2b) un popup È un livello e closeTopLayer() lo controlla per PRIMO: nel ciclo qui
  // sopra, se UI.popup era valorizzato, la prima iterazione lo chiude sempre (mai 'guardia' nella
  // stessa iterazione), quindi quando guardiaConsumata diventa vero UI.popup è SEMPRE già null — anche
  // nel caso di uno scarto multiplo di Chrome (il ciclo chiude comunque in ordine di priorità: popup,
  // poi modale, poi schermata, poi guardia, mai il contrario, qualunque sia l'ordine reale scartato dal
  // browser). Verificato in modo esaustivo (non solo empirico) durante il 2b-5: il ramo "silenzioso"
  // non è raggiungibile in NESSUN caso col codice attuale, non solo in quello normale (già verificato
  // nel 2b-1) — rimosso, non è mai stata una vera rete di sicurezza. Se una futura modifica a
  // closeTopLayer()/a questo ciclo cambiasse l'ordine di chiusura, andrebbe rivalutato da capo.
  if(guardiaConsumata) showExitToast();
  // coda dei popup (blocco 2b-4): la promozione durante il ciclo qui sopra è volutamente bloccata
  // (promuoviPopupAccodato() controlla histHold, sempre >0 mentre il ciclo gira) — altrimenti il
  // popup appena promosso da closeTopLayer() farebbe subito risalire historyLayers() e il ciclo,
  // non sapendo distinguere "un livello ancora da chiudere" da "uno appena apparso", lo richiuderebbe
  // nello stesso Indietro, mai mostrato all'utente (verificato). Qui, a ciclo finito e histHold=0, si
  // riprova: se c'era qualcosa in coda, ORA può comparire.
  if(promuoviPopupAccodato()) renderPopup();
  else syncHistory();
});

/* ---- Doppio Indietro da Home ----
   Una voce di guardia sotto la Home (historyLayers la conta) è voluta fin dall'avvio del documento
   (histGuardWanted=true in normalizeHistory({boot:true})); la sua prima voce si crea comunque anche a
   pagina non toccata (A1, vedi syncHistory). Il primo Indietro da Home consuma la guardia (la pagina
   resta) e mostra SEMPRE un messaggio (showExitToast, gradino 2b-5: prima c'era un caso "silenzioso",
   la regola "i", rimossa perché provata irraggiungibile — vedi il commento nel gestore di popstate) per
   EXIT_WINDOW_MS; un secondo Indietro entro quel tempo trova la cronologia già a zero e il browser esce
   da sé. Scaduto il tempo la guardia si ricrea da sola (B1, gradino 4: senza bisogno di un tocco a
   caso). Un tocco durante la finestra la ricrea subito. Il messaggio è un nodo creato direttamente nel
   DOM: mai un render().
   LIMITE NOTO (gradino 4, chiuso così il 22-09-2026, rinuncia consapevole): se l'Indietro è il PRIMO
   gesto in assoluto sulla pagina (apertura mai toccata, o Home dopo un ricaricamento), la voce di
   guardia può essere scartata da Chrome comunque, e l'app esce senza mostrare il messaggio — come
   prima di A1. Dettagli e alternative valutate (CloseWatcher/A2, non ancora applicabile) nel commento
   su histGuardWanted. */
function hideExitToast(){
  const el = document.getElementById('exit-toast');
  if(el) el.remove();
}
function scheduleGuardRearm(){
  clearTimeout(histExitTimer);
  histExitTimer = setTimeout(function(){
    hideExitToast();
    histGuardWanted = true;
    syncHistory();
  }, EXIT_WINDOW_MS);
}
function showExitToast(){
  hideExitToast();
  const el = document.createElement('div');
  el.id = 'exit-toast';
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  el.textContent = 'Premi ancora Indietro per uscire';
  el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom, 0px));' +
    'max-width:88vw;padding:12px 20px;border-radius:24px;background:rgba(20,30,25,.94);color:#fff;font-size:15px;' +
    'text-align:center;z-index:90;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3);';
  document.body.appendChild(el);
  scheduleGuardRearm();
}
// Con A1, histGuardWanted è già true dal boot (non più "false finché non tocchi"): riarmare la guardia e
// recuperare le altre voci rimaste in sospeso su pagina non toccata (es. un modale aperto già al boot,
// come "Come ti chiamiamo" al primo avvio) sono ora due esigenze DISTINTE, che possono capitare in momenti
// diversi — vanno tenute separate, non più una condizione sola:
//  - histTouched (una volta sola per documento): il primo tocco fa comunque il "recupero" di qualunque
//    voce rimasta indietro (want>have) per il tetto di A1, indipendentemente dalla guardia;
//  - armGuard (ogni volta che serve): ri-arma la guardia quando è stata consumata da un Indietro e poi
//    arriva un nuovo tocco — non più legata al "primo" tocco in assoluto.
let histTouched = false;
function catturaVociInSospeso(){
  if(histTouched) return;
  const u = navigator.userActivation;
  if(!u || !u.hasBeenActive) return;
  histTouched = true;
  syncHistory();
}
function armGuard(){
  const u = navigator.userActivation;
  if(histGuardWanted || !u || !u.hasBeenActive) return;
  clearTimeout(histExitTimer);
  hideExitToast();
  histGuardWanted = true;
  syncHistory();
}
['pointerup', 'touchend', 'click', 'keydown'].forEach(function(t){
  document.addEventListener(t, function(){ catturaVociInSospeso(); armGuard(); }, true);
});

/* =========================================================
   MODALI - shell
   ========================================================= */
function openModal(type,payload){
  UI.modal = {type, payload: payload||{}};
  render();
}
function closeModal(){
  const wasType = UI.modal && UI.modal.type;
  UI.modal = null;
  if(wasType==='set-name' && !STATE.hasSeenInfoTip){
    STATE.hasSeenInfoTip = true;
    saveState();
    UI.modal = {type:'info-tip', payload:{}};
  }
  render();
}
// Popup di alert/conferma "nostri", al posto di alert()/confirm() nativi del
// browser. Stato indipendente da UI.modal (mai lo sostituisce): un popup può
// comparire sopra un modale già aperto senza perderne i dati in corso (es.
// la bozza di un raggruppamento) — per questo vive nella sua zona DOM
// separata (#popup-zone), non dentro #modal-zone.
// Cronologia (S1, blocco 2b): qualunque popup è un livello come gli altri (historyLayers),
// quindi Indietro chiude SOLO il popup, uno alla volta, come già succedeva per 'info'; su un
// showConfirm equivale ad Annulla (mai onConfirm, vedi closeTopLayer). La voce si toglie da
// sola alla chiusura, in qualunque modo avvenga (Ho capito/✕/sfondo/Esc/Indietro).
// Coda (blocco 2b-4, correzione): UI.popup è un campo singolo — un popup aperto in modo
// ASINCRONO (performSave dopo il suo debounce, la lettura del file in importBackupFile) mentre
// l'utente ne ha già un altro a schermo non lo sostituisce più: si accoda (histPopupAccodati,
// FIFO — non un elemento solo: due fonti asincrone indipendenti possono arrivare entrambe prima
// che l'utente chiuda quello attuale) e appare solo dopo, quando l'utente chiude quello attuale
// in un modo qualunque. Unico punto d'ingresso per aprire un popup: apriPopup(), usata da tutte
// e tre show*(), così la coda vale per tutti i popup, non solo per alert/confirm.
let histPopupAccodati = [];
function apriPopup(obj){
  if(UI.popup){ histPopupAccodati.push(obj); return; }
  UI.popup = obj;
  renderPopup();
}
function showAlert(message){
  apriPopup({kind:'alert', message});
}
function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  apriPopup({kind:'confirm', message, onConfirm, danger:!!opts.danger, confirmLabel: opts.confirmLabel || 'Conferma'});
}
// Info (ⓘ) toccata DENTRO un modale: si mostra come popup, non con openModal('info'),
// che sostituirebbe il modale attivo e distruggerebbe form, note e bozze. Come
// showAlert usa solo renderPopup (mai render()) e non tocca UI.modal.
function showInfo(key){
  if(!INFO_TEXTS[key]) return;
  apriPopup({kind:'info', key});
}
// Promuove il primo popup in coda, ma SOLO se histHold===0: durante il ciclo di chiusura a cascata
// del popstate (histHold>0) una promozione qui verrebbe richiusa subito, nello stesso Indietro,
// perché il ciclo non sa distinguere "un livello ancora da chiudere" da "uno appena apparso"
// (verificato). Restituisce true se ha promosso qualcosa (il chiamante disegna con renderPopup()).
function promuoviPopupAccodato(){
  if(UI.popup || histHold > 0 || !histPopupAccodati.length) return false;
  UI.popup = histPopupAccodati.shift();
  return true;
}
function renderPopup(){
  // promozione dalla coda: TUTTI i punti che chiudono un popup DIRETTAMENTE (non via Indietro) fanno
  // UI.popup=null seguito da renderPopup() (close-popup, confirm-popup, overlay-close-popup, Esc, e
  // closeTopLayer quando lo chiama il pulsante "<"): un solo controllo qui li copre tutti, senza
  // toccarli uno per uno. Il caso "Indietro fisico" ha invece histHold>0 durante il ciclo che chiama
  // questa stessa funzione (vedi promuoviPopupAccodato) e viene gestito a parte, dopo il ciclo, nel
  // gestore di popstate. Cronologia: quando la promozione avviene QUI (histHold===0, chiusura
  // diretta), historyLayers() vede un popup sia prima sia dopo (uno chiuso, uno promosso) nella
  // STESSA chiamata: nessun push né go, la stessa voce passa di mano. Quando invece avviene nel
  // gestore di popstate (dopo un Indietro fisico), il browser ha già retrocesso PRIMA che quel
  // codice giri: la voce è già stata consumata davvero, quindi lì la sync farà un push vero per il
  // popup promosso, non un riuso — gestito già da syncHistory()/historyLayers(), nessuna modifica
  // al motore di cronologia (verificato).
  promuoviPopupAccodato();
  const zone = document.getElementById('popup-zone');
  const p = UI.popup;
  if(!p){
    zone.innerHTML = '';
  } else if(p.kind==='info'){
    // modal-split SEMPRE (non solo per i testi lunghi oggi): la lunghezza di ogni voce di
    // INFO_TEXTS può cambiare in futuro senza toccare questo file, quindi qui non si valuta
    // caso per caso come per SPLIT_MODAL_TYPES — vedi il bug corretto (header sticky che
    // "sanguinava" durante lo scroll, osservato sul testo "Installare l'app").
    zone.innerHTML = `<div class="overlay" data-action="overlay-close-popup">
      <div class="modal modal-split" data-stop="1">${infoPanelHtml(INFO_TEXTS[p.key], 'close-popup')}</div>
    </div>`;
  } else {
    const confirmBtn = p.kind==='confirm'
      ? `<button class="btn ${p.danger?'danger':''}" style="flex:1;" data-action="confirm-popup">${escapeHtml(p.confirmLabel)}</button>`
      : '';
    const cancelBtn = p.kind==='confirm'
      ? `<button class="btn secondary" style="flex:1;" data-action="close-popup">Annulla</button>`
      : `<button class="btn block" data-action="close-popup">OK</button>`;
    zone.innerHTML = `<div class="overlay" data-action="overlay-close-popup">
      <div class="modal" data-stop="1">
        <p style="white-space:pre-wrap;margin:0 0 16px;">${escapeHtml(p.message)}</p>
        <div style="display:flex;gap:8px;">${cancelBtn}${confirmBtn}</div>
      </div>
    </div>`;
  }
  syncHistory();
}
// scorciatoie da tastiera globali (calendario + chiusura modale),
// non solo modal-specific
// Scorciatoie da tastiera (PC). Disattivate mentre si scrive in un campo o con un modale aperto,
// per non interferire con l'inserimento dati.
document.addEventListener('keydown', function(e){
  // S1 (blocco 2b): Esc chiude qualunque popup, avviso/conferma inclusi (non solo 'info' come prima),
  // per coerenza con Indietro — su un showConfirm equivale ad Annulla, mai onConfirm.
  if(e.key==='Escape' && UI.popup){ UI.popup = null; renderPopup(); return; }
  if(e.key==='Escape' && UI.modal){ closeModal(); return; }

  const tag = (e.target.tagName||'').toLowerCase();
  const isTyping = tag==='input' || tag==='textarea' || tag==='select' || e.target.isContentEditable;
  if(UI.modal || isTyping) return;

  if(UI.screen==='team' && UI.view==='calendario'){
    if(e.key==='ArrowLeft'){ e.preventDefault(); UI.calMonth--; if(UI.calMonth<0){UI.calMonth=11;UI.calYear--;} render(); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); UI.calMonth++; if(UI.calMonth>11){UI.calMonth=0;UI.calYear++;} render(); return; }
  }
  if((e.key==='n' || e.key==='N') && UI.screen==='team' && UI.view==='calendario'){
    e.preventDefault();
    openModal('day', {date: todayStr()});
    return;
  }
  if(e.key==='/'){
    let sel = null;
    if(UI.screen==='anagrafica') sel = '[data-action="anagrafica-search"]';
    else if(UI.screen==='team' && UI.view==='squadra') sel = '[data-action="roster-search"]';
    if(sel){
      const el = document.querySelector(sel);
      if(el){ e.preventDefault(); el.focus(); }
    }
  }
});

function renderModal(){
  const zone = document.getElementById('modal-zone');
  if(!UI.modal){ zone.innerHTML=''; return; }
  let inner = '';
  switch(UI.modal.type){
    case 'day': inner = modalDay(); break;
    case 'allenamento': inner = modalAllenamento(); break;
    case 'partita': inner = modalPartita(); break;
    case 'raggruppamento': inner = modalRaggruppamento(); break;
    case 'generale': inner = modalImpegnoGenerale(); break;
    case 'season-manager': inner = modalSeasonManager(); break;
    case 'team-manager': inner = modalTeamManager(); break;
    case 'add-existing-player': inner = modalAddExistingPlayer(); break;
    case 'edit-player': inner = modalEditPlayer(); break;
    case 'edit-tournament': inner = modalEditTournament(); break;
    case 'confirm-delete-player': inner = modalConfirmDeletePlayer(); break;
    case 'remove-from-team': inner = modalRemoveFromTeam(); break;
    case 'reassign-player': inner = modalReassignPlayer(); break;
    case 'backup': inner = modalBackup(); break;
    case 'info': inner = modalInfo(); break;
    case 'event-detail': inner = modalEventDetail(); break;
    case 'edit-season': inner = modalEditSeason(); break;
    case 'confirm-delete-season': inner = modalConfirmDeleteSeason(); break;
    case 'edit-team': inner = modalEditTeam(); break;
    case 'confirm-delete-team': inner = modalConfirmDeleteTeam(); break;
    case 'jump-month': inner = modalJumpMonth(); break;
    case 'notifiche': inner = modalNotifiche(); break;
    case 'player-andamento': inner = modalPlayerAndamento(); break;
    case 'set-name': inner = modalSetName(); break;
    case 'info-tip': inner = modalInfoTip(); break;
    default: inner = '';
  }
  // modal-split: header realmente statico + corpo scrollabile separato,
  // invece di position:sticky — evita alla radice la race di compositing
  // (vedi commento su .modal-split in styles.css). Applicata alle modali dove il
  // contenuto può realisticamente diventare abbastanza lungo da attivare lo scroll
  // (liste rosa/presenze, anagrafica, dropdown con molte opzioni, liste che crescono con
  // gli anni/le squadre, testo libero in una textarea, elenco impegni/notifiche del
  // giorno), non a tutte per non introdurre inutilmente una struttura più complessa dove
  // il contenuto è già sempre corto (es. rinomina stagione/squadra, conferme di
  // eliminazione: un campo o una frase, non superano mai 90vh).
  const SPLIT_MODAL_TYPES = [
    'player-andamento','partita','allenamento','raggruppamento','event-detail','add-existing-player','jump-month',
    'info','backup','season-manager','team-manager','notifiche','edit-tournament','generale','day','edit-player'
  ];
  const modalClass = SPLIT_MODAL_TYPES.includes(UI.modal.type) ? 'modal modal-split' : 'modal';
  // Modali con campi da compilare: il tocco sullo sfondo non li chiude, per non perdere
  // quanto digitato e non ancora salvato (elenco esplicito, non dedotto dalla presenza di
  // <input>: alcuni campi a basso rischio — data con default, ricerca — restano chiudibili
  // dallo sfondo). Include 'raggruppamento' anche se il suo bozzetto (draft) sopravvive a un
  // render(): la regola è la stessa degli altri modali con dati, non una sua eccezione.
  const MODALI_CON_DATI_NON_SALVATI = [
    'set-name','season-manager','team-manager','edit-season','edit-team',
    'edit-player','edit-tournament','raggruppamento','allenamento','generale','partita'
  ];
  const bloccaSfondo = MODALI_CON_DATI_NON_SALVATI.includes(UI.modal.type);
  zone.innerHTML = `<div class="overlay"${bloccaSfondo ? '' : ' data-action="overlay-close"'}>
    <div class="${modalClass}" data-stop="1">${inner}</div>
  </div>`;
}

function modalDay(){
  const date = UI.modal.payload.date;
  const evs = eventsOnDate(UI.teamId, date);

function attSelectStyle(v){

let cdropUid = 0;

/* Tendina-azioni compatta "⋯" — ogni item usa un data-action GIA' esistente
   nell'app (open-edit-season, ecc.): selezionarlo chiude solo il menu, poi
   l'azione scorre normalmente nel gestore click principale. */
function actionDropdownHtml(items, align){
  const id = 'cd'+(cdropUid++);

}

/* FAB che invece di un'azione diretta apre un piccolo menu di scelta (stesso
   componente .cdrop/.cdrop-menu di actionDropdownHtml, agganciato al FAB
   come trigger) — usato dove un singolo "+" deve coprire più di un'azione
   (es. rosa squadra: nuovo giocatore vs giocatore esistente), invece di un
   secondo pulsante separato che scorrerebbe via insieme alla lista. */
function fabMenuHtml(label, items){
  const id = 'cd'+(cdropUid++);
  return `<div class="cdrop">
    <button type="button" class="fab cdrop-trigger" data-action="cdrop-toggle" data-cdrop-id="${id}" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}">${icon('plus')}</button>
    <div class="cdrop-menu align-right" data-cdrop-id="${id}">

    </div>

/* Tendina di presenza a pillola (P/R/A/NP o Presente/Assente/NP).
   Il valore corrente vive in data-value sul wrapper .cdrop, letto poi
   dai submit handler dei form — nessun <select> nativo coinvolto. */
function attPillHtml(kind, pid, value, labelFn, options){
  const id = 'cd'+(cdropUid++);
  const attr = kind==='att4' ? `data-attselect="${pid}"` : `data-att3select="${pid}"`;
  return `<div class="cdrop" ${attr} data-value="${value||''}">
    <button type="button" class="cdrop-trigger att-pill" data-action="cdrop-toggle" data-cdrop-id="${id}" style="${attSelectStyle(value)}">
      ${escapeHtml(labelFn(value))} <span class="cdrop-caret">${icon('chevronDown')}</span>
    </button>
    <div class="cdrop-menu align-left" data-cdrop-id="${id}">
      ${options.map(v=>`<button type="button" class="cdrop-item ${v===value?'is-current':''}" data-action="pill-pick" data-value="${v}">${escapeHtml(labelFn(v))}</button>`).join('')}
    </div>
  </div>`;
}

/* Sostituto generico di un <select> a scelta singola: usato per ordinamenti,
   filtri, sede/competizione/torneo, mese/anno ecc. Le opzioni sono coppie
   [valore, etichetta]. Il campo "field" identifica a chi serve il valore:
   - per i campi letti a submit tramite fv(form, nome) usa lo stesso nome
   - per gli stati UI con effetto immediato, vedi il gestore "field-pick" */
function customFieldSelect(field, currentValue, options, opts){
  opts = opts || {};
  const id = 'cd'+(cdropUid++);
  const hasValue = currentValue!==null && currentValue!==undefined && currentValue!=='';
  const cur = options.find(o=>String(o[0])===String(currentValue));
  // Se currentValue è valorizzato ma non corrisponde a NESSUNA opzione (es.
  // un torneo/stagione/anno referenziato che non esiste più tra le scelte
  // disponibili), l'etichetta lo dice onestamente invece di ricadere in
  // silenzio sulla prima opzione della lista, che farebbe credere all'utente
  // di avere selezionato quella. Il valore sottostante (data-value, sotto)
  // resta comunque quello reale: non si perde nulla al salvataggio se il
  // campo non viene toccato.
  const label = cur
    ? cur[1]
    : (hasValue ? '⚠️ valore non più disponibile' : (opts.placeholder || (options[0]?options[0][1]:'—')));
  if(options.length===0){
    return `<div class="field-select-empty">${escapeHtml(opts.placeholder||'—')}</div>`;
  }
  return `<div class="cdrop cdrop-field" data-field="${field}" data-value="${escapeHtml(String(currentValue==null?'':currentValue))}" style="${opts.wrapperStyle||''}">
    <button type="button" class="cdrop-trigger field-select-trigger" data-action="cdrop-toggle" data-cdrop-id="${id}">
      <span class="field-select-label">${escapeHtml(label)}</span><span class="cdrop-caret">${icon('chevronDown')}</span>
    </button>
    <div class="cdrop-menu align-left" data-cdrop-id="${id}" style="min-width:100%;max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;">
      ${options.map(([v,l])=>`<button type="button" class="cdrop-item ${String(v)===String(currentValue)?'is-current':''}" data-action="field-pick" data-value="${escapeHtml(String(v))}">${escapeHtml(l)}</button>`).join('')}
    </div>
  </div>`;
}
function presenceBadge(stato){
  if(stato==='P') return `<span class="badge green">Presente</span>`;
  if(stato==='R') return `<span class="badge ritardo">Ritardo</span>`;
  if(stato==='A') return `<span class="badge" style="background:var(--red-soft);color:var(--red);">Assente</span>`;
  if(stato==='NC') return `<span class="badge purple">Non convocato</span>`;
  if(stato==='NP') return `<span class="badge" style="background:var(--chalk-dim);color:var(--ink-soft);">Non pertinente</span>`;
  return `<span class="badge" style="background:var(--chalk-dim);color:var(--ink-soft);">—</span>`;
}

function ensureRaggruppamentoDraft(){
  const p = UI.modal.payload;
  if(p.draft) return p.draft;
  const existing = p.eventId ? STATE.events.find(e=>e.id===p.eventId) : null;
  const team = currentTeam();
  p.draft = {
    label: existing ? existing.label : `Raggruppamento del ${formatIt(p.date)}`,
    torneoId: existing ? (existing.torneoId||'') : '',
    note: existing ? (existing.note||'') : '',
    dettagliata: existing ? !!existing.dettagliata : (team && team.mode==='dettagliata'),
    squadra: existing ? JSON.parse(JSON.stringify(existing.squadra||{})) : {},
    miniPartite: existing ? JSON.parse(JSON.stringify(existing.miniPartite||[])) : []
  };
  return p.draft;
}

function minimatchRowHtml(mm, i){
  mm = mm || {avversario:'', risultato:'', note:''};
  return `<div class="minimatch-row" data-minimatch-row="${i}">
    <div class="row2">
      <div class="field" style="margin-bottom:6px;"><label>Avversario</label><input type="text" data-mm="avversario" data-idx="${i}" value="${escapeHtml(mm.avversario)}"></div>
      <div class="field" style="margin-bottom:6px;"><label>Risultato (tua squadra - avversario)</label>
        <input type="text" inputmode="numeric" data-mm="risultato" data-idx="${i}" value="${escapeHtml(mm.risultato)}">
        <div class="mm-esito" data-mm-esito="${i}" style="margin-top:4px;">${minimatchEsitoHtml(mm.risultato)}</div>
      </div>
    </div>
    <div class="field" style="margin-bottom:6px;"><label>Note (es. gol di...)</label><input type="text" data-mm="note" data-idx="${i}" value="${escapeHtml(mm.note)}"></div>
    <button type="button" class="btn ghost sm" data-action="remove-minimatch" data-idx="${i}">Rimuovi mini-partita</button>
  </div>`;
}
// Esito dedotto dal risultato ("tua squadra - avversario"): mostrato solo
// quando il valore è completo (numero-numero), per far notare subito se i
// due numeri sono stati invertiti per errore. Normalizza prima di leggere,
// così funziona anche su risultati salvati prima di questa funzionalità.
function minimatchEsitoHtml(risultato){
  const norm = normalizeRisultato(risultato);
  const m = /^(\d+)-(\d+)$/.exec(norm);
  if(!m) return '';
  const noi = Number(m[1]), loro = Number(m[2]);
  if(noi>loro) return `<span class="badge green">Vittoria</span>`;
  if(noi<loro) return `<span class="badge" style="background:var(--red-soft);color:var(--red);">Sconfitta</span>`;
  return `<span class="badge blue">Pareggio</span>`;
}
// Elenco righe mini-partite: estratta a parte per poter rigenerare solo
// #minimatch-list (add/remove-minimatch) senza un render() completo.
function minimatchListHtml(draft){
  return draft.miniPartite.map((mm,i)=>minimatchRowHtml(mm,i)).join('');
}
// Avviso ⚠️ di disallineamento gol vista-squadra/mini-partite: estratto a
// parte per poter rigenerare solo #minimatch-warning senza un render() completo.
function minimatchWarnHtml(draft, roster){
  const sommaSquadra = roster.reduce((s,r)=> s + Number((draft.squadra[r.player.id]||{}).gol||0), 0);
  const sommaMini = draft.miniPartite.reduce((s,mm)=> s + (parseFirstScore(mm.risultato)||0), 0);
  const showWarn = draft.miniPartite.length>0 && Object.keys(draft.squadra).length>0 && sommaSquadra!==sommaMini;
  return showWarn? `<span class="warn-tri" data-action="show-info" data-infokey="raggruppamento_warning" title="Il totale gol qui (${sommaSquadra}) non coincide con il totale delle mini-partite (${sommaMini})">⚠️ ${sommaSquadra} vs ${sommaMini}</span>` : '';
}
function parseFirstScore(risultato){
  if(!risultato) return 0;
  const m = String(risultato).match(/(\d+)\s*[-:]\s*(\d+)/);
  return m ? Number(m[1]) : 0;
}
