function applyStepperChange(btn, amount){
  const input = btn.parentElement.querySelector('.goal-input');
  if(!input) return;
  const cur = Number(input.value)||0;
  let next = Math.max(0, cur + amount);
  if(input.max!==''){ next = Math.min(next, Number(input.max)); }
  input.value = next;
  input.dispatchEvent(new Event('input', {bubbles:true}));
  input.dispatchEvent(new Event('change', {bubbles:true}));
}
let stepperHoldTimer = null;
let stepperHoldFired = false;
document.addEventListener('pointerdown', function(e){
  const btn = e.target.closest('.stepper-btn');
  if(!btn) return;
  stepperHoldFired = false;
  clearTimeout(stepperHoldTimer);
  stepperHoldTimer = setTimeout(()=>{
    stepperHoldFired = true;
    if(navigator.vibrate) navigator.vibrate(15);
    applyStepperChange(btn, Number(btn.dataset.stepdir) * 5);
  }, 2000);
});

// Chiude qualunque .cdrop-menu sia aperta. Usata sia dal click fuori dalla
// tendina sia da resize (vedi sotto): una finestra che cambia dimensione
// invaliderebbe la posizione già calcolata da positionCdropMenu senza che
// nessuno la ricalcoli.
function closeOpenCdropMenus(){
  document.querySelectorAll('.cdrop-menu.open').forEach(m=>m.classList.remove('open','flip-up'));
}
// 'scroll' non fa bubbling, ma la capture-phase su document intercetta
// comunque lo scroll di ogni antenato scrollabile (es. .modal-scroll-body),
// non solo quello della finestra — ESCLUSO lo scroll generato dal dito/mouse
// dentro il menu stesso (ha overflow-y:auto per le liste lunghe, es. i 12
// mesi): quello ha come target il menu aperto (o un suo discendente) e va
// ignorato, altrimenti il menu si chiuderebbe al primo pixel di scroll
// interno, prima che l'utente possa vedere le opzioni oltre le prime.
document.addEventListener('scroll', function(e){
  document.querySelectorAll('.cdrop-menu.open').forEach(m=>{
    if(m===e.target || m.contains(e.target)) return;
    m.classList.remove('open','flip-up');
  });
}, true);
window.addEventListener('resize', closeOpenCdropMenus);

// Posiziona una .cdrop-menu appena aperta con position:fixed in coordinate
// di viewport, invece del position:absolute di default (relativo al suo
// .cdrop) — che resta intrappolato nel ritaglio overflow di qualunque
// antenato, ANCHE quando quell'antenato lascia libero molto più spazio nel
// viewport attorno a sé. Caso concreto: nei modali "split" (.modal-split,
// vedi styles.css) .modal-scroll-body ha flex:1, ma flex:1 distribuisce
// spazio libero solo se il contenitore flex ha un'altezza vincolata più
// grande del contenuto — con contenuto breve (es. il modale "Vai al mese",
// due sole select) il contenitore resta alto quanto il suo contenuto, ben
// sotto i 90vh di max-height, quindi non si allarga mai fino allo spazio
// verticale realmente disponibile: nessun antenato nel DOM rappresenta
// quello spazio, che esiste solo nell'overlay attorno al modale (ancorato
// in basso). position:fixed elimina il problema alla radice: non è
// soggetto a NESSUN overflow di antenato (qui nessuno tra il menu e la
// finestra usa transform/filter/perspective/contain, che altrimenti
// creerebbero un containing block intermedio), quindi lo spazio disponibile
// è sempre semplicemente quello reale della finestra — non serve più
// individuare il "primo antenato che ritaglia".
// Il nodo NON viene spostato nel DOM (niente vero portal): resta dentro il
// suo .cdrop, così un click su una voce può sempre risalire con
// closest('.cdrop') (da cui dipendono i selettori field-pick/pill-pick), e
// un re-render del modale che sovrascrive l'innerHTML si porta via il menu
// insieme al resto — nessun nodo orfano da ripulire a mano.
// getBoundingClientRect()/innerHeight in jsdom (i nostri test) restituiscono
// sempre zero — in quel caso non applichiamo alcun calcolo e resta il
// comportamento CSS di default (position:absolute, apertura verso il
// basso, max-height statico dove già presente inline).
function positionCdropMenu(menu, trigger){
  const triggerRect = trigger.getBoundingClientRect();
  const viewportH = window.innerHeight || document.documentElement.clientHeight;
  const viewportW = window.innerWidth || document.documentElement.clientWidth;
  if(!viewportH || (!triggerRect.top && !triggerRect.bottom)) return;
  const gap = 6, edgeMargin = 8, preferredMax = 280, floorHeight = 120;

  const spaceBelow = viewportH - triggerRect.bottom - gap - edgeMargin;
  const spaceAbove = triggerRect.top - gap - edgeMargin;
  const naturalHeight = menu.scrollHeight;
  const openUp = naturalHeight > spaceBelow && spaceAbove > spaceBelow;
  menu.classList.toggle('flip-up', openUp);
  const available = openUp ? spaceAbove : spaceBelow;
  menu.style.maxHeight = Math.max(floorHeight, Math.min(preferredMax, available)) + 'px';
  menu.style.overflowY = 'auto';

  // larghezza "naturale" (es. il min-width:100% delle tendine-campo,
  // risolto contro .cdrop mentre il menu è ancora position:absolute) va
  // fissata in px PRIMA di passare a position:fixed, il cui contesto
  // percentuale è la finestra, non più .cdrop — altrimenti un eventuale
  // min-width:100% già scritto inline nel template (customFieldSelect)
  // si ricalcolerebbe contro la finestra invece che contro .cdrop, e
  // vincendo su width (min-width ha sempre la precedenza) il menu
  // finirebbe largo quanto tutto il viewport. Azzerare min-width dopo
  // aver fissato width lo rende autoritativo in ogni caso.
  const naturalWidth = menu.getBoundingClientRect().width || menu.scrollWidth;
  menu.style.width = naturalWidth + 'px';
  menu.style.minWidth = '0';
  menu.style.position = 'fixed';

  const alignRight = menu.classList.contains('align-right');
  let left = alignRight ? (triggerRect.right - naturalWidth) : triggerRect.left;
  left = Math.max(edgeMargin, Math.min(left, viewportW - naturalWidth - edgeMargin));
  menu.style.left = left + 'px';
  menu.style.right = 'auto';

  if(openUp){
    menu.style.top = 'auto';
    menu.style.bottom = (viewportH - triggerRect.top + gap) + 'px';
  } else {
    menu.style.bottom = 'auto';
    menu.style.top = (triggerRect.bottom + gap) + 'px';
  }
}

document.addEventListener('click', function(e){
  if(calLongPressFired && e.target.closest('.cal-cell')){ calLongPressFired = false; return; }

  // apertura/chiusura tendina personalizzata: un solo menu aperto alla volta
  const cdropTrigger = e.target.closest('.cdrop-trigger');
  if(cdropTrigger){
    const id = cdropTrigger.dataset.cdropId;
    const menu = document.querySelector(`.cdrop-menu[data-cdrop-id="${id}"]`);
    const wasOpen = menu && menu.classList.contains('open');
    closeOpenCdropMenus();
    if(menu && !wasOpen){
      menu.classList.add('open');
      positionCdropMenu(menu, cdropTrigger);
    }
    return;
  }
  // click fuori da qualsiasi tendina: chiude quella eventualmente aperta
  if(!e.target.closest('.cdrop')){
    closeOpenCdropMenus();
  } else {
    // click su una voce del menu: la chiude comunque (l'azione, se c'è, prosegue sotto)
    const menu = e.target.closest('.cdrop-menu');
    if(menu) menu.classList.remove('open');
  }

  // selezione di uno stato presenza dalla tendina a pillola (niente render():
  // eviterebbe di perdere le scelte non ancora salvate delle altre righe)
  const pillItem = e.target.closest('[data-action="pill-pick"]');
  if(pillItem){
    const wrapper = pillItem.closest('.cdrop');
    const val = pillItem.dataset.value;
    wrapper.dataset.value = val;
    const trigger = wrapper.querySelector('.cdrop-trigger');
    const labelFn = wrapper.hasAttribute('data-attselect') ? attLabel4 : attLabel3;
    trigger.innerHTML = `${escapeHtml(labelFn(val))} <span class="cdrop-caret">${icon('chevronDown')}</span>`;
    trigger.setAttribute('style', attSelectStyle(val));
    wrapper.querySelectorAll('.cdrop-item').forEach(it=>it.classList.toggle('is-current', it.dataset.value===val));
    if(wrapper.hasAttribute('data-att3select')){
      const pid = wrapper.dataset.att3select;
      const row = wrapper.closest('.list-item');
      const extra = row ? row.querySelector('.player-extra-fields') : null;
      if(extra) extra.style.display = (val==='P') ? 'flex' : 'none';
      if(UI.modal && UI.modal.type==='raggruppamento'){
        const draft = ensureRaggruppamentoDraft();
        draft.squadra[pid] = draft.squadra[pid] || {stato:'P', gol:0};
        draft.squadra[pid].stato = val;
      }
    }
    return;
  }

  // selezione da una tendina-campo generica (ordinamenti, filtri, sede/competizione/torneo, mese/anno...)
  const fieldItem = e.target.closest('[data-action="field-pick"]');
  if(fieldItem){
    const wrapper = fieldItem.closest('.cdrop');
    const val = fieldItem.dataset.value;
    wrapper.dataset.value = val;
    const labelSpan = wrapper.querySelector('.field-select-label');
    if(labelSpan) labelSpan.textContent = fieldItem.textContent;
    wrapper.querySelectorAll('.cdrop-item').forEach(it=>it.classList.toggle('is-current', it.dataset.value===val));
    const field = wrapper.dataset.field;
    if(field==='anagrafica-sort'){ UI.anagraficaSort = val; render(); }
    else if(field==='roster-sort'){ UI.rosterSort = val; render(); }
    else if(field==='home-select-season'){ UI.homeSeasonId = val; UI.homePlayerId=null; UI.homeCardFields=null; render(); }
    else if(field==='home-select-player'){ UI.homePlayerId = val; UI.homeCardFields=null; render(); }
    else if(field==='select-card-player'){ UI.cardPlayerId = val; UI.cardFields=null; render(); }
    else if(field==='filter-tournament-stats'){ UI.statsTournamentFilter = val; render(); }
    else if(field==='stats-match-mode'){ UI.statsMatchMode = val; saveLastSelection({statsMatchMode: val}); render(); }
    else if(field==='set-ritardo-weight'){ const team=currentTeam(); if(team){ team.ritardoWeight=Number(val); saveState(); render(); } }
    else if(field==='torneoId-draft'){ const draft=ensureRaggruppamentoDraft(); draft.torneoId = val; }
    else if(field==='sede'){
      const mapsField = document.getElementById('maps-link-field');
      if(mapsField) mapsField.classList.toggle('open', val==='trasferta');
    }
    // competizione, torneoId (form partita), mese, anno: nessun effetto immediato — letti al submit tramite fv()
    return;
  }

  // stepper +/- per campi numerici (gol, assist, cartellino giallo) — pressione prolungata (~2s) = ±5
  const stepBtn = e.target.closest('.stepper-btn');
  if(stepBtn){
    if(stepperHoldFired){ stepperHoldFired = false; return; } // già applicato il balzo da +5/-5, ignora il click normale
    applyStepperChange(stepBtn, Number(stepBtn.dataset.stepdir));
    return;
  }

  // chiusura popup cliccando sfondo scuro (mai esegue onConfirm in questo caso)
  if(e.target.classList && e.target.classList.contains('overlay') && e.target.dataset.action==='overlay-close-popup'){ UI.popup = null; renderPopup(); return; }
  // chiusura modal cliccando sfondo scuro: solo se il markup lo consente (data-action
  // esatto, assente per i modali con dati non salvati — vedi MODALI_CON_DATI_NON_SALVATI
  // in renderModal()). Controllo simmetrico a quello dei popup sopra.
  if(e.target.classList && e.target.classList.contains('overlay') && e.target.dataset.action==='overlay-close'){ closeModal(); return; }

  const actionEl = e.target.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.dataset.action;

  switch(action){
    case 'open-season-manager': openModal('season-manager'); break;
    case 'open-team-manager': openModal('team-manager', {seasonId: actionEl.dataset.sid || UI.seasonId}); break;
    case 'enter-team': enterTeam(actionEl.dataset.tid); break;
    case 'enter-season': enterSeason(actionEl.dataset.sid); break;
    case 'nav-seasons': UI.screen='seasons'; render(); break;
    case 'nav-anagrafica': UI.screen='anagrafica'; render(); break;
    case 'nav-stats-generali': UI.screen='stats-generali'; render(); break;
    case 'nav-back': closeTopLayer({senzaGuardia:true}); break;   // stessa funzione del tasto Indietro del telefono (ma "<" non consuma mai la guardia del doppio Indietro)
    case 'open-set-name': openModal('set-name'); break;
    case 'anagrafica-filter': UI.anagraficaFilter = actionEl.dataset.filter; render(); break;
    case 'sort-stats': {
      const key = actionEl.dataset.key;
      if(UI.statsSortKey===key){
        UI.statsSortDir = UI.statsSortDir==='asc' ? 'desc' : 'asc';
      } else {
        UI.statsSortKey = key;
        UI.statsSortDir = key==='nome' ? 'asc' : 'desc';
      }
      render();
      break;
    }
    case 'toggle-primary-team': {
      const tid = actionEl.dataset.tid;
      if(STATE.primaryTeamId===tid){
        STATE.primaryTeamId = null;
        saveState(); render();
      } else if(!STATE.primaryTeamId){
        STATE.primaryTeamId = tid;
        saveState(); render();
      } else {
        const current = getTeam(STATE.primaryTeamId);
        showAlert(`Togli prima la stella da "${current?current.nome:'quella attuale'}", poi potrai assegnarla a questa squadra.`);
      }
      break;
    }
    case 'go-home': goHome(); break;
    case 'open-edit-season': openModal('edit-season', {sid: actionEl.dataset.sid}); break;
    case 'open-confirm-delete-season': openModal('confirm-delete-season', {sid: actionEl.dataset.sid}); break;
    case 'open-edit-team': openModal('edit-team', {tid: actionEl.dataset.tid}); break;
    case 'open-confirm-delete-team': openModal('confirm-delete-team', {tid: actionEl.dataset.tid}); break;
    case 'confirm-delete-season': {
      deleteSeasonData(actionEl.dataset.sid);
      if(UI.seasonId===actionEl.dataset.sid) UI.seasonId = STATE.seasons[0] ? STATE.seasons[0].id : null;
      if(UI.teamId && !getTeam(UI.teamId)){ UI.teamId=null; UI.screen='home'; }
      closeModal();
      break;
    }
    case 'confirm-delete-team': {
      const wasCurrent = UI.teamId===actionEl.dataset.tid;
      deleteTeamData(actionEl.dataset.tid);
      if(wasCurrent){ UI.teamId=null; UI.screen='home'; }
      closeModal();
      break;
    }
    case 'open-new-player-global': openModal('edit-player', {}); break;
    case 'dismiss-banner': UI.bannerDismissed = true; render(); break;
    case 'close-modal': closeModal(); break;
    case 'close-popup': UI.popup = null; renderPopup(); break;
    case 'confirm-popup': {
      // il popup si chiude subito (solo #popup-zone, non tocca il resto): onConfirm
      // può fare un render() completo o un aggiornamento mirato del DOM, indifferentemente
      const onConfirm = UI.popup && UI.popup.onConfirm;
      UI.popup = null;
      renderPopup();
      if(onConfirm) onConfirm();
      break;
    }

    case 'nav': UI.view = actionEl.dataset.view; render(); break;

    case 'cal-prev':
      UI.calMonth--; if(UI.calMonth<0){ UI.calMonth=11; UI.calYear--; } render(); break;
    case 'cal-next':
      UI.calMonth++; if(UI.calMonth>11){ UI.calMonth=0; UI.calYear++; } render(); break;
    case 'open-jump-month': openModal('jump-month'); break;
    // "visto" = l'istantanea di CIÒ che il pannello mostra ora, non un generico "ho guardato
    // oggi": se dopo questa apertura arriva un promemoria nuovo, il suo id non è in questo
    // Set, quindi hasUnseenReminders() torna true di nuovo (vedi reminderId sopra).
    case 'open-notifiche': UI.notifSeenIds = new Set(todaysReminders().map(reminderId)); openModal('notifiche'); break;
    case 'open-notif-event': {
      const ev = STATE.events.find(x=>x.id===actionEl.dataset.eventid);
      const evTeam = ev && getTeam(ev.teamId);
      if(evTeam){
        // anche la stagione della squadra: senza, "<" dalla squadra salirebbe alla lista Squadre di un'altra stagione
        UI.seasonId = evTeam.seasonId;
        UI.teamId = ev.teamId; UI.screen = 'team'; UI.view = 'calendario';
        openModal('event-detail', {eventId: ev.id});
      }
      break;
    }
    case 'open-player-andamento': openModal('player-andamento', {playerId: actionEl.dataset.pid, teamId: UI.teamId, tab:'allenamenti', expanded:{allenamenti:false, partite:false, raggruppamenti:false}}); break;
    case 'andamento-tab': {
      if(UI.modal){
        const tab = actionEl.dataset.tab;
        UI.modal.payload.tab = tab;
        const seg = actionEl.closest('.seg');
        if(seg) seg.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
        const player = getPlayer(UI.modal.payload.playerId);
        const team = getTeam(UI.modal.payload.teamId);
        const bodyEl = document.getElementById('andamento-body');
        const summaryEl = document.getElementById('andamento-summary');
        const expanded = (UI.modal.payload.expanded && UI.modal.payload.expanded[tab]) || false;
        if(player && team && bodyEl) bodyEl.innerHTML = andamentoBodyHtml(player, team, tab, expanded);
        if(player && team && summaryEl) summaryEl.innerHTML = andamentoSummaryHtml(player, team, tab);
      }
      break;
    }
    case 'andamento-toggle-expand': {
      if(UI.modal){
        const p = UI.modal.payload;
        const tab = actionEl.dataset.tab;
        p.expanded = p.expanded || {allenamenti:false, partite:false, raggruppamenti:false};
        p.expanded[tab] = !p.expanded[tab];
        const player = getPlayer(p.playerId);
        const team = getTeam(p.teamId);
        const bodyEl = document.getElementById('andamento-body');
        if(player && team && bodyEl){
          bodyEl.innerHTML = andamentoBodyHtml(player, team, tab, p.expanded[tab]);
          // forza un reflow sincrono: senza, se l'utente inizia a scorrere
          // subito dopo l'espansione (nuova altezza del contenuto), lo
          // sticky .modal-head può restare temporaneamente sui vecchi
          // confini di clipping e lasciare intravedere sopra di sé
          // contenuto già superato dallo scroll.
          void bodyEl.offsetHeight;
        }
      }
      break;
    }
    case 'cal-today':
      UI.calYear = new Date().getFullYear(); UI.calMonth = new Date().getMonth(); render(); break;

    case 'open-day': openModal('day', {date: actionEl.dataset.date}); break;
    case 'new-event': openModal(actionEl.dataset.type, {date: actionEl.dataset.date}); break;
    case 'view-event': openModal('event-detail', {eventId: actionEl.dataset.eventid}); break;
    case 'edit-event': {
      const ev = STATE.events.find(x=>x.id===actionEl.dataset.eventid);
      if(ev) openModal(ev.type, {date: ev.date, eventId: ev.id});
      break;
    }
    case 'delete-event': {
      const ev = STATE.events.find(x=>x.id===actionEl.dataset.eventid);
      const label = ev ? eventDeleteLabel(ev) : 'questo impegno';
      const eventId = actionEl.dataset.eventid;
      showConfirm(`Sei sicuro di voler eliminare ${label}? L'azione non si può annullare.`, () => {
        const date = ev ? ev.date : null;
        deleteEventData(eventId);
        if(date) openModal('day', {date}); else closeModal();
      }, {danger:true, confirmLabel:'Elimina'});
      break;
    }

    case 'toggle-detailed': {
      const sw = document.getElementById('detailed-switch');
      const input = document.getElementById('dettagliata-input');
      const nowOn = !sw.classList.contains('on');
      sw.classList.toggle('on', nowOn);
      input.value = nowOn ? '1' : '';
      document.querySelectorAll('.assist-field').forEach(el=> el.style.display = nowOn? 'flex':'none');
      break;
    }
    case 'toggle-presenze-list': {
      const target = document.getElementById(actionEl.dataset.target);
      const label = actionEl.dataset.label || 'presenze';
      const nowOpen = !target.classList.contains('open');
      target.classList.toggle('open', nowOpen);
      actionEl.textContent = nowOpen ? `Nascondi ${label}` : `Mostra ${label}`;
      break;
    }
    case 'toggle-raggruppamento-dettagliata': {
      const draft = ensureRaggruppamentoDraft();
      draft.dettagliata = !draft.dettagliata;
      actionEl.classList.toggle('on', draft.dettagliata);
      document.querySelectorAll('.rg-assist-field').forEach(el=> el.style.display = draft.dettagliata? 'flex':'none');
      break;
    }

    case 'add-minimatch': {
      const draft = ensureRaggruppamentoDraft();
      draft.miniPartite.push({avversario:'', risultato:'', note:''});
      const list = document.getElementById('minimatch-list');
      if(list){
        list.innerHTML = minimatchListHtml(draft);
        // la lista mini-partite potrebbe essere chiusa: apriamola, altrimenti
        // la riga appena aggiunta sparirebbe alla vista senza spiegazione
        if(!list.classList.contains('open')) list.classList.add('open');
      }
      const toggleBtn = document.querySelector('[data-action="toggle-presenze-list"][data-target="minimatch-list"]');
      if(toggleBtn) toggleBtn.textContent = 'Nascondi mini-partite';
      const roster = rosterAt(UI.teamId, UI.modal.payload.date);
      const warnEl = document.getElementById('minimatch-warning');
      if(warnEl) warnEl.innerHTML = minimatchWarnHtml(draft, roster);
      break;
    }
    case 'remove-minimatch': {
      const draft = ensureRaggruppamentoDraft();
      const idx = Number(actionEl.dataset.idx);
      const mm = draft.miniPartite[idx];
      const label = mm && mm.avversario ? `la mini-partita vs ${mm.avversario}` : 'questa mini-partita';
      showConfirm(`Sei sicuro di voler rimuovere ${label}?`, () => {
        draft.miniPartite.splice(idx,1);
        const list = document.getElementById('minimatch-list');
        if(list) list.innerHTML = minimatchListHtml(draft);
        const roster = rosterAt(UI.teamId, UI.modal.payload.date);
        const warnEl = document.getElementById('minimatch-warning');
        if(warnEl) warnEl.innerHTML = minimatchWarnHtml(draft, roster);
      }, {danger:true, confirmLabel:'Rimuovi'});
      break;
    }

    case 'set-team-mode': {
      const team = currentTeam();
      team.mode = actionEl.dataset.mode;
      saveState(); render();
      break;
    }

    case 'open-edit-player': openModal('edit-player', {pid: actionEl.dataset.pid}); break;
    case 'open-new-player-for-team': openModal('edit-player', {forTeam:true}); break;
    case 'open-add-existing-player': UI.addExistingPlayerSearch=''; openModal('add-existing-player'); break;
    case 'assign-player': {
      const pid = actionEl.dataset.pid;
      const pl = getPlayer(pid);
      const conflict = pl ? findSoprannomeConflict(pid, pl.soprannome, UI.teamId) : null;
      if(conflict){ showAlert(conflict); break; }
      assignPlayerToTeam(pid, UI.teamId, todayStr());
      closeModal();
      break;
    }
    case 'open-reassign-player': openModal('reassign-player', {pid: actionEl.dataset.pid}); break;
    case 'confirm-reassign-player': {
      const pid = actionEl.dataset.pid;
      const pl = getPlayer(pid);
      const dataIngresso = document.getElementById('reassign-date').value;

      const conflict = pl ? findSoprannomeConflict(pid, pl.soprannome, UI.teamId) : null;
      if(conflict){ showAlert(conflict); break; }

      const previousAssignments = STATE.assignments.filter(a=>a.playerId===pid && a.teamId===UI.teamId && a.dataUscita);
      const lastDataUscita = previousAssignments.length
        ? previousAssignments.map(a=>a.dataUscita).sort().slice(-1)[0]
        : null;
      if(lastDataUscita && dataIngresso<=lastDataUscita){
        showAlert(`${pl?displayName(pl):'Il giocatore'} è già stato in questa squadra fino al ${formatIt(lastDataUscita)}. La nuova data di ingresso deve essere successiva a quella data. Correggi la data per procedere.`);
        break;
      }
      if(pl && pl.dataNascita && dataIngresso<pl.dataNascita){
        showAlert(`La data di ingresso (${formatIt(dataIngresso)}) non può essere precedente alla data di nascita di ${displayName(pl)} (${formatIt(pl.dataNascita)}). Correggi la data per procedere.`);
        break;
      }

      assignPlayerToTeam(pid, UI.teamId, dataIngresso);
      closeModal();
      break;
    }
    case 'open-confirm-delete-player': openModal('confirm-delete-player', {pid: actionEl.dataset.pid}); break;
    case 'confirm-delete-player':
      deletePlayerPermanently(actionEl.dataset.pid);
      closeModal();
      break;
    case 'open-remove-from-team': openModal('remove-from-team', {pid: actionEl.dataset.pid, assignmentId: actionEl.dataset.assignmentid}); break;
    case 'confirm-remove-from-team': {
      const assignmentId = actionEl.dataset.assignmentid;
      const assignment = STATE.assignments.find(a=>a.id===assignmentId);
      const dataUscita = document.getElementById('remove-date').value;

      if(assignment && dataUscita && dataUscita < assignment.dataIngresso){
        showAlert(`La data di uscita (${formatIt(dataUscita)}) non può essere precedente alla data di ingresso in squadra (${formatIt(assignment.dataIngresso)}). Correggi la data per procedere.`);
        break;
      }

      const pl = assignment ? getPlayer(assignment.playerId) : null;
      const team = assignment ? getTeam(assignment.teamId) : null;
      showConfirm(
        `Stai per far uscire ${pl?displayName(pl):'questo giocatore'} dalla squadra ${team?team.nome:''} dal ${formatIt(dataUscita)}. I suoi dati storici (allenamenti, partite) restano comunque salvati e consultabili.\n\nConfermi?`,
        () => {
          removeFromTeamConfirmed(assignmentId, dataUscita);
          closeModal();
        },
        {danger:true, confirmLabel:'Conferma uscita'}
      );
      break;
    }

    case 'open-edit-tournament': openModal('edit-tournament', {tid: actionEl.dataset.tid}); break;
    case 'view-tournament-scorers':
      UI.statsTournamentFilter = actionEl.dataset.tid;
      UI.statsMatchMode = 'totale';
      UI.statsSortKey = 'gol';
      UI.statsSortDir = 'desc';
      UI.view = 'stats';
      render();
      break;
    case 'quick-delete-tournament': {
      const tid = actionEl.dataset.tid;
      const tour = STATE.tournaments.find(x=>x.id===tid);
      const nome = tour ? tour.nome : 'questo torneo';
      showConfirm(`Sei sicuro di voler eliminare il torneo "${nome}"? Le partite collegate resteranno ma senza torneo associato.`, () => {
        deleteTournamentData(tid); render();
      }, {danger:true, confirmLabel:'Elimina'});
      break;
    }

    case 'toggle-card-field': {
      const team = currentTeam();
      if(!UI.cardFields) UI.cardFields = (team.cardFields&&team.cardFields.length? team.cardFields.slice() : DEFAULT_CARD_FIELDS.slice());
      const f = actionEl.dataset.field;
      if(UI.cardFields.includes(f)) UI.cardFields = UI.cardFields.filter(x=>x!==f);
      else UI.cardFields.push(f);
      render();
      break;
    }
    case 'save-card-fields-default': {
      const team = currentTeam();
      team.cardFields = (UI.cardFields || DEFAULT_CARD_FIELDS.slice()).slice();
      saveState();
      render();
      break;
    }
    case 'print-card': printPlayerCard(); break;
    case 'print-home-card': printHomeCard(); break;
    case 'toggle-home-card-field': {
      if(!UI.homeCardFields) UI.homeCardFields = DEFAULT_CARD_FIELDS.slice();
      const f = actionEl.dataset.field;
      if(UI.homeCardFields.includes(f)) UI.homeCardFields = UI.homeCardFields.filter(x=>x!==f);
      else UI.homeCardFields.push(f);
      render();
      break;
    }
    case 'open-backup': openModal('backup'); break;
    case 'show-info':
      // dentro un modale l'info è un popup (non ne sostituisce il form); fuori
      // dai modali resta il modale 'info', con la sua voce di cronologia
      if(UI.modal) showInfo(actionEl.dataset.infokey);
      else openModal('info', {key: actionEl.dataset.infokey});
      break;
    case 'show-overlap-warning': showAlert(`Si sovrappone a: ${actionEl.dataset.label}`); break;
    case 'export-backup': exportBackup(); break;
    case 'export-stats-csv': exportStatsCsv(); break;
  }
});

function sembraLinkMappe(url){
  if(!url) return true; // campo vuoto: nessun avviso
  const noti = ['google.com/maps','goo.gl/maps','maps.app.goo.gl',
    'maps.apple.com','waze.com','bing.com/maps','here.com','citymapper.com','moovit.com'];
  return noti.some(d => url.toLowerCase().includes(d));
}
// Schemi pericolosi: aprirli eseguirebbe codice invece di mostrare una mappa. A differenza
// di sembraLinkMappe (avviso, non blocca), qui lo schema stesso è pericoloso, non solo "non
// riconosciuto": si blocca silenziosamente, senza un avviso dedicato (l'avviso "non sembra
// un link di mappe" compare comunque, dato che questi schemi non sono in quell'elenco).
// Guardia doppia: qui al salvataggio, e in modalEventDetail al momento di disegnare il link
// (un vecchio backup importato prima di questo controllo potrebbe già contenerne uno: import
// non valida il tipo dei campi, solo la struttura).
function schemaLinkPericoloso(url){
  return !!url && /^\s*(javascript|data|vbscript)\s*:/i.test(url);
}

// Ricerca testuale "live": aggiorna mentre si digita, rigenerando solo il
// contenitore dei risultati (mai l'intera schermata) — l'input stesso non
// viene mai sostituito, quindi non serve nessun ripristino di focus/cursore.
document.addEventListener('input', function(e){
  const t = e.target;
  if(t.dataset.action==='anagrafica-search'){
    UI.anagraficaSearch = t.value;
    const list = document.getElementById('anagrafica-list');
    if(list) list.innerHTML = anagraficaListHtml(anagraficaFilteredPlayers());
    return;
  }
  if(t.dataset.action==='roster-search'){
    UI.rosterSearch = t.value;
    const team = currentTeam();
    const roster = rosterFiltered(team);
    const list = document.getElementById('roster-list');
    if(list) list.innerHTML = rosterListHtml(roster, rosterAt(team.id, null).length);
    return;
  }
  if(t.dataset.action==='add-existing-player-search'){
    UI.addExistingPlayerSearch = t.value;
    const list = document.getElementById('add-existing-player-list');
    if(list) list.innerHTML = addExistingPlayerListHtml(addExistingPlayerFiltered());
    return;
  }
  // draft raggruppamento: risultato mini-partita — normalizzato in tempo
  // reale nel formato "numero-numero" (vedi normalizeRisultato), con esito
  // (Vittoria/Sconfitta/Pareggio) aggiornato subito accanto al campo.
  if(t.dataset.mm==='risultato'){
    const normalized = normalizeRisultato(t.value);
    if(normalized !== t.value){
      t.value = normalized;
      try{ t.setSelectionRange(normalized.length, normalized.length); }catch(err){}
    }
    const draft = ensureRaggruppamentoDraft();
    const idx = Number(t.dataset.idx);
    draft.miniPartite[idx].risultato = normalized;
    const esitoEl = document.querySelector(`[data-mm-esito="${idx}"]`);
    if(esitoEl) esitoEl.innerHTML = minimatchEsitoHtml(normalized);
    return;
  }
  if(t.name==='mapsLink'){
    const warning = document.getElementById('maps-link-warning');
    if(warning) warning.style.display = sembraLinkMappe(t.value) ? 'none' : 'block';
  }
  // avviso NON bloccante "nome squadra simile": solo sui form di creazione/
  // rinomina squadra, mai su altri campi che si chiamano anch'essi "nome"
  // (stagione, giocatore...)
  if(t.name==='nome'){
    const form = t.closest('form');
    const formType = form && form.dataset.form;
    if(formType==='new-team' || formType==='rename-team'){
      const tid = formType==='rename-team' ? form.dataset.tid : null;
      const team = tid ? getTeam(tid) : null;
      const seasonId = formType==='new-team' ? (form.dataset.sid || UI.seasonId) : (team ? team.seasonId : UI.seasonId);
      const hint = findSimilarTeamNameHint(tid, t.value, seasonId);
      const hintEl = document.getElementById('team-name-similar-hint');
      if(hintEl) hintEl.textContent = hint ? `⚠️ ${hint}` : '';
    }
  }
});

document.addEventListener('change', function(e){
  const t = e.target;

  // seconda ammonizione = espulsione: spunta automaticamente il rosso quando i gialli
  // arrivano a 2, e lo toglie di nuovo se poi si corregge il numero di gialli sotto 2 —
  // ma solo finché il rosso non è stato toccato a mano (redMode='manual'): un rosso
  // diretto impostato apposta dall'utente (es. con 0 o 1 giallo) non viene mai alterato.
  if(t.dataset.role==='giallo'){
    if(Number(t.value)>2) t.value = 2;
    const pid = t.dataset.pid;
    const row = t.closest('.list-item');
    const rossoBox = row ? row.querySelector(`[data-role="rosso"][data-pid="${pid}"]`) : null;
    if(rossoBox && rossoBox.dataset.redMode!=='manual'){
      const giallo = Number(t.value);
      if(giallo>=2 && !rossoBox.checked){
        rossoBox.checked = true;
        rossoBox.dataset.redMode = 'auto';
      } else if(giallo<2 && rossoBox.checked && rossoBox.dataset.redMode==='auto'){
        rossoBox.checked = false;
        rossoBox.dataset.redMode = '';
      }
    }
    return;
  }
  // rosso toccato direttamente dall'utente (spuntato o tolto a mano): da questo
  // momento l'automatismo sui gialli non lo tocca più, per il resto di questa
  // sessione di modifica (rosso diretto, o scelta deliberata di non metterlo).
  if(t.dataset.role==='rosso'){
    t.dataset.redMode = 'manual';
    return;
  }

  if(t.dataset.action==='import-backup-file'){
    if(t.files && t.files[0]) importBackupFile(t.files[0]);
    // senza azzerare value, il browser non riattiva 'change' se l'utente
    // riseleziona lo stesso file (stesso percorso) subito dopo — sia in
    // caso di successo che di fallimento dell'import.
    t.value = '';
    return;
  }
  if(t.dataset.action==='change-season'){
    UI.seasonId = t.value;
    const teams = teamsOfSeason(UI.seasonId);
    UI.teamId = teams[0] ? teams[0].id : null;
    UI.bannerDismissed = false;
    saveLastSelection({seasonId: UI.seasonId, teamId: UI.teamId});
    render(); return;
  }
  if(t.dataset.action==='change-team'){
    UI.teamId = t.value; UI.bannerDismissed = false;
    saveLastSelection({teamId: UI.teamId});
    render(); return;
  }
  if(t.dataset.action==='home-card-note-input'){
    // nota specifica del giocatore mostrato in quel momento (data-pid, non
    // UI.homePlayerId: dopo il fix del fallback quest'ultimo può differire
    // dal giocatore effettivamente a video) — persistita sul giocatore
    // stesso, non solo in UI, cosi' sopravvive a cambio schermata/riavvio.
    const player = getPlayer(t.dataset.pid);
    if(player){ player.homeCardNote = t.value; saveState(); }
    return; // niente render(): non serve, evita di disturbare il resto della schermata
  }
  if(t.dataset.action==='card-note-input'){
    const player = getPlayer(t.dataset.pid);
    if(player){ player.cardNote = t.value; saveState(); }
    return; // no full re-render needed
  }

  // draft raggruppamento: label / torneo
  if(t.dataset.draft){
    const draft = ensureRaggruppamentoDraft();
    draft[t.dataset.draft] = t.value;
    render();
    return;
  }
  // draft raggruppamento: vista squadra (gol)
  if(t.dataset.rgGol){
    const draft = ensureRaggruppamentoDraft();
    const pid = t.dataset.rgGol;
    draft.squadra[pid] = draft.squadra[pid] || {stato:'P', gol:0, assist:0};
    draft.squadra[pid].gol = Number(t.value)||0;
    return; // niente re-render: evita di perdere il focus sull'input
  }
  // draft raggruppamento: vista squadra (assist)
  if(t.dataset.rgAssist){
    const draft = ensureRaggruppamentoDraft();
    const pid = t.dataset.rgAssist;
    draft.squadra[pid] = draft.squadra[pid] || {stato:'P', gol:0, assist:0};
    draft.squadra[pid].assist = Number(t.value)||0;
    return;
  }
  // draft raggruppamento: mini-partite
  if(t.dataset.mm){
    const draft = ensureRaggruppamentoDraft();
    const idx = Number(t.dataset.idx);
    draft.miniPartite[idx][t.dataset.mm] = t.value;
    render();
    return;
  }
});

function fv(form, name){
  const el = form.querySelector(`[name="${name}"]`);
  if(el) return el.value;
  const cdrop = form.querySelector(`[data-field="${name}"]`);
  return cdrop ? (cdrop.dataset.value||'') : '';
}
// Compone "HH:MM" dai campi ora/minuti del form, o null se non impostati
// (entrambi vuoti = orario non specificato). Stessa espressione riusata nei
// submit handler di allenamento/partita/impegno generale.
function oraFromForm(form){
  return (fv(form,'oraH') && fv(form,'oraM')) ? `${fv(form,'oraH')}:${fv(form,'oraM')}` : null;
}

document.addEventListener('submit', function(e){
  e.preventDefault();
  const form = e.target;
  const type = form.dataset.form;

  if(type==='set-name'){
    const nome = fv(form,'nome').trim();
    const club = fv(form,'club').trim();
    if(nome){ STATE.userName = nome; }
    if(club!==undefined){ STATE.clubName = club || null; }
    saveState();
    closeModal();
    return;
  }

  if(type==='jump-month'){
    UI.calMonth = Number(fv(form,'mese'));
    UI.calYear = Number(fv(form,'anno'));
    closeModal();
    return;
  }

  if(type==='new-season'){
    const nome = fv(form,'nome').trim();
    if(!nome) return;
    const conflict = findSeasonNameConflict(null, nome);
    if(conflict){ showAlert(conflict); return; }
    const s = addSeason(nome);
    UI.seasonId = s.id;
    closeModal();
    return;
  }

  if(type==='new-team'){
    const nome = fv(form,'nome').trim();
    if(!nome) return;
    const sid = form.dataset.sid || UI.seasonId;
    const conflict = findTeamNameConflict(null, nome, sid);
    if(conflict){ showAlert(conflict); return; }
    const t = addTeam(nome, sid);
    UI.seasonId = sid;
    closeModal();
    return;
  }

  if(type==='rename-season'){
    const nome = fv(form,'nome').trim();
    if(!nome) return;
    const conflict = findSeasonNameConflict(form.dataset.sid, nome);
    if(conflict){ showAlert(conflict); return; }
    renameSeasonData(form.dataset.sid, nome);
    closeModal();
    return;
  }

  if(type==='rename-team'){
    const nome = fv(form,'nome').trim();
    if(!nome) return;
    const team = getTeam(form.dataset.tid);
    const conflict = findTeamNameConflict(form.dataset.tid, nome, team ? team.seasonId : null);
    if(conflict){ showAlert(conflict); return; }
    renameTeamData(form.dataset.tid, nome);
    closeModal();
    return;
  }

  if(type==='save-player'){
    const pid = form.dataset.pid || null;
    const forTeam = form.dataset.forteam === '1';
    const data = {
      nome: fv(form,'nome').trim(),
      cognome: fv(form,'cognome').trim(),
      dataNascita: fv(form,'dataNascita') || null,
      soprannome: fv(form,'soprannome').trim()
    };
    // l'attributo required del campo non ferma una stringa di soli spazi: dopo
    // il trim il Nome può risultare vuoto, e la scheda ha bisogno di un nome
    // reale. showAlert non tocca il form, quindi ciò che è stato digitato resta.
    if(!data.nome){
      showAlert('Il nome del giocatore non può essere vuoto (nemmeno fatto di soli spazi). Scrivi il nome per procedere.');
      return;
    }
    const contextTeamId = (!pid && forTeam) ? UI.teamId : undefined;
    const conflict = findPlayerConflict(pid, data, contextTeamId);
    if(conflict){ showAlert(conflict); return; }
    const pl = savePlayerData(pid, data);
    if(!pid && forTeam){ assignPlayerToTeam(pl.id, UI.teamId, todayStr()); }
    closeModal();
    return;
  }

  if(type==='save-tournament'){
    const tid = form.dataset.tid || null;
    const existing = tid ? STATE.tournaments.find(t=>t.id===tid) : null;
    // un torneo esistente mantiene la propria squadra; uno nuovo (o uno non
    // ancora assegnato) viene legato alla squadra da cui lo si sta salvando
    const teamId = (existing && existing.teamId) ? existing.teamId : UI.teamId;
    const nome = fv(form,'nome').trim();
    const conflict = findTournamentNameConflict(tid, nome, teamId);
    if(conflict){ showAlert(conflict); return; }
    saveTournamentData(tid, { nome, regole: fv(form,'regole').trim(), teamId });
    closeModal();
    return;
  }

  if(type==='generale'){
    const date = form.dataset.date;
    const eventId = form.dataset.eventid || null;
    upsertEvent(eventId, UI.teamId, date, 'generale', {
      titolo: fv(form,'titolo').trim(),
      orario: oraFromForm(form),
      durata: null,
      note: fv(form,'note').trim(),
      confermato: true,   // l'impegno generale non ha presenze/convocati: sempre "confermato", mai segnalato
    });
    closeModal();
    return;
  }

  if(type==='allenamento'){
    const date = form.dataset.date;
    const eventId = form.dataset.eventid || null;
    const presenze = {};
    form.querySelectorAll('[data-attselect]').forEach(wrap=>{
      if(wrap.dataset.value) presenze[wrap.dataset.attselect] = wrap.dataset.value;
    });
    upsertEvent(eventId, UI.teamId, date, 'allenamento', {
      presenze,
      note: fv(form,'note').trim(),
      orario: oraFromForm(form),
      durata: fv(form,'durata') ? Number(fv(form,'durata')) : null,
      // "da confermare" alla creazione (eventId assente): il mister ha appena creato
      // l'impegno, non necessariamente guardato le presenze. Diventa "confermato" al primo
      // salvataggio SUCCESSIVO (eventId presente): il mister lo ha riaperto e ha premuto
      // Salva, anche se non ha cambiato nulla nella sezione presenze (equivale ad averci
      // guardato e trovato tutto giusto). Nessun percorso oggi salva solo l'orario senza
      // passare da questa stessa sezione: vedi il commento su upsertEvent in state.js.
      confermato: !!eventId,
    });
    closeModal();
    return;
  }

  if(type==='partita'){
    const date = form.dataset.date;
    const eventId = form.dataset.eventid || null;
    const giocatori = {};
    form.querySelectorAll('[data-att3select]').forEach(wrap=>{
      const pid = wrap.dataset.att3select;
      const stato = wrap.dataset.value;
      const row = wrap.closest('.list-item');
      const gol = Number(row.querySelector('[data-role="gol"]').value)||0;
      const assist = Number(row.querySelector('[data-role="assist"]').value)||0;
      const giallo = Number(row.querySelector('[data-role="giallo"]').value)||0;
      const rosso = row.querySelector('[data-role="rosso"]').checked;
      giocatori[pid] = stato==='P'
        ? {stato, gol, assist, giallo, rosso}
        : {stato, gol:0, assist:0, giallo:0, rosso:false};
    });
    upsertEvent(eventId, UI.teamId, date, 'partita', {
      avversario: fv(form,'avversario').trim(),
      sede: fv(form,'sede'),
      mapsLink: (function(){ const v = fv(form,'mapsLink'); return (v && !schemaLinkPericoloso(v)) ? v : null; })(),
      competizione: fv(form,'competizione'),
      torneoId: fv(form,'torneoId') || null,
      dettagliata: document.getElementById('dettagliata-input').value === '1',
      note: fv(form,'note').trim(),
      orario: oraFromForm(form),
      durata: fv(form,'durata') ? Number(fv(form,'durata')) : null,
      giocatori,
      confermato: !!eventId,   // vedi il commento nel ramo 'allenamento' sopra
    });
    closeModal();
    return;
  }

  if(type==='raggruppamento'){
    const date = form.dataset.date;
    const eventId = form.dataset.eventid || null;
    const draft = ensureRaggruppamentoDraft();
    // sincronizza lo stato P/A/NP letto dal DOM (i click sulle pillole aggiornano il draft in background, ma leggiamo anche qui per sicurezza)
    form.querySelectorAll('[data-att3select]').forEach(wrap=>{
      const pid = wrap.dataset.att3select;
      const stato = wrap.dataset.value;
      draft.squadra[pid] = draft.squadra[pid] || {stato:'P', gol:0, assist:0};
      draft.squadra[pid].stato = stato;
      if(stato!=='P'){ draft.squadra[pid].gol = 0; draft.squadra[pid].assist = 0; }
    });
    upsertEvent(eventId, UI.teamId, date, 'raggruppamento', {
      label: draft.label,
      torneoId: draft.torneoId || null,
      note: draft.note || '',
      dettagliata: !!draft.dettagliata,
      squadra: draft.squadra,
      miniPartite: draft.miniPartite.filter(mm=>mm.avversario||mm.risultato||mm.note),
      confermato: !!eventId,   // vedi il commento nel ramo 'allenamento' sopra
    });
    closeModal();
    return;
  }
});

/* =========================================================
   INIT
   ========================================================= */
/* =========================================================
   NOTIFICHE IN-APP (impegni + compleanni di oggi, con priorità
   per la squadra principale) — nessun permesso di sistema,
   nessun server: tutto calcolato al volo dai dati locali.
   ========================================================= */
function todaysReminders(){
  const iso = todayStr();
  const items = [];
  STATE.teams.forEach(team=>{
    // impegni di oggi per questa squadra
    STATE.events.filter(e=>e.teamId===team.id && e.date===iso).forEach(e=>{
      items.push({ kind:'event', teamId:team.id, teamName:team.nome, event:e, sortKey:'1'+team.nome });
    });
    // compleanni di oggi tra i giocatori in rosa in questa squadra
    rosterAt(team.id, null).forEach(r=>{
      if(isBirthdayToday(r.player.dataNascita)){
        items.push({ kind:'birthday', teamId:team.id, teamName:team.nome, player:r.player, sortKey:'0'+team.nome });
      }
    });
  });
  // priorità: squadra principale (se impostata) sempre prima; dentro ogni gruppo, compleanni prima degli impegni
  items.sort((a,b)=>{
    const aPrimary = a.teamId===STATE.primaryTeamId ? 0 : 1;
    const bPrimary = b.teamId===STATE.primaryTeamId ? 0 : 1;
    if(aPrimary!==bPrimary) return aPrimary-bPrimary;
    return a.sortKey.localeCompare(b.sortKey);
  });
  return items;
}
// Identificatore stabile di un promemoria (evento o compleanno), usato per capire quali
// sono "nuovi" rispetto all'ultima apertura del pannello notifiche. Per gli impegni è
// l'id dell'evento: resta lo stesso anche se lo si modifica in seguito (Object.assign in
// upsertEvent non tocca l'id), quindi un impegno già visto e poi solo aggiornato NON torna
// a contare come nuovo. Per i compleanni non c'è un id "evento": si usa squadra+giocatore,
// come già raggruppa todaysReminders (lo stesso giocatore in due squadre conta due volte).
function reminderId(item){
  return item.kind==='birthday' ? `birthday:${item.teamId}:${item.player.id}` : `event:${item.event.id}`;
}
function hasUnseenReminders(){
  return todaysReminders().some(it => !UI.notifSeenIds.has(reminderId(it)));
}
function modalNotifiche(){
  const items = todaysReminders();
  if(items.length===0){
    return `
      <div class="modal-head"><h2>Notifiche di oggi</h2><button data-action="close-modal">${icon('close')}</button></div>
      <div class="modal-scroll-body">
      <p class="muted">Nessun impegno o compleanno registrato per oggi.</p>
      </div>
    `;
  }
  return `
    <div class="modal-head"><h2>Notifiche di oggi</h2><button data-action="close-modal">${icon('close')}</button></div>
    <div class="modal-scroll-body">
    <p class="muted" style="margin-bottom:10px;">${STATE.primaryTeamId? 'Gli impegni e i compleanni della tua squadra principale compaiono per primi.' : 'Impostane una principale dalla Home per vederla sempre per prima qui.'}</p>
    ${items.map(it=>{
      const primaryTag = it.teamId===STATE.primaryTeamId ? ' ⭐' : '';
      if(it.kind==='birthday'){
        return `<div class="list-item">
          <span style="font-size:20px;">🎂</span>
          <div class="name-stack">
            <div class="name">${escapeHtml(it.player.nome)} ${escapeHtml(it.player.cognome)}</div>
            <div class="sub">Compleanno oggi · ${escapeHtml(it.teamName)}${primaryTag}</div>
          </div>
        </div>`;
      }
      return `<div class="list-item" data-action="open-notif-event" data-eventid="${it.event.id}" style="cursor:pointer;">
        <span style="font-size:20px;">${EVENT_ICON[it.event.type]}</span>
        <div class="name-stack">
          <div class="name">${escapeHtml(it.teamName)}${primaryTag}</div>
          <div class="sub">${eventSummary(it.event)}</div>
        </div>
      </div>`;
    }).join('')}
    </div>
  `;
}

function init(){
  loadState();
  const last = loadLastSelection();
  if(STATE.seasons.length>0){
    const seasonExists = last.seasonId && STATE.seasons.some(s=>s.id===last.seasonId);
    // fallback: l'ultima stagione creata (la più recente), non la prima come in passato
    UI.seasonId = seasonExists ? last.seasonId : STATE.seasons[STATE.seasons.length-1].id;
    const teams = teamsOfSeason(UI.seasonId);
    const teamExists = last.teamId && teams.some(t=>t.id===last.teamId);
    UI.teamId = teamExists ? last.teamId : (teams[0] ? teams[0].id : null);
  }
  if(last.statsMatchMode){ UI.statsMatchMode = last.statsMatchMode; }
  // Il modale del nome non si riapre da solo una volta che il mister l'ha già chiuso una
  // volta (con o senza aver scritto il nome): hasSeenInfoTip diventa true alla prima
  // chiusura di 'set-name' in ogni caso (closeModal(), render-modal.js), quindi è già,
  // di fatto, "l'introduzione è già stata vista" — nessun nuovo campo.
  if(!STATE.userName && !STATE.hasSeenInfoTip){ UI.modal = {type:'set-name', payload:{}}; }
  normalizeHistory({boot:true});   // voci di cronologia lasciate da un ricaricamento: prima del render, così la sync le trova già gestite
  render();
}
init();
