<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Touchline</title>
<meta name="description" content="App offline per la gestione di presenze, allenamenti e partite">
<meta name="theme-color" content="#04552B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Touchline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  :root{
    --pitch-deep:#04552B;
    --pitch:#00843D;
    --pitch-light:#22A85C;
    --chalk:#F6F4EC;
    --chalk-dim:#EAE6D8;
    --ink:#16231B;
    --ink-soft:#4A5A4F;
    --line:#D8D2BE;
    --gold:#F0A400;
    --gold-soft:#FCEACB;
    --gold-mid:#F6D68A;
    --ritardo:#D9691C;
    --ritardo-soft:#F7DCC4;
    --red:#B3432B;
    --red-soft:#F4DAD1;
    --blue:#2E5F8A;
    --blue-soft:#DCE7F0;
    --purple:#6B4C8A;
    --purple-soft:#E6DCEF;
    --radius:10px;
    --shadow:0 2px 10px rgba(15,61,40,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
  button,a,select,input,textarea{-webkit-tap-highlight-color:transparent;}
  /* Anello di focus. Prima c'era un "outline:none" globale (su button/a/
     select/input/textarea e su "button:focus"): a specificità più alta di
     un semplice :focus-visible, lo avrebbe battuto sempre — quindi va tolto,
     non "superato". Con :focus-visible su bottoni e link l'anello compare solo
     navigando da tastiera (il tocco resta identico a prima); su input e
     textarea compare anche al tocco, ed è voluto: prima un campo attivo non
     aveva alcun indicatore. */
  :focus-visible{outline:2px solid var(--pitch);outline-offset:2px;}
  /* sulla topbar --pitch su --pitch-deep farebbe solo 1.87:1: qui l'anello è chalk (8.15:1) */
  #topbar .icon-btn:focus-visible,select.top-select:focus-visible{outline-color:var(--chalk);}
  /* contenitori con overflow (hidden/auto) ritaglierebbero un anello esterno:
     qui l'anello sta dentro il bordo dell'elemento (offset negativo) */
  .seg button:focus-visible,.cdrop-item:focus-visible,.stats-sort-btn:focus-visible{outline-offset:-2px;}
  /* stesso motivo, stessa soluzione: i campi a piena larghezza (input, tendine,
     .btn.block) dentro .modal-scroll-body (overflow-y:auto rende auto anche
     overflow-x) e dentro .collapsible-section (overflow:hidden) toccano il bordo
     del contenitore, e la bottom nav tocca i lati dello schermo */
  .modal-scroll-body :focus-visible,.collapsible-section :focus-visible,#bottomnav button:focus-visible{outline-offset:-2px;}
  body{
    background:var(--chalk);
    color:var(--ink);
    font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:0;
  }
  body.has-bottomnav{ padding-bottom:88px; }
  h1,h2,h3,.display{
    font-family:ui-rounded,'Segoe UI Semibold','Avenir Next','Century Gothic',-apple-system,sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--pitch-deep);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
  }
  input,select,textarea{
    font-family:inherit;
    font-size:16px; /* evita lo zoom automatico di iOS Safari quando è sotto i 16px */
    color:var(--ink);
  }
  a{color:inherit;}

  /* ---- Header ---- */
  #topbar{
    position:sticky;top:0;z-index:20;
    background:var(--pitch-deep);
    color:var(--chalk);
    padding:14px;
    /* iPhone, app installata con barra di stato "black-translucent": la pagina è
       disegnata sotto orologio e notch. L'inset in alto spinge il contenuto della
       topbar sotto di essi, mentre lo sfondo verde resta a tutta altezza (come
       fa #bottomnav con l'inset in basso). Dove l'inset è 0 (desktop, Android,
       Safari) il padding resta 14px: aspetto invariato. "0px" con l'unità perché
       dentro calc() lo 0 senza unità non è valido; il padding:14px sopra fa da
       riserva per i browser che non conoscono env(). */
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    box-shadow:var(--shadow);
  }
  #topbar .row{display:flex;align-items:center;gap:8px;}
  #topbar .brand{
    font-family:inherit;font-weight:700;font-size:16px;color:var(--chalk);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  #topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block;}
  select.top-select{
    flex:1;min-width:0;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    color:var(--chalk);
    padding:11px 10px;
    border-radius:9px;
    font-size:15px;
    min-height:46px;
  }
  select.top-select option{color:var(--ink);}
  #topbar .icon-btn{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    color:var(--chalk);
    width:46px;height:46px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;position:relative;
  }
  .notif-dot{
    position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;
    background:var(--gold);border:2px solid var(--pitch-deep);
  }
  /* promemoria backup: puntino chiaro (chalk, 8.15:1 sulla topbar) con anello
     verde scuro che lo stacca dal glifo dell'icona; volutamente diverso dal
     puntino dorato della campanella e meno allarmante */
  .backup-dot{
    position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;
    background:var(--chalk);border:2px solid var(--pitch-deep);
  }

  /* ---- Birthday banner ---- */
  .banner{
    margin:10px 14px 0;
    background:var(--gold-soft);
    border:1px solid var(--gold);
    color:#5C3D0E;
    padding:10px 12px;
    border-radius:var(--radius);
    display:flex;align-items:center;gap:8px;
    font-size:14px;
  }
  .banner button.close{margin-left:auto;font-size:16px;color:#5C3D0E;}

  /* ---- Main ---- */
  #app-main{padding:14px;max-width:720px;margin:0 auto;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .section-title{
    font-family:inherit;font-weight:700;color:var(--pitch-deep);
    font-size:17px;margin-bottom:12px;
  }
  .muted{color:var(--ink-soft);font-size:13.5px;line-height:1.5;}
  .empty-state{
    text-align:center;padding:36px 16px;color:var(--ink-soft);
  }
  .empty-state .big{font-size:36px;margin-bottom:10px;}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 18px;border-radius:10px;font-size:15px;font-weight:700;
    background:var(--pitch);color:#fff;min-height:48px;
  }
  .btn:active{background:var(--pitch-deep);}
  .btn.secondary{background:var(--chalk-dim);color:var(--ink);}
  .btn.outline{background:transparent;border:1.5px solid var(--pitch);color:var(--pitch);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.ghost{background:transparent;color:var(--pitch-deep);padding:11px 14px;min-height:44px;font-weight:600;}
  .btn.block{width:100%;}
  .btn.sm{padding:10px 14px;font-size:14px;min-height:40px;}
  .btn:disabled{opacity:.45;}

  /* ---- Bottom nav ---- */
  #bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:#fff;border-top:1px solid var(--line);
    display:flex;
    box-shadow:0 -2px 10px rgba(0,0,0,.06);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  #bottomnav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:11px 2px 10px;color:var(--ink-soft);font-size:11px;font-weight:600;
    min-height:60px;
  }
  #bottomnav button .ic{font-size:23px;}
  #bottomnav button.active{color:var(--pitch);position:relative;}
  #bottomnav button.active::before{
    content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);
    width:20px;height:3px;border-radius:3px;background:var(--gold);
  }
  #bottomnav button.active .ic{transform:translateY(-1px);}

  /* ---- Calendar ---- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head .title{font-family:inherit;font-weight:700;font-size:17px;color:var(--pitch-deep);text-transform:capitalize;}
  .cal-head button.btn{min-height:44px;min-width:44px;padding:10px 16px;}
  .cal-title-btn{
    font-family:inherit;font-weight:700;font-size:17px;color:var(--pitch-deep);
    text-transform:capitalize;padding:8px 12px;border-radius:9px;min-height:44px;
  }
  .cal-title-btn:active{background:var(--chalk-dim);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--ink-soft);font-weight:700;padding-bottom:6px;}
  .cal-cell{
    aspect-ratio:1/1;border-radius:9px;background:var(--chalk-dim);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:4px 3px;position:relative;font-size:12px;color:var(--ink-soft);
    border:1.5px solid transparent;
    overflow:hidden;
  }
  .cal-cell.out{opacity:.35;}
  .cal-cell.weekend{background:#F0ECDC;}
  .cal-cell.has-events{background:#E4F1E9;}
  .cal-cell.today{border-color:var(--pitch);background:#fff;}
  .cal-cell.today.has-events{background:#DCEFE1;}
  /* line-height:1 esplicito: quello ereditato dal body (1.45) da solo bastava
     a far traboccare il contenuto della cella e tagliare le icone sotto, a
     ~400px di larghezza (cella quadrata di ~44px) */
  .cal-cell .num{font-weight:700;color:var(--ink);font-size:14px;line-height:1;}
  .cal-cell .dots{
    display:flex;
    margin-top:2px;
    justify-content:center;
    align-self:stretch;
    padding: 0 2px;
  }
  .cal-cell .dots .ev-emoji{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    position:relative;
  }
  .cal-cell .dots:has(.ev-emoji:nth-child(2)) .ev-emoji{
    font-size:16px;
  }
  .cal-cell .ev-count{
    position:absolute;top:-3px;right:-5px;
    font-size:7px;font-weight:700;line-height:1.2;
    color:#5C3D0E;background:var(--gold-mid);
    border-radius:4px;padding:0 2px;
  }
  /* badge "+N" per i tipi di evento oltre i primi 2 mostrati: ancorato
     all'ultima icona mostrata (stessa tecnica di .ev-count, ma sull'angolo
     opposto), non un indicatore separato sulla cella: a ~400px di larghezza
     non c'era margine sufficiente per farlo stare staccato senza rischiare
     di uscire dal bordo della cella o di toccare l'icona. */
  .cal-cell .ev-emoji .more-badge{
    position:absolute;bottom:-3px;right:-5px;
    font-size:7px;font-weight:700;line-height:1.2;
    color:#fff;background:var(--pitch-light);
    border-radius:4px;padding:0 2px;
  }
  /* Segno aggiuntivo (non solo colore) per "da confermare": un anello, non un
     puntino nell'angolo. Prima versione (puntino ::after, stessa tecnica di
     .notif-dot/.backup-dot) verificata via screenshot a schermo intero a 20px/16px:
     il colore si leggeva bene, il puntino no (poco più di un neo accanto
     all'icona, specialmente a 16px con 2 icone nella stessa cella).
     box-shadow (non border, che aggiungerebbe spazio nel box) disegna un anello
     pulito. UN SOLO anello attorno a .dots-group (il gruppo di icone del
     giorno), non uno per icona (vedi render-calendar.js): con 2 icone e 1px di
     gap, due anelli singoli da 2px ciascuno si sovrapponevano di 3px, una
     macchia unica invece di due cerchi distinti (screenshot reale, cella con
     allenamento+partita). .dots-group è un contenitore a parte, separato da
     .dots (che continua a centrare il gruppo nella cella con
     stretch+justify-content, invariati; il gap:1px tra le icone si è solo
     spostato qui sotto, dove ora vivono le icone): serve un bersaglio stretto
     attorno alle sole icone, non largo quanto .dots (che si estende su tutta
     la larghezza della cella per via di align-self:stretch). border-radius
     fisso (non 50%, che su 2 icone affiancate stirerebbe l'anello in
     un'ellisse) dà una forma a "pillola" con 2 icone e resta comunque vicino
     a un cerchio con 1 sola. */
  .cal-cell .dots-group{
    display:flex;
    align-items:center;
    gap:1px;
  }
  .cal-cell .dots-group.da-confermare{
    box-shadow:0 0 0 2px var(--gold);
    border-radius:12px;
  }
  /* torta compleanno: rimpicciolita e spinta nell'angolo vero, per non
     sovrapporsi al numero del giorno (centrato) nei giorni a due cifre */
  .cal-cell .cake{position:absolute;top:0;right:0;font-size:10px;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-soft);}
  .legend .item{display:flex;align-items:center;gap:6px;}

  /* ---- Lists ---- */
  .list-item{
    display:flex;align-items:center;gap:10px;padding:13px 4px;
    border-bottom:1px solid var(--chalk-dim);
    flex-wrap:wrap;row-gap:8px;
  }
  .list-item:last-child{border-bottom:none;}
  .avatar{
    width:40px;height:40px;border-radius:50%;background:var(--pitch-light);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;
  }
  .avatar-icon{font-size:19px;}
  .list-item .name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-item .sub{font-size:13px;color:var(--ink-soft);margin-top:1px;}
  .list-item .spacer{flex:1;}
  /* Involucro nome+sottotitolo impilati verticalmente accanto ad avatar/icona:
     senza min-width:0 qui, .name non riesce mai a restringersi abbastanza da
     far scattare il proprio text-overflow:ellipsis (le proprietà flex di
     .name contano solo se .name è esso stesso figlio diretto di un flex
     container, non quando è annidato in questo involucro). */
  .name-stack{flex:1;min-width:0;}
  .list-item .row-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .row-click-target{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;border-radius:8px;padding:2px;margin:-2px;}
  .row-click-target:active{background:var(--chalk-dim);}
  /* Cerchio visibile portato a 44px (lo standard di tocco già usato altrove,
     es. .action-trigger/.icon-btn) e area di tocco reale ulteriormente
     estesa a 52px tramite ::before invisibile, stessa tecnica di .info-icon.
     Margini verificati: 10px di gap dal .row-click-target adiacente e circa
     26px tra una riga e l'altra della lista — ampio spazio, nessun rischio
     di sovrapposizione. */
  .star-toggle{
    position:relative;
    width:44px;height:44px;flex-shrink:0;font-size:24px;color:var(--gold);
    display:flex;align-items:center;justify-content:center;border-radius:50%;
  }
  .star-toggle::before{
    content:'';position:absolute;inset:-4px;
  }
  .star-toggle:active{background:var(--chalk-dim);}

  .badge{
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;
  }
  .badge.blue{background:var(--blue-soft);color:var(--blue);}
  .badge.purple{background:var(--purple-soft);color:var(--purple);}
  .badge.green{background:#DCEFE1;color:var(--pitch-deep);}
  .badge.ritardo{background:var(--ritardo-soft);color:#5C3D0E;}

  /* ---- Forms ---- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
    width:100%;padding:12px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
    min-height:48px;
  }
  .field textarea{resize:vertical;min-height:80px;max-height:240px;overflow-y:auto;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .seg{display:flex;border:1.5px solid var(--pitch);border-radius:10px;overflow:hidden;}
  /* overflow-wrap: le etichette più lunghe (es. "Raggruppamenti") sono una
     singola parola senza spazi — senza questa proprietà il CSS di default
     non la spezza e trabocca dal bottone, tagliata dall'overflow:hidden
     del contenitore .seg qui sopra. */
  .seg button{flex:1;padding:13px 4px;font-size:14px;font-weight:700;color:var(--pitch);background:#fff;min-height:48px;overflow-wrap:break-word;}
  .seg button.active{background:var(--pitch);color:#fff;}

  /* =========================================================
     TENDINA PERSONALIZZATA (nessun <select> nativo)
     Il menu che si apre è disegnato interamente da noi: niente
     più popup squadrato del browser, coerente in ogni sua parte
     con lo stile dell'app.
     ========================================================= */
  .cdrop{position:relative;display:inline-flex;}
  .cdrop-menu{
    display:none;position:absolute;z-index:30;top:calc(100% + 6px);
    background:#fff;border:1.5px solid var(--pitch);border-radius:16px;
    box-shadow:0 8px 24px rgba(4,85,43,.18);overflow:hidden;min-width:180px;
  }
  .cdrop-menu.open{display:block;}
  .cdrop-menu.align-right{right:0;}
  .cdrop-menu.align-left{left:0;}
  /* flip-up: applicata via JS (positionCdropMenu in events.js) quando non
     c'è spazio sufficiente sotto il trigger nel viewport reale — apre il
     menu verso l'alto invece che verso il basso. max-height/overflow-y
     vengono impostati inline dalla stessa funzione, calcolati sullo spazio
     realmente disponibile sul lato scelto. */
  .cdrop-menu.flip-up{top:auto;bottom:calc(100% + 6px);}
  .cdrop-item{
    display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;font-weight:600;
    color:var(--ink);border-bottom:1px solid var(--line);min-height:46px;white-space:nowrap;
  }
  .cdrop-item:last-child{border-bottom:none;}
  .cdrop-item:active{background:var(--chalk-dim);}
  .cdrop-item.danger{color:var(--red);}
  .cdrop-item.is-current{color:var(--pitch);background:#DCEFE1;}

  /* tendina-azioni compatta (⋯) — pulsante circolare */
  .action-trigger{
    width:44px;height:44px;min-width:44px;border-radius:50%;
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
    font-weight:700;font-size:18px;flex-shrink:0;
  }
  .action-trigger:active{background:var(--chalk-dim);}

  /* bottone azione pericolosa circolare (es. elimina impegno nel dettaglio
     giorno) — stessa dimensione/ruolo di .action-trigger, colori dalla
     coppia --red-soft/--red già usata da .badge.ritardo e .btn.danger. */
  .delete-icon-btn{
    width:44px;height:44px;min-width:44px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--red-soft);background:var(--red-soft);color:var(--red);font-size:18px;
  }
  .delete-icon-btn:active{background:var(--red);color:#fff;}

  /* selettore di presenza a pillola */
  .att-pill{
    display:inline-flex;align-items:center;gap:6px;
    min-height:46px;padding:11px 16px;border-radius:23px;
    font-size:14px;font-weight:700;font-family:inherit;border:1.5px solid var(--line);
    background-color:#fff;color:var(--ink-soft);white-space:nowrap;
  }
  .att-pill .cdrop-caret{font-size:11px;opacity:.65;display:inline-flex;vertical-align:middle;}

  .cdrop-field{width:100%;}
  .field-select-trigger{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    min-height:50px;padding:12px 8px 12px 16px;border-radius:16px;
    font-size:16px;font-weight:600;font-family:inherit;border:1.5px solid var(--line);
    background:var(--chalk);color:var(--ink);text-align:left;
  }
  .field-select-trigger .field-select-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .field-select-trigger .cdrop-caret{
    font-size:13px;color:#fff;flex-shrink:0;
    width:24px;height:24px;border-radius:50%;background:var(--pitch);
    display:flex;align-items:center;justify-content:center;
  }
  .field-select-empty{
    padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);
    background:var(--chalk-dim);color:var(--ink-soft);font-size:15px;
  }

  /* pulsante + fisso in basso a destra, sopra la bottom nav quando presente */
  .fab{
    position:fixed;right:18px;bottom:24px;z-index:15;
    width:56px;height:56px;border-radius:50%;
    background:var(--pitch);color:#fff;border:2.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 3px 10px rgba(4,85,43,.35);
  }
  .fab:active{background:var(--pitch-deep);}
  body.has-bottomnav .fab{bottom:calc(88px + 14px);}

  .search-bar{position:relative;margin-bottom:12px;}
  .search-bar .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:17px;display:flex;pointer-events:none;}
  .search-bar input{width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--line);border-radius:23px;background:#fff;min-height:46px;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .sort-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .sort-row label{font-size:12.5px;color:var(--ink-soft);font-weight:600;flex-shrink:0;}
  .sort-row select{flex:1;}

  .tile-grid{display:flex;flex-direction:column;gap:12px;}
  .tile{
    display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:18px;text-align:left;min-height:76px;
  }
  .tile:active{background:var(--chalk-dim);}
  .tile-icon{font-size:28px;flex-shrink:0;width:44px;display:flex;align-items:center;justify-content:center;color:var(--pitch);}
  .tile-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .tile-label{font-family:inherit;font-weight:700;font-size:16px;color:var(--pitch-deep);}
  .tile-sub{font-size:12.5px;color:var(--ink-soft);}

  .note-display{
    white-space:pre-wrap;word-break:break-word;
    max-height:180px;overflow-y:auto;
    background:var(--chalk-dim);border-radius:8px;padding:10px 12px;
    font-size:13.5px;line-height:1.5;
  }
  .detail-section{margin-bottom:16px;}
  .detail-section:last-child{margin-bottom:0;}
  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--chalk-dim);font-size:13.5px;}
  .detail-row:last-child{border-bottom:none;}

  .goal-input{width:60px;min-height:44px;padding:8px;border:1.5px solid var(--line);border-radius:8px;text-align:center;font-size:16px;}
  .stepper{display:inline-flex;align-items:center;gap:5px;}
  .stepper .goal-input{width:40px;padding:8px 2px;}
  .stepper-btn{
    width:36px;height:36px;border-radius:8px;flex-shrink:0;
    background:var(--chalk-dim);color:var(--pitch-deep);font-weight:800;font-size:18px;
    border:1.5px solid var(--line);
  }
  .stepper-btn:active{background:var(--pitch-light);color:#fff;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,35,25,.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:#fff;border-radius:16px 16px 0 0;max-width:720px;width:100%;
    max-height:90vh;max-height:90dvh;overflow-y:auto;padding:16px;
    animation:slideup .18s ease-out;
    /* senza: una volta raggiunto il limite di scroll del modale, trascinare
       ancora incatena lo scroll a body (unico antenato scrollabile sopra
       .overlay, che non ha overflow proprio) — muovendo la schermata di
       sfondo invece del contenuto del modale. */
    overscroll-behavior:contain;
  }
  /* .modal-split: usata solo da "Andamento giocatore" (l'unica modale in cui
     è stato osservato il bleed-through dello sticky durante lo scroll/
     rimbalzo su Chrome Android). Invece di un header sticky che condivide
     l'area di scroll col resto del contenuto (sempre soggetto a race di
     compositing sul layer sticky), qui l'header è realmente statico, fuori
     dall'area scrollabile: struttura a colonna flex, testata fissa +
     corpo scrollabile a parte. L'overlap che causa il bleed-through
     diventa strutturalmente impossibile, non solo mitigato. */
  .modal.modal-split{display:flex;flex-direction:column;overflow:hidden;}
  .modal.modal-split .modal-head{position:static;transform:none;will-change:auto;z-index:auto;flex-shrink:0;}
  .modal-scroll-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  @keyframes slideup{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  /* z-index esplicito: senza, un .cdrop più avanti nel DOM (es. le tendine
     dei campi) vince lo stacking sullo sticky header non appena vi scorre
     sotto e ci disegna sopra — resta comunque sotto ai menu .cdrop-menu
     aperti (z-index:30), che devono continuare a coprire tutto quando attivi. */
  /* padding-bottom (non margin-bottom): lo spazio sotto il titolo deve far
     parte del box coperto dallo sfondo bianco dello sticky header — un
     margine lì sotto resterebbe scoperto, lasciando intravedere qualunque
     contenuto a tinta piena (es. il tab attivo verde in "Andamento
     giocatore") scorra esattamente in quella fascia. 18px = i 14px di
     margine di prima + i 4px di padding già presenti, stesso spazio visivo.
     IMPORTANTE: un elemento subito sotto NON deve usare margin-top negativo
     per avvicinarsi al titolo — essendo questo spazio ora opaco (padding,
     non margine) e con z-index proprio, un margine negativo lo farebbe
     finire dentro il box di .modal-head e verrebbe disegnato sotto di lui,
     invisibile fin dal primo render (bug osservato e corretto in
     "Andamento giocatore": vedi i <p class="muted"> subito sotto
     .modal-head in render-modal.js/events.js, senza margin-top).
     transform:translateZ(0) + will-change:transform: forzano un layer
     di compositing GPU stabile e sempre promosso per questo sticky, invece
     di lasciare che Chrome (soprattutto su Android) lo promuova/rimuova
     dinamicamente durante lo scroll — la promozione/rimozione ripetuta
     è la causa nota di un bug di compositing in cui, per un frame, questo
     elemento viene disegnato nell'ordine sbagliato rispetto agli altri
     layer della pagina, lasciando intravedere sopra il titolo contenuto
     già scrollato oltre o perfino la schermata sotto il modale. */
  .modal-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;background:#fff;padding-bottom:18px;transform:translateZ(0);will-change:transform;}
  /* min-width:0 + ellipsis: l'h2 è già figlio diretto del flex .modal-head
     (a differenza del caso .list-item .name, qui non serve nessun involucro
     aggiuntivo). Senza, un titolo lungo — tipicamente un nome/soprannome
     giocatore in "Andamento giocatore" — spinge fuori dal modale il
     pulsante "✕" invece di troncarsi. Su titoli statici brevi (la
     stragrande maggioranza) non ha alcun effetto visibile. */
  .modal-head h2{font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .modal-head button{font-size:22px;color:var(--ink-soft);width:44px;height:44px;flex-shrink:0;}
  @media (min-width:600px){
    .overlay{align-items:center;}
    .modal{border-radius:16px;}
  }

  .warn-tri{color:var(--gold);font-size:15px;cursor:pointer;flex-shrink:0;}
  /* Impegno "da confermare" (presenze/convocati non ancora rivisti dopo la creazione):
     stesso colore --gold già usato per attenzione (.warn-tri, .notif-dot), non uno stato di
     presenza (verde/arancio/rosso/viola restano quelli). Regola generica: usata sia sulle
     icone del calendario sia su quelle di modalDay/modalEventDetail. */
  .da-confermare{color:var(--gold);}
  .collapsible-section{
    overflow:hidden;
    max-height:0;
    transition:max-height .25s ease;
  }
  .collapsible-section.open{
    max-height:5000px;
  }
  .minimatch-row{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .switch{position:relative;width:52px;height:30px;background:var(--line);border-radius:20px;flex-shrink:0;}
  .switch.on{background:var(--pitch);}
  .switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch.on .knob{left:25px;}

  table.stats{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.stats th,table.stats td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--chalk-dim);white-space:nowrap;}
  table.stats th{color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:0;}
  /* colonna nome: fissa (sticky) durante lo scroll orizzontale, quindi senza
     un limite di larghezza un nome molto lungo la farebbe crescere quanto
     serve, occupando gran parte dello schermo in modo permanente e lasciando
     poco spazio per scorrere le colonne di statistiche. Il nome troncato
     resta comunque recuperabile toccando la riga (apre l'andamento del
     giocatore) — niente title, inutilizzabile in modo affidabile al tocco. */
  table.stats td:first-child,table.stats th:first-child{
    text-align:left;position:sticky;left:0;background:#fff;
    max-width:110px;overflow:hidden;text-overflow:ellipsis;
  }
  table.stats td:first-child{cursor:pointer;}
  .stats-sort-btn{
    width:100%;padding:7px 6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    background:none;border:none;white-space:nowrap;min-height:44px;
  }
  .stats-sort-btn.active{color:var(--pitch);font-weight:700;}
  table.stats th:first-child .stats-sort-btn{text-align:left;}
  .stats-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .chip-select{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:10px 15px;border-radius:20px;font-size:13.5px;font-weight:600;border:1.5px solid var(--line);background:#fff;min-height:40px;}
  .chip.active{background:var(--pitch-deep);color:#fff;border-color:var(--gold);}

  .card-preview{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--chalk);}
  .card-preview h3{font-size:15px;margin-bottom:2px;}
  .card-preview .stat-line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px;}

  /* opacity:1 esplicito: Firefox applica di suo opacity:.54 ai placeholder,
     quindi senza questa riga il colore effettivo sarebbe più chiaro di quello
     dichiarato (e il contrasto calcolato per #6F7568, 4.75:1 su bianco,
     non varrebbe più). */
  ::placeholder{color:#6F7568;opacity:1;}

  /* ---- Icona info ----
     Cerchio visibile a 30px (proporzionato anche accanto ai titoli più
     corti, es. "Stagioni"), ma area di tocco reale estesa a 38px tramite
     uno pseudo-elemento invisibile — via di mezzo verificata per non
     sovrapporsi al campo sottostante nelle etichette di campo (6px di
     margine) né allo switch "campi avanzati" nelle righe con toggle. */
  .info-icon{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:var(--chalk-dim);color:var(--pitch-deep);
    font-size:15px;font-weight:700;border:1.5px solid var(--line);
    margin-left:6px;vertical-align:middle;
  }
  .info-icon::before{
    content:'';position:absolute;inset:-4px;
  }
  .info-icon:active{background:var(--pitch);color:#fff;}
  .title-with-info{display:flex;align-items:center;gap:0;}
  .info-body{font-size:18px;line-height:1.7;color:var(--ink);}
  .info-body strong{font-weight:700;}
  .info-body .muted{font-size:15.5px;line-height:1.6;}
  .info-body p{margin:0 0 10px;}
  .info-body p:last-child{margin-bottom:0;}

  /* ---- Stampa / Esporta PDF ---- */
  #print-area{display:none;}
  @media print{
    @page { size: auto; margin: 0; }
    body.printing > #topbar,
    body.printing > #banner-zone,
    body.printing > #app-main,
    body.printing > #bottomnav,
    body.printing > #modal-zone{ display:none !important; }
    body.printing{ padding-bottom:0; background:#fff; }
    body.printing #print-area{
      display:block !important;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
      font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    .pcard{max-width:640px;margin:20px auto;border:1px solid #E5E0D0;border-radius:18px;overflow:hidden;}
    .pcard-header{background:#04552B;color:#fff;padding:30px 32px 26px;position:relative;}
    .pcard-header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:5px;background:#F0A400;}
    .pcard-eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.85;margin-bottom:8px;}
    .pcard-name{font-size:29px;font-weight:700;margin:0 0 6px;color:#fff;}
    .pcard-sub{font-size:13.5px;opacity:.9;}
    .pcard-stats-grid{display:grid;grid-template-columns:1fr 1fr;}
    .pcard-stat{padding:18px 22px;border-bottom:1px solid #EFECE0;border-right:1px solid #EFECE0;}
    .pcard-stat.pcard-stat-right{border-right:none;}
    .pcard-stat-value{font-size:23px;font-weight:700;color:#04552B;}
    .pcard-stat-label{font-size:11px;color:#6b6b60;margin-top:3px;text-transform:uppercase;letter-spacing:.03em;}
    .pcard-group-label{grid-column:1/-1;padding:14px 22px 2px;font-size:10.5px;font-weight:700;color:#6b6b60;text-transform:uppercase;letter-spacing:.05em;}
    .pcard-group-label:not(:first-child){border-top:1px solid #EFECE0;margin-top:4px;}
    .pcard-note{margin:22px 24px;padding:14px 16px;background:#FCEACB;border-radius:10px;font-size:12.5px;color:#5C3D0E;white-space:pre-wrap;line-height:1.5;}
    .pcard-footer{padding:14px 22px;text-align:center;font-size:10px;letter-spacing:.04em;color:#999;border-top:1px solid #EFECE0;text-transform:uppercase;}
  }
</style>
</head>
<body>
  <div id="topbar"></div>
  <div id="banner-zone"></div>
  <div id="app-main"></div>
  <div id="bottomnav"></div>
  <div id="modal-zone"></div>
  <div id="popup-zone"></div>
  <div id="print-area"></div>

<script>
/* =========================================================
   STATO & PERSISTENZA
   ========================================================= */
let STATE = {
  meta: { updatedAt: null },  // per l'indicatore di versione dati
  userName: null,      // nome/nickname per i saluti personalizzati
  clubName: null, // nome societa/club (facoltativo), separato dalla categoria
  hasSeenInfoTip: false, // popup di benvenuto sulle icone ⓘ, mostrato una sola volta
  players: [],       // {id, nome, cognome, dataNascita, soprannome, cardNote, homeCardNote}
  seasons: [],        // {id, nome}
  teams: [],           // {id, seasonId, nome, mode:'semplice'|'dettagliata', cardFields:[...]}
  assignments: [],      // {id, teamId, playerId, dataIngresso, dataUscita|null}
  tournaments: [],        // {id, nome, regole, teamId|null}
  events: [],              // {id, teamId, date, type, note, ...}
  primaryTeamId: null       // squadra principale: i suoi impegni/compleanni hanno priorità nelle notifiche
};
let UI = {
  screen: 'home',             // home (fuori da ogni squadra) | team (dentro una squadra)
  view: 'calendario',        // rilevante solo se screen==='team': calendario | squadra | tornei | stats | scheda
  seasonId: null,
  teamId: null,
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  modal: null,                // {type, payload}
  popup: null,                 // {kind:'alert'|'confirm', message, danger, confirmLabel, onConfirm} — indipendente da "modal", si sovrappone senza sostituirlo
  bannerDismissed: false,
  // campana piena/vuota: id dei promemoria (impegni/compleanni di oggi) già mostrati
  // all'ultima apertura del pannello notifiche — non un semplice booleano "ho guardato
  // oggi", perché un promemoria nuovo arrivato DOPO un'apertura precedente deve poter
  // riaccendere la campana nella stessa sessione (vedi reminderId/hasUnseenReminders in
  // events.js). Di sessione come prima (mai in STATE/localStorage): un riavvio dell'app
  // "dimentica" i promemoria già visti, esattamente come già succedeva oggi.
  notifSeenIds: new Set(),
  statsTournamentFilter: '',
  statsMatchMode: 'totale',   // 'totale' | 'partita' | 'raggruppamento' — colonne partita-simili in Statistiche
  cardFields: null,           // override temporaneo campi scheda
  cardPlayerId: null,
  // le note della scheda (squadra/generale) vivono su player.cardNote /
  // player.homeCardNote, non qui: sono dati persistenti legati al
  // giocatore, non stato UI effimero — vedi savePlayerData/renderSchedaView
  homeSeasonId: null,         // stagione scelta in home per statistiche/scheda generali
  homePlayerId: null,
  homeCardFields: null,
  anagraficaSearch: '',
  anagraficaFilter: 'tutti',      // tutti | assegnati | non-assegnati
  anagraficaSort: 'alfabetico',   // alfabetico | nascita | prossimo-compleanno
  rosterSearch: '',
  rosterSort: 'alfabetico',
  addExistingPlayerSearch: '',
  statsSortKey: null,             // colonna su cui è ordinata la tabella statistiche
  statsSortDir: 'asc'
};
window.STATE = STATE;
window.UI = UI;

// Cronologia / tasto Indietro (vedi render-modal.js, "CRONOLOGIA E TASTO INDIETRO").
// Costanti da regolare a mano: una riga ciascuna, nessun altro punto da toccare.
const EXIT_WINDOW_MS = 2500;       // doppio Indietro da Home: tempo entro cui il secondo Indietro esce dall'app (dopo, si ricomincia)
const NORMALIZE_TIMEOUT_MS = 1500; // attesa massima del popstate dopo un history.go() nostro: scaduta, si riallinea lo stato senza altri go()
const RELOAD_RELEASE_MS = 3000;    // dopo location.reload() (asincrono) la sync resta sospesa per questo tempo: se la pagina si ricarica non riparte mai; se il ricarico non parte, riprende da sola
const HISTORY_MAX_DEPTH = 7;       // profondità massima plausibile (guardia 1 + schermata 3 + scheda 1 + modale 1 + popup 1, S1/2b: avviso/conferma/info è un solo campo, mai una pila): oltre, lo stato non è affidabile e non si tenta nessun go()

function enterTeam(teamId){
  UI.teamId = teamId;
  UI.screen = 'team';
  UI.view = 'calendario';
  // calYear/calMonth sono stato globale (non per squadra, vedi UI sopra):
  // senza reset, il mese lasciato navigato sulla squadra precedente
  // "sopravviverebbe" a questo ingresso, mostrando un mese diverso da
  // quello corrente sulla nuova squadra.
  UI.calYear = new Date().getFullYear();
  UI.calMonth = new Date().getMonth();
  UI.bannerDismissed = false;
  render();
}
function enterSeason(seasonId){
  UI.seasonId = seasonId;
  UI.screen = 'season-teams';
  render();
}
function goHome(){
  UI.screen = 'home';
  UI.teamId = null;
  render();
}
function backOneLevel(){
  if(UI.screen==='team' && UI.view!=='calendario'){ UI.view='calendario'; }   // da una scheda diversa dal Calendario: prima si torna al Calendario
  else if(UI.screen==='team'){ UI.screen='season-teams'; UI.teamId=null; }
  else if(UI.screen==='season-teams'){ UI.screen='seasons'; }
  else { UI.screen='home'; }
  render();
}

const DEFAULT_CARD_FIELDS = ['presAll','assAll','ritAll','percAll','presPart','assPart','percPart','gol','assist'];
/* =========================================================
   ICONE VETTORIALI (nessuna dipendenza esterna, monocolore
   tramite currentColor — sostituiscono le emoji di navigazione)
   ========================================================= */
const ICONS = {

  trophy: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="9" y1="18" x2="15" y2="18"/></svg>',
  chartbar: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><rect x="5" y="13" width="3.2" height="8"/><rect x="10.4" y="8" width="3.2" height="13"/><rect x="15.8" y="4" width="3.2" height="17"/></svg>',

/* =========================================================
   VERSIONE SCHEMA DATI & MIGRAZIONE
   -----------------------------------------------------------
   Ogni volta che la FORMA dei dati salvati cambia (nuovo campo
   che sostituisce un vecchio, nuovo formato di un valore, ecc.),
   aggiungere qui un nuovo blocco "if(v < N)" che trasforma i dati
   vecchi nel nuovo formato, poi alzare CURRENT_SCHEMA_VERSION.
   Così chi ha già dati salvati (localStorage o backup .json) con
   una versione precedente dell'app non perde nulla quando apre
   una versione più recente: i suoi dati vengono aggiornati al
   volo, in automatico, la prima volta che vengono caricati.
   ========================================================= */
const CURRENT_SCHEMA_VERSION = 3;
window.CURRENT_SCHEMA_VERSION = CURRENT_SCHEMA_VERSION;

/* ---- Liste dei dati: cosa deve avere un file di backup per essere accettato ----
   LISTE_BACKUP_OBBLIGATORIE: l'insieme MINIMO richiesto. Sono le 6 liste di oggi e
     NON si toccano mai (un file a cui ne manca anche una viene rifiutato).
   LISTE_BACKUP_FACOLTATIVE: qui va ogni lista NUOVA che si aggiungerà in futuro a
     STATE. Nello stesso commit: aggiungere in migrateState un blocco "if(v < N)" che
     la crea vuota nei dati vecchi e alzare CURRENT_SCHEMA_VERSION. Così i backup
     precedenti (senza quella lista) restano importabili.
   Perché non si deduce da Object.keys(STATE): una lista nuova diventerebbe
   obbligatoria per sbaglio e i backup già esistenti verrebbero rifiutati.
   (test_import_backup.js ha due test-guardia su questo elenco.) */
const LISTE_BACKUP_OBBLIGATORIE = Object.freeze(['players','seasons','teams','assignments','tournaments','events']);
const LISTE_BACKUP_FACOLTATIVE = [];

function migrateState(data){
  if(!data || typeof data!=='object') return data;
  let v = (data.meta && typeof data.meta.schemaVersion==='number') ? data.meta.schemaVersion : 0;
  const events = Array.isArray(data.events) ? data.events : [];

  // v0 -> v1: "presente" booleano sostituito da "stato" ('P'/'A'/'NP'); aggiunti note/cartellini.
  if(v < 1){
    events.forEach(e=>{
      if(!e || typeof e!=='object') return; // salta voci corrotte/nulle senza bloccare le altre
      try{
        if(e.type==='partita' && e.giocatori && typeof e.giocatori==='object'){
          Object.keys(e.giocatori).forEach(pid=>{
            const g = e.giocatori[pid];
            if(g && typeof g==='object'){
              if(g.stato===undefined){
                g.stato = g.presente===false ? 'A' : 'P';
                delete g.presente;
              }
              if(g.gol===undefined) g.gol = 0;
              if(g.assist===undefined) g.assist = 0;
              if(g.giallo===undefined) g.giallo = 0;
              if(g.rosso===undefined) g.rosso = false;
            }
          });
        }
        if(e.type==='raggruppamento' && e.squadra && typeof e.squadra==='object'){
          Object.keys(e.squadra).forEach(pid=>{
            const g = e.squadra[pid];
            if(g && typeof g==='object'){
              if(g.stato===undefined){
                g.stato = g.presente ? 'P' : 'A';
                delete g.presente;
              }
              if(g.gol===undefined) g.gol = 0;
            }
          });
        }
        if(e.note===undefined) e.note = '';
      }catch(err){ console.warn('Migrazione: voce evento ignorata per errore', err, e); }
    });
    data.events = events;
    v = 1;
  }

  // v1 -> v2: i tornei diventano un'entità per-squadra (nuovo campo teamId),
  // per evitare che un torneo condiviso mescoli dati di categorie diverse.
  // Un torneo già esistente non ha teamId: lo deduciamo dagli eventi che lo
  // referenziano SOLO quando è deducibile senza ambiguità (una sola squadra
  // coinvolta) — altrimenti resta teamId:null ("non assegnato"), senza
  // toccare alcun evento: l'utente lo assegna riaprendo "Modifica" dalla
  // squadra giusta (schermata Tornei, sezione "non ancora assegnati").
  if(v < 2){
    const tournaments = Array.isArray(data.tournaments) ? data.tournaments : [];
    tournaments.forEach(t=>{
      if(!t || typeof t!=='object') return;
      if(t.teamId!==undefined) return; // già migrato
      try{
        const teamIds = new Set(events.filter(e=>e && e.torneoId===t.id && e.teamId).map(e=>e.teamId));
        t.teamId = teamIds.size===1 ? [...teamIds][0] : null;
      }catch(err){ t.teamId = null; }
    });
    data.tournaments = tournaments;
    v = 2;
  }

  // v2 -> v3: nuovo campo "confermato" sugli impegni (segnale "da confermare" nel
  // calendario: colore diverso sull'icona finché il mister non riapre e salva le presenze/
  // i convocati). Tutti gli impegni già esistenti (dispositivo o backup importati) risultano
  // confermati: il segnale riguarda solo gli impegni creati DOPO questa versione.
  if(v < 3){
    events.forEach(e=>{
      if(!e || typeof e!=='object') return;
      if(e.confermato===undefined) e.confermato = true;
    });
    data.events = events;
    v = 3;
  }

  data.meta = data.meta || {};
  data.meta.schemaVersion = v; // non alterare al ribasso: se i dati arrivano già da una versione più recente, la lasciamo com'è
  return data;
}

// Controlla che un file già letto con JSON.parse sembri un backup di Touchline (criterio C3):
// un oggetto con TUTTE le liste obbligatorie presenti, ogni lista è una lista e ogni voce è
// un oggetto non nullo. Le liste facoltative, se presenti, devono avere la stessa forma.
// Non guarda meta, schemaVersion né gli altri campi. Va chiamata sul file grezzo, PRIMA di
// migrateState (che "aggiusterebbe" alcune liste rotte nascondendo il problema).
function validaBackup(d){
  if(d===null || typeof d!=='object') return {ok:false, motivo:'non è un oggetto'};
  if(Array.isArray(d)) return {ok:false, motivo:'è una lista, non un oggetto'};
  const controlla = (k, obbligatoria) => {
    if(d[k]===undefined) return obbligatoria ? 'manca la lista "'+k+'"' : null;
    if(!Array.isArray(d[k])) return '"'+k+'" non è una lista';
    const i = d[k].findIndex(x => x===null || typeof x!=='object' || Array.isArray(x));
    return i>=0 ? '"'+k+'" contiene una voce non valida (posizione '+i+')' : null;
  };
  for(const k of LISTE_BACKUP_OBBLIGATORIE){ const m = controlla(k, true); if(m) return {ok:false, motivo:m}; }
  for(const k of LISTE_BACKUP_FACOLTATIVE){ const m = controlla(k, false); if(m) return {ok:false, motivo:m}; }
  return {ok:true, motivo:''};
}

const STORAGE_KEY = 'gestione-presenze-calcio-v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ STATE = Object.assign(STATE, migrateState(JSON.parse(raw))); }
  }catch(e){ console.error('Errore lettura dati salvati sul dispositivo', e); }
  if(!STATE.meta) STATE.meta = { updatedAt: null, schemaVersion: CURRENT_SCHEMA_VERSION };
  // per chi aveva già dati prima del promemoria: fissa ora la data di partenza,
  // PRIMA che un nuovo salvataggio sovrascriva meta.updatedAt
  ensureFirstDataDate();
}

// Ultima selezione dell'utente (stagione/squadra, vista statistiche...): comodità
// di navigazione locale al dispositivo, non dato applicativo — chiave separata da
// STORAGE_KEY apposta, così non finisce nel backup esportato/importato.

/* =========================================================
   PROMEMORIA BACKUP
   -----------------------------------------------------------
   Due date in una chiave localStorage SEPARATA da STORAGE_KEY (come
   LAST_SELECTION_KEY): non sono dati applicativi, quindi non finiscono mai
   in STATE, in STATE.meta né nel file di backup, e l'import non le tocca.
     lastExportAt  quando l'utente ha CONFERMATO l'ultima esportazione. Dice
                   che il download è stato avviato, non che il file sia stato
                   salvato al sicuro (l'app non può saperlo).
     firstDataAt   quando ci sono stati per la prima volta dati su questo
                   dispositivo. Per chi aveva già dati prima di questa
                   funzione non esiste una data di creazione: si parte dalla
                   data dell'ultima modifica (meta.updatedAt), vedi
                   ensureFirstDataDate.
   Il promemoria compare se i dati sono cambiati dopo l'ultimo export E sono
   passati BACKUP_REMINDER_DAYS giorni dall'ultimo export; se non c'è mai stato
   un export, se sono passati dai primi dati. Mai bloccante.
   ========================================================= */
const BACKUP_REMINDER_DAYS = 14; // giorni dopo i quali compare il promemoria del backup
const BACKUP_INFO_KEY = 'touchline-backup-info';
function loadBackupInfo(){
  try{
    const raw = localStorage.getItem(BACKUP_INFO_KEY);
    const info = raw ? JSON.parse(raw) : {};
    return info && typeof info==='object' ? info : {};
  }catch(e){ return {}; }
}
function saveBackupInfo(patch){
  try{
    localStorage.setItem(BACKUP_INFO_KEY, JSON.stringify(Object.assign(loadBackupInfo(), patch)));
  }catch(e){ /* localStorage non disponibile: il promemoria semplicemente non compare */ }
}
function hasAnyData(){
  return ['players','seasons','teams','events','tournaments'].some(k => Array.isArray(STATE[k]) && STATE[k].length>0);
}
let firstDataDateKnown = false;
// Registra la data dei primi dati, una sola volta. Chiamata dopo il caricamento
// (chi ha già dati parte dalla loro ultima modifica) e dopo ogni salvataggio
// riuscito (chi parte da zero: la data del primo salvataggio). Non fa nulla se
// non ci sono dati o se la data c'è già.
function ensureFirstDataDate(){
  if(firstDataDateKnown) return;
  try{
    if(!hasAnyData()) return;
    if(!isNaN(Date.parse(loadBackupInfo().firstDataAt))){ firstDataDateKnown = true; return; }
    const upd = STATE.meta && STATE.meta.updatedAt;
    saveBackupInfo({ firstDataAt: !isNaN(Date.parse(upd)) ? upd : new Date().toISOString() });
    firstDataDateKnown = true;
  }catch(e){ /* mai far fallire caricamento o salvataggio per il promemoria */ }
}
// Restituisce null (nessun promemoria) oppure {mai, da, giorni}: mai = nessun
// export finora; da = data (ms) da cui si contano i giorni; giorni = giorni interi.
// "now" è un parametro solo per poter provare le soglie nei test.
function backupReminder(now){
  try{
    if(!hasAnyData()) return null;
    const info = loadBackupInfo();
    const nowMs = (now || new Date()).getTime();
    const last = Date.parse(info.lastExportAt);
    const soglia = BACKUP_REMINDER_DAYS * 86400000;
    if(!isNaN(last)){
      if(!(Date.parse(STATE.meta && STATE.meta.updatedAt) > last)) return null; // nessuna modifica dopo l'export
      if(nowMs - last < soglia) return null;
      return { mai:false, da:last, giorni:Math.floor((nowMs - last) / 86400000) };
    }
    const first = Date.parse(info.firstDataAt);
    if(isNaN(first) || nowMs - first < soglia) return null;
    return { mai:true, da:first, giorni:Math.floor((nowMs - first) / 86400000) };
  }catch(e){ return null; }
}
let saveTimer = null;
let saveDirty = false; // true = c'è una modifica non ancora scritta su disco
// Scrive STATE su disco e restituisce true/false. Non mostra nessun avviso: lo fa chi la
// chiama (performSave per i salvataggi normali, l'import per il suo commit protetto).
function scriviStato(){
  // updatedAt/schemaVersion vengono "committi" su STATE.meta solo se il
  // salvataggio va a buon fine — altrimenti il banner "aggiornato il" nel
  // modale di backup mostrerebbe l'istante del tentativo fallito, facendo
  // credere che l'ultima modifica sia salvata quando invece non lo è.
  // schemaVersion non si abbassa mai: se i dati caricati o importati arrivano da
  // una versione più recente dell'app, restano etichettati con la loro versione.
  // Riscriverli con quella di questa app farebbe rieseguire, alla prossima
  // apertura con l'app più recente, migrazioni già applicate a quei dati.
  const versioneDati = STATE.meta && typeof STATE.meta.schemaVersion==='number' ? STATE.meta.schemaVersion : 0;
  const meta = Object.assign({}, STATE.meta, {
    updatedAt: new Date().toISOString(),
    schemaVersion: Math.max(CURRENT_SCHEMA_VERSION, versioneDati)
  });
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.assign({}, STATE, {meta})));
    STATE.meta = meta;
    ensureFirstDataDate(); // chi parte da zero: data del primo salvataggio (non lancia mai)
    return true;
  }
  catch(e){
    console.error('Errore salvataggio', e);
    return false;
  }
}
function performSave(){
  saveDirty = false;
  if(!scriviStato()){
    showAlert('Impossibile salvare: lo spazio del browser potrebbe essere pieno. Esporta un backup per non perdere i dati inseriti finora.');
  }
}
function saveState(){
  STATE.meta = STATE.meta || {};
  saveDirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(performSave, 150);
}
// Scrive subito, scavalcando il debounce di 150ms, se e solo se c'è
// davvero una modifica in sospeso — altrimenti non fa nulla (es. l'app va
// in background senza che l'utente abbia toccato niente: nessuna scrittura
// superflua, nessun updatedAt aggiornato senza motivo).
// Serve perché su mobile l'OS può sospendere/terminare una pagina in
// background senza mai lasciar scadere un setTimeout già schedulato: senza
// questo flush, l'ultima modifica fatta "un attimo prima" di cambiare app o
// bloccare lo schermo rischierebbe di non essere mai scritta.
function flushPendingSave(){
  if(!saveDirty) return;
  clearTimeout(saveTimer);
  performSave();
}
// visibilitychange (hidden): scatta sia chiudendo/navigando via dalla
// pagina sia — caso più frequente su mobile per questa app — mettendola
// semplicemente in background (cambio app, blocco schermo), senza che la
// pagina venga mai davvero "scaricata". pagehide: rete di sicurezza
// aggiuntiva per la chiusura/navigazione vera e propria, compatibile con la
// bfcache (a differenza di beforeunload/unload, volutamente non usati qui:
// beforeunload è noto per essere inaffidabile su mobile e la sua sola
// presenza disabilita la bfcache in molti browser, senza alcun vantaggio
// per un'app a pagina singola come questa).
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden') flushPendingSave();
});
window.addEventListener('pagehide', flushPendingSave);
function formatDateTimeIt(iso){
  if(!iso) return 'mai';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return 'mai';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yy} alle ${hh}:${mi}`;
}

// giocatori assegnati alla squadra ad una certa data (null = oggi, usa "attivi ora")
function rosterAt(teamId, dateStr){
  const rows = STATE.assignments.filter(a=>a.teamId===teamId);
  return rows.filter(a=>{
    if(dateStr){
      if(a.dataIngresso && a.dataIngresso > dateStr) return false;
      if(a.dataUscita && a.dataUscita < dateStr) return false;
      return true;
    }
    return !a.dataUscita;
  }).map(a=>({ assignment:a, player:getPlayer(a.playerId) })).filter(r=>r.player)
    .sort((a,b)=> (a.player.nome+a.player.cognome).localeCompare(b.player.nome+b.player.cognome));
}

function initials(p){
  if(p.soprannome && p.soprannome.trim()){
    const parts = p.soprannome.trim().split(/\s+/);
    if(parts.length>1) return (parts[0][0]+parts[1][0]).toUpperCase();
    return parts[0].slice(0,2).toUpperCase();
  }
  return ((p.nome||'?')[0]+(p.cognome? p.cognome[0]:'')).toUpperCase();
}
function displayName(p){
  return (p.soprannome && p.soprannome.trim()) ? p.soprannome.trim() : `${p.nome||''} ${p.cognome||''}`.trim();
}
// "Nome Cognome" reale, MAI il soprannome: è il nome che compare nella scheda
// (anteprima e stampa/PDF, che va ai genitori) e ne ricava il nome del file.
// Ogni parte è ripulita separatamente, così un cognome vuoto non lascia spazi
// in coda. Restituisce '' se nome e cognome sono entrambi vuoti (es. dati
// importati da un backup): chi la usa per stampare deve gestire questo caso.
function fullName(p){
  return `${(p.nome||'').trim()} ${(p.cognome||'').trim()}`.trim();
}
// Etichetta di un giocatore nei selettori e nell'elenco "Giocatore esistente":
// "Soprannome (Nome Cognome)" se il soprannome c'è, altrimenti "Nome Cognome".
// Se nome e cognome sono vuoti mostra il solo soprannome (mai "()"); se manca
// tutto, un trattino, così l'opzione non resta una riga vuota.
function playerOptionLabel(p){
  const nick = (p.soprannome||'').trim();
  const full = fullName(p);
  if(nick && full) return `${nick} (${full})`;
  return nick || full || '—';
}

function eventsOnDate(teamId, dateStr){
  return STATE.events.filter(e=>e.teamId===teamId && e.date===dateStr);
}

// Default orario per un nuovo Allenamento: ultimo allenamento passato della
// stessa squadra nello stesso giorno della settimana della data che si sta
// inserendo; se non c'è, ultimo allenamento passato in generale della stessa
// squadra; se non c'è nessun allenamento, 18:00 fisso. "Passato" è relativo
// alla data del NUOVO evento (dateStr), non a oggi: pianificare in anticipo
// un allenamento futuro guarda comunque all'ultimo allenamento prima di
// quella data, anche se anch'esso è nel futuro rispetto a oggi.
function defaultOrarioAllenamento(teamId, dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const weekday = new Date(y, m-1, d).getDay();
  const past = STATE.events.filter(e=> e.teamId===teamId && e.type==='allenamento' && e.date<dateStr && e.orario);
  const sameWeekday = past.filter(e=>{
    const [ey,em,ed] = e.date.split('-').map(Number);
    return new Date(ey,em-1,ed).getDay()===weekday;
  });
  const pick = (sameWeekday.length? sameWeekday : past).sort((a,b)=> b.date.localeCompare(a.date))[0];
  return pick ? pick.orario : '18:00';
}

// Default orario per una nuova Partita: orario dell'ultima partita passata
// della stessa squadra (per data dell'impegno, senza timestamp di
// inserimento nel modello dati); se non c'è nessuna partita, 15:00 fisso.
function defaultOrarioPartita(teamId, dateStr){
  const past = STATE.events.filter(e=> e.teamId===teamId && e.type==='partita' && e.date<dateStr && e.orario);
  const pick = past.sort((a,b)=> b.date.localeCompare(a.date))[0];
  return pick ? pick.orario : '15:00';
}

const DURATA_DEFAULT_MINUTI = 90; // usata solo per il calcolo di
  // sovrapposizione quando l'evento non ha una durata specificata,
  // non viene mai scritta nei dati salvati

function orarioInMinuti(orario){
  if(!orario) return null;
  const [h,m] = orario.split(':').map(Number);
  if(Number.isNaN(h) || Number.isNaN(m)) return null;
  return h*60 + m;
}

function eventiSiSovrappongono(a, b){
  const inizioA = orarioInMinuti(a.orario);
  const inizioB = orarioInMinuti(b.orario);
  if(inizioA===null || inizioB===null) return false;
  const fineA = inizioA + (a.durata || DURATA_DEFAULT_MINUTI);
  const fineB = inizioB + (b.durata || DURATA_DEFAULT_MINUTI);
  return inizioA < fineB && inizioB < fineA;
}

// % presenza allenamenti "pesata" sul ritardo: un ritardo vale ritardoWeight%
// di una presenza piena invece del 100% (usata sia dalla tabella statistiche
// sia dal riepilogo andamento giocatore, unica fonte per evitare che la
// formula venga copiata a mano in più punti)
function calcPercAllPonderata(stats, ritardoWeight){
  if(!stats.totAll) return null;
  return (stats.presAll - stats.ritAll*(1-ritardoWeight/100)) / stats.totAll;
}

function isBirthdayToday(dataNascita){
  if(!dataNascita) return false;
  const [,m,d] = dataNascita.split('-');
  const t = new Date();
  return (Number(m)-1)===t.getMonth() && Number(d)===t.getDate();
}
// Giorni mancanti al prossimo compleanno (0 = oggi), ignorando l'anno.
// Chi ha appena festeggiato non risulta "imminente": si ricalcola sull'anno successivo.
function daysUntilNextBirthday(dataNascita){
  if(!dataNascita) return Infinity;
  const [,mm,dd] = dataNascita.split('-').map(Number);
  const today = new Date(); today.setHours(0,0,0,0);
  let next = new Date(today.getFullYear(), mm-1, dd);
  if(next < today) next = new Date(today.getFullYear()+1, mm-1, dd);
  return Math.round((next - today) / 86400000);
}
function matchesSearch(player, query){
  if(!query) return true;
  const q = query.trim().toLowerCase();
  if(!q) return true;
  return `${player.nome} ${player.cognome} ${player.soprannome||''}`.toLowerCase().includes(q);
}
function isPlayerAssigned(playerId){
  return STATE.assignments.some(a=>a.playerId===playerId && !a.dataUscita);
}
// Normalizza un input libero nel formato "numero-numero" (risultato mini-
// partita): estrae le cifre digitate, scarta tutto il resto — qualunque
// carattere non numerico digitato tra le due cifre diventa così, di fatto,
// il separatore — e tiene al più due gruppi di cifre.
function normalizeRisultato(value){
  const gruppi = String(value||'').match(/\d+/g) || [];
  return gruppi.slice(0,2).join('-');
}

// Tutte le squadre a cui un giocatore è mai stato assegnato (anche assignment
// storici, non solo quelli attivi) — usata per capire con quali altri
// giocatori "condivide una rosa" ai fini del controllo soprannome duplicati.
function teamIdsOfPlayer(pid){
  return new Set(STATE.assignments.filter(a=>a.playerId===pid).map(a=>a.teamId));
}

// Regola "soprannome duplicato": due giocatori diversi non possono avere lo
// stesso soprannome (case-insensitive, trim) se condividono almeno una
// squadra. contextTeamId copre il caso di un giocatore nuovo non ancora
// assegnato (l'assignment non esiste ancora al momento del controllo).
function findSoprannomeConflict(pid, soprannome, contextTeamId){
  const sopr = (soprannome||'').trim().toLowerCase();
  if(!sopr) return null;
  const scope = teamIdsOfPlayer(pid);
  if(contextTeamId) scope.add(contextTeamId);
  if(scope.size===0) return null;
  const other = STATE.players.find(p=>{
    if(p.id===pid) return false;
    if((p.soprannome||'').trim().toLowerCase()!==sopr) return false;
    const otherTeams = teamIdsOfPlayer(p.id);
    for(const t of otherTeams){ if(scope.has(t)) return true; }
    return false;
  });
  if(!other) return null;
  return `Il soprannome "${soprannome.trim()}" è già usato da ${other.nome} ${other.cognome}, che condivide una squadra con questo giocatore. Scegline uno diverso.`;
}

// Regola "identità duplicata": due giocatori non possono avere lo stesso
// nome+cognome se hanno anche lo stesso soprannome (incluso il caso in cui
// entrambi lo lascino vuoto). Ambito globale su tutta l'anagrafica, perché
// l'Anagrafica generale e le statistiche per stagione non sono filtrate per
// squadra e mostrerebbero comunque i due giocatori fianco a fianco.
function findPlayerConflict(pid, data, contextTeamId){
  const nome = (data.nome||'').trim().toLowerCase();
  const cognome = (data.cognome||'').trim().toLowerCase();
  const sopr = (data.soprannome||'').trim().toLowerCase();
  const other = STATE.players.find(p=>{
    if(p.id===pid) return false;
    return (p.nome||'').trim().toLowerCase()===nome
      && (p.cognome||'').trim().toLowerCase()===cognome
      && (p.soprannome||'').trim().toLowerCase()===sopr;
  });
  if(other){
    const vuoto = !sopr;
    return `Esiste già un giocatore con lo stesso nome e cognome (${other.nome} ${other.cognome}) e lo stesso soprannome${vuoto?' (entrambi senza soprannome)':''}. Aggiungi un soprannome per distinguerli.`;
  }
  return findSoprannomeConflict(pid, data.soprannome, contextTeamId);
}
function sortPlayersBy(players, mode){
  const arr = players.slice();
  if(mode==='nascita'){
    arr.sort((a,b)=>{
      if(!a.dataNascita && !b.dataNascita) return 0;
      if(!a.dataNascita) return 1;
      if(!b.dataNascita) return -1;
      return a.dataNascita.localeCompare(b.dataNascita);
    });
  } else if(mode==='prossimo-compleanno'){
    arr.sort((a,b)=> daysUntilNextBirthday(a.dataNascita) - daysUntilNextBirthday(b.dataNascita));
  } else {
    arr.sort((a,b)=>(a.nome+a.cognome).localeCompare(b.nome+b.cognome));
  }
  return arr;
}

/* =========================================================
   VALIDAZIONE NOMI DUPLICATI (stagioni / squadre / tornei)
   Stesso principio già usato per i giocatori (findPlayerConflict):
   blocco rigido con avviso esplicativo, nessuna conferma-e-procedi.
   ========================================================= */
// Espande un anno scritto a 2 cifre alla forma a 4 cifre (prefisso "20"
// fisso: dedurre un secolo diverso non è un caso realistico per questa
// app). Cifre di lunghezza diversa da 2 restano invariate. Condivisa tra
// normalizeSeasonName e findSimilarTeamNameHint.
function expandTwoDigitYear(digits){
  return digits.length===2 ? '20'+digits : digits;
}
// Normalizza un nome stagione per il confronto duplicati: minuscolo, spazi
// tagliati, separatori diversi (spazio, "-", "/") ridotti a uno solo, così
// "26-27" e "26/27" vengono riconosciute come la stessa stagione.
// Se il nome è "puro" (solo cifre e separatori, es. "26/27", "2026-27"),
// ogni anno a 2 cifre viene anche espanso a 4 prima di normalizzare i
// separatori, così "26/27" e "2026-27" risultano la stessa stagione. Nomi
// con lettere (es. "Torneo Estivo 25") non vengono toccati dall'espansione:
// solo i separatori vengono normalizzati, come già accadeva prima.
function normalizeSeasonName(nome){
  const trimmed = (nome||'').trim().toLowerCase();
  const SEP = /[\s\-‐-―\/]+/g;
  if(/^[\d\s\-‐-―\/]+$/.test(trimmed)){
    const expanded = trimmed.replace(/\d+/g, expandTwoDigitYear);
    return expanded.replace(SEP,'/');
  }
  return trimmed.replace(SEP,'/');
}
function findSeasonNameConflict(sid, nome){
  const norm = normalizeSeasonName(nome);
  if(!norm) return null;
  const other = STATE.seasons.find(s=> s.id!==sid && normalizeSeasonName(s.nome)===norm);
  if(!other) return null;
  return `Esiste già una stagione con questo nome ("${other.nome}"). Scegline uno diverso.`;
}
// Ambito: solo dentro la stessa stagione (lo stesso nome squadra, es. "Under
// 12", è ammesso in stagioni diverse).
function findTeamNameConflict(tid, nome, seasonId){
  const norm = (nome||'').trim().toLowerCase();
  if(!norm) return null;
  const other = STATE.teams.find(t=> t.id!==tid && t.seasonId===seasonId && (t.nome||'').trim().toLowerCase()===norm);
  if(!other) return null;
  return `Esiste già una squadra con questo nome in questa stagione ("${other.nome}"). Scegline uno diverso.`;
}

// Separa un nome nel testo che precede l'ultimo gruppo di cifre e il gruppo
// stesso (es. "Piccoli amici 2020" -> {testo:"piccoli amici", numero:"2020"}).
// Nomi che non terminano con un numero restano fuori da questo controllo.
function splitTrailingNumber(nome){
  const m = /^(.*?)(\d+)\s*$/.exec((nome||'').trim());
  if(!m) return null;
  return { testo: m[1].trim().toLowerCase().replace(/\s+/g,' '), numero: m[2] };
}
// Avviso NON bloccante (a differenza di findTeamNameConflict): nome squadra
// che sembra la stessa cosa di un'altra già esistente nella stessa stagione,
// con l'anno finale scritto in forma abbreviata/estesa diversa (es. "Piccoli
// amici 2020" vs "Piccoli amici 20"). Il testo prima del numero deve
// corrispondere esattamente, per evitare falsi positivi su nomi solo
// vagamente simili (es. "Under 12" vs "Under 14" non scatta mai: i numeri
// espansi restano diversi). Un nome identico in tutto e per tutto è già
// coperto dal blocco rigido di findTeamNameConflict, non da questa funzione.
function findSimilarTeamNameHint(tid, nome, seasonId){
  const parsed = splitTrailingNumber(nome);
  if(!parsed) return null;
  const other = STATE.teams.find(t=>{
    if(t.id===tid || t.seasonId!==seasonId) return false;
    const parsedOther = splitTrailingNumber(t.nome);
    if(!parsedOther || parsedOther.testo!==parsed.testo) return false;
    if(parsedOther.numero===parsed.numero) return false; // duplicato esatto: gestito altrove
    return expandTwoDigitYear(parsedOther.numero)===expandTwoDigitYear(parsed.numero);
  });
  if(!other) return null;
  return `Sembra molto simile a "${other.nome}", già presente in questa stagione.`;
}
// Ambito: solo dentro la stessa squadra (i tornei sono un'entità per-squadra, teamId).
function findTournamentNameConflict(tid, nome, teamId){
  const norm = (nome||'').trim().toLowerCase();
  if(!norm) return null;
  const other = STATE.tournaments.find(t=> t.id!==tid && t.teamId===teamId && (t.nome||'').trim().toLowerCase()===norm);
  if(!other) return null;
  return `Esiste già un torneo con questo nome per questa squadra ("${other.nome}"). Scegline uno diverso.`;
}

function deleteSeasonData(sid){
  const teamIds = teamsOfSeason(sid).map(t=>t.id);
  STATE.teams = STATE.teams.filter(t=>t.seasonId!==sid);
  STATE.assignments = STATE.assignments.filter(a=>!teamIds.includes(a.teamId));

}
function deleteTeamData(tid){
  STATE.assignments = STATE.assignments.filter(a=>a.teamId!==tid);
  STATE.events = STATE.events.filter(e=>e.teamId!==tid);
  STATE.teams = STATE.teams.filter(t=>t.id!==tid);
  if(STATE.primaryTeamId===tid) STATE.primaryTeamId = null;

}
function savePlayerData(pid, data){
  if(pid){
    const pl = getPlayer(pid);
    Object.assign(pl, data);
    setLastAction(`Giocatore "${data.nome||pl.nome} ${data.cognome||pl.cognome}" modificato`);
  } else {
    const pl = {id:uid(), ...data};
    STATE.players.push(pl);
    setLastAction(`Giocatore "${data.nome} ${data.cognome}" aggiunto`);
    saveState();
    return pl;
  }
  saveState();
  return getPlayer(pid);
}
function assignPlayerToTeam(playerId, teamId, dataIngresso){
  STATE.assignments.push({id:uid(), teamId, playerId, dataIngresso: dataIngresso||todayStr(), dataUscita:null});
  saveState();
}
function removeFromTeamConfirmed(assignmentId, dataUscita){
  const a = STATE.assignments.find(x=>x.id===assignmentId);
  if(a){ a.dataUscita = dataUscita || todayStr(); saveState(); }
}
function deletePlayerPermanently(pid){
  STATE.players = STATE.players.filter(p=>p.id!==pid);
  STATE.assignments = STATE.assignments.filter(a=>a.playerId!==pid);
  STATE.events.forEach(e=>{
    if(e.presenze) delete e.presenze[pid];
    if(e.giocatori) delete e.giocatori[pid];
    if(e.squadra) delete e.squadra[pid];
  });
  saveState();
}
function saveTournamentData(tid, data){
  if(tid){
    Object.assign(STATE.tournaments.find(t=>t.id===tid), data);
  } else {
    STATE.tournaments.push({id:uid(), ...data});
  }
  saveState();
}
function deleteTournamentData(tid){
  STATE.tournaments = STATE.tournaments.filter(t=>t.id!==tid);
  STATE.events.forEach(e=>{ if(e.torneoId===tid) e.torneoId=''; });
  // Se il torneo eliminato era quello attualmente usato per filtrare la
  // tabella statistiche, il filtro torna davvero a "Tutte" — non solo
  // nell'etichetta (già sistemata in customFieldSelect), ma anche nel dato
  // che decide quali eventi entrano nel calcolo.
  if(UI.statsTournamentFilter===tid){ UI.statsTournamentFilter=''; }
  saveState();
}
// Unico punto che crea o modifica un impegno: chiamata da 4 rami del submit in events.js
// (generale/allenamento/partita/raggruppamento), sempre con l'intero form già letto. Non
// esiste oggi un percorso che aggiorni solo alcuni campi di un impegno esistente (es. solo
// l'orario, senza la sezione presenze/convocati per i tre tipi che ce l'hanno): il campo
// "confermato" (allenamento/partita/raggruppamento) si appoggia proprio su questo, vedi il
// commento nel ramo 'allenamento' del submit. Se in futuro si aggiunge un percorso di
// modifica parziale, quel presupposto va riverificato.
function upsertEvent(eventId, teamId, date, type, data){
  const typeLabel = EVENT_LABEL[type] || 'Impegno';
  if(eventId){
    const e = STATE.events.find(x=>x.id===eventId);
    Object.assign(e, data);
  } else {
    STATE.events.push({id:uid(), teamId, date, type, ...data});
  }
  setLastAction(`${typeLabel} del ${formatIt(date)}`);
  saveState();
}
function deleteEventData(eventId){
  STATE.events = STATE.events.filter(e=>e.id!==eventId);
  saveState();
}

// "Standalone" = l'app è già installata/aggiunta alla Home. Due segnali indipendenti:
// (a) lo standard display-mode (Chrome/Edge/Android; Safari recenti se c'è un manifest
//     valido — qui vale solo per la versione ospitata in dist/, non per app.html aperto
//     come file locale, che non ha un manifest raggiungibile);
// (b) navigator.standalone, il segnale storico di iOS per "Aggiungi a Home" — resta
//     necessario proprio per il caso "file locale senza manifest" su iPhone/iPad.
// Avvolta in try/catch: window.matchMedia non esiste in ogni ambiente (jsdom, i nostri
// test, non lo implementa) e non deve mai far fallire renderTopbar()/render(). Nessun
// listener di cambio: la modalità standalone non cambia a sessione di pagina aperta.
function isStandaloneMode(){
  try{
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  }catch(e){}
  try{
    if(window.navigator && window.navigator.standalone === true) return true;
  }catch(e){}
  return false;
}

function renderTopbar(){
  const el = document.getElementById('topbar');
  // campana piena/vuota come la stella (starFilled/starOutline): stesso stato di prima
  // (hasUnseenReminders(), invariato), calcolato una sola volta e riusato sia per la
  // scelta dell'icona sia per il pallino — non possono più disallinearsi tra loro.
  // Il pallino (.notif-dot) è stato tolto: un solo segnale (la campana stessa), non due
  // insieme. data-bell (come data-star sulla stellina) è solo per i test: un
  // <button><svg>...</svg></button> non ha un textContent utile da verificare.
  const unread = hasUnseenReminders();
  // promemoria backup: puntino chiaro sull'icona del backup (id fisso: dopo un export
  // lo si nasconde direttamente nel DOM, senza render(), vedi hideBackupReminderUI)
  const backupBadge = backupReminder() ? '<span class="backup-dot" id="backup-dot"></span>' : '';
  const installBtn = isStandaloneMode() ? '' : `<button class="icon-btn" data-action="show-info" data-infokey="installa" title="Come installare l'app">${icon('phone')}</button>`;
  const installBackup = `${installBtn}<button class="icon-btn" data-action="open-notifiche" data-bell="${unread?'filled':'outline'}" title="Notifiche">${unread?icon('bellFilled'):icon('bell')}</button><button class="icon-btn" data-action="open-backup" title="Backup e ripristino">${icon('sync')}${backupBadge}</button>`;

  if(UI.screen==='team' && currentTeam()){
    const team = currentTeam();
    const season = getSeason(team.seasonId);
    el.innerHTML = `
      <div class="row">
        <button class="icon-btn" data-action="nav-back" title="Indietro">${icon('chevronLeft')}</button>
        <span class="brand" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(team.nome)}</span>
        ${installBackup}
      </div>
      <div class="muted" style="color:rgba(246,244,236,.65);font-size:12px;margin-top:4px;">${escapeHtml(season?season.nome:'')}</div>`;
    return;
  }

  const subScreenTitles = {
    'seasons': 'Stagioni',
    'season-teams': getSeason(UI.seasonId) ? escapeHtml(getSeason(UI.seasonId).nome) : 'Squadre',
    'anagrafica': 'Anagrafica generale',
    'stats-generali': 'Statistiche e scheda generali'
  };
  if(subScreenTitles[UI.screen]){
    el.innerHTML = `
      <div class="row">
        <button class="icon-btn" data-action="nav-back" title="Indietro">${icon('chevronLeft')}</button>
        <span class="brand" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${subScreenTitles[UI.screen]}</span>
        ${installBackup}
      </div>`;
    return;
  }

  el.innerHTML = `<div class="row"><span class="brand"><span class="dot"></span>Gestione Squadra</span><span style="flex:1;"></span>${installBackup}</div>`;
}

function renderBanner(){

function rosterFiltered(team){
  let roster = rosterAt(team.id, null).filter(r=>matchesSearch(r.player, UI.rosterSearch));
  if(UI.rosterSort==='nascita'){
    roster.sort((a,b)=>{
      const da=a.player.dataNascita, db=b.player.dataNascita;
      if(!da && !db) return 0; if(!da) return 1; if(!db) return -1;
      return da.localeCompare(db);
    });
  } else if(UI.rosterSort==='prossimo-compleanno'){
    roster.sort((a,b)=> daysUntilNextBirthday(a.player.dataNascita) - daysUntilNextBirthday(b.player.dataNascita));
  } else {
    roster.sort((a,b)=>(a.player.nome+a.player.cognome).localeCompare(b.player.nome+b.player.cognome));
  }
  return roster;
}

  presAll:  {label:'Presenze totali allenamenti', fmt:s=>`${s.presAll}/${s.totAll}`, group:'allenamenti'},
  assAll:   {label:'Assenze allenamenti', fmt:s=>s.assAll, group:'allenamenti'},

  presPart: {label:'Presenze tot. partite+raggr.', fmt:s=>s.presPart, group:'partite'},
  assPart:  {label:'Assenze partite+raggr.', fmt:s=>s.assPart, group:'partite'},
  percPart: {label:'% Presenza partite+raggr.', fmt:s=>pct(s.percPart), group:'partite'},
  presPartita: {label:'Presenze tot. partite', fmt:s=>s.presPartita, group:'partite'},
  assPartita:  {label:'Assenze partite', fmt:s=>s.assPartita, group:'partite'},
  percPartita: {label:'% Presenza partite', fmt:s=>pct(s.percPartita), group:'partite'},
  presRaggr:   {label:'Presenze tot. raggruppamenti', fmt:s=>s.presRaggr, group:'partite'},
  assRaggr:    {label:'Assenze raggruppamenti', fmt:s=>s.assRaggr, group:'partite'},
  percRaggr:   {label:'% Presenza raggruppamenti', fmt:s=>pct(s.percRaggr), group:'partite'},
  gol:      {label:'Gol segnati', fmt:s=>s.gol, group:'partite'},

  giallo:   {label:'Cartellini gialli', fmt:s=>s.giallo, group:'partite'},
  rosso:    {label:'Cartellini rossi', fmt:s=>s.rosso, group:'partite'},
};

// Divide un elenco di chiavi CARD_FIELD_DEFS scelte dall'utente nei due
// gruppi "allenamenti"/"partite", mantenendo l'ordine di scelta originale.
function groupCardFields(fields){
  const groups = {allenamenti:[], partite:[]};
  (fields||[]).forEach(k=>{
    const def = CARD_FIELD_DEFS[k];
    if(!def) return;
    (groups[def.group] || groups.partite).push(k);
  });
  return groups;
}

// Genera le righe .stat-line dell'anteprima (card-preview), divise in due
// sezioni con intestazione (Allenamenti / Partite e raggruppamenti); una
// sezione senza campi scelti non viene mostrata.
function cardPreviewGroupsHtml(fields, stats){
  if(!stats) return '';
  const groups = groupCardFields(fields);
  const statLine = k=>{
    const def = CARD_FIELD_DEFS[k];
    return `<div class="stat-line"><span>${def.label}</span><strong>${def.fmt(stats)}</strong></div>`;
  };
  const section = (keys, title) => keys.length? `
    <div class="muted" style="text-transform:uppercase;letter-spacing:.05em;font-size:11px;margin-top:10px;">${title}</div>
    ${keys.map(statLine).join('')}
  ` : '';
  return section(groups.allenamenti, 'ALLENAMENTI') + section(groups.partite, 'PARTITE E RAGGRUPPAMENTI');
}
